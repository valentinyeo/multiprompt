name: Link picker

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Optional published release tag
        type: string
  schedule:
    - cron: '20 3 * * *'

permissions:
  contents: read

concurrency:
  group: link-picker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  link-picker:
    uses: ./.github/workflows/verify.yml
    with:
      feature: link-picker
      tag: ${{ inputs.tag || '' }}
