name: Service route receipt

on:
  pull_request:
    paths:
      - 'service/worker.js'
      - 'service/test/secrets.test.js'
      - '.claude/skills/verify-multiprompt/features/service-route-receipt.md'
      - '.github/workflows/service-route-receipt.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: service-route-receipt-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Build the Worker and run the secrets test on head and on the base source
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/input"
          set +e
          (cd service && npm ci --no-audit --no-fund --prefer-offline && npx wrangler deploy --dry-run --outdir .build)
          node --test --test-reporter=tap service/test/secrets.test.js > "$RUNNER_TEMP/input/head.log" 2>&1
          echo "head=$?" >> "$GITHUB_ENV"
          if [ -n "$BASE_SHA" ]; then
            git worktree add --detach "$RUNNER_TEMP/base" "$BASE_SHA"
            cp service/test/secrets.test.js "$RUNNER_TEMP/base/service/test/secrets.test.js"
            (cd "$RUNNER_TEMP/base/service" && npm ci --no-audit --no-fund --prefer-offline && npx wrangler deploy --dry-run --outdir .build)
            (cd "$RUNNER_TEMP/base" && node --test --test-reporter=tap service/test/secrets.test.js) > "$RUNNER_TEMP/input/base.log" 2>&1
            echo "base=$?" >> "$GITHUB_ENV"
          fi
      - name: Write the receipt
        shell: bash
        run: |
          set +e
          if [ -n "$BASE_SHA" ]; then
            node tools/ci-receipt-summary.mjs "$RUNNER_TEMP/receipt" secrets "$RUNNER_TEMP/input/head.log" "$head" '^(ok|not ok) [0-9]+ - |^# (pass|fail) ' "$RUNNER_TEMP/input/base.log" "$base"
          else
            node tools/ci-receipt-summary.mjs "$RUNNER_TEMP/receipt" secrets "$RUNNER_TEMP/input/head.log" "$head" '^(ok|not ok) [0-9]+ - |^# (pass|fail) '
          fi
          echo "receipt=$?" >> "$GITHUB_ENV"
          true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: service-route-receipt
          path: ${{ runner.temp }}/receipt/
          if-no-files-found: error
      - name: Fail when the head test or the receipt failed
        run: test "$head" = 0 && test "$receipt" = 0
