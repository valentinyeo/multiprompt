name: Account service bundle

on:
  push:
    branches: [ceo/IGSH-1172-generic]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Bundle account service
        working-directory: service
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx wrangler deploy --dry-run --outdir .build
          git rev-parse HEAD > .build/source-commit.txt
          find .build -type f ! -name SHA256SUMS -exec sha256sum {} \; > .build/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: account-service-bundle
          path: service/.build/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
