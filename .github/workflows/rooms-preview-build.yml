name: Rooms preview build

on:
  schedule:
    - cron: '20 5 * * *'
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install Zig 0.16.0
        uses: ./.github/actions/setup-zig
      - name: Build with Rooms compiled in
        run: zig build -Dtarget=x86_64-windows-gnu -Drooms-preview=true --summary all
