name: Released large-history switching
run-name: Large-history switches ${{ inputs.tag || 'latest' }}
on:
  schedule:
    - cron: '24 3 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag
        required: false
        type: string
permissions:
  contents: read
jobs:
  released-switches:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Keep LF line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Test measurement controls
        run: node --test tools/switch-performance.test.mjs
      - name: Download and authenticate published executable
        shell: pwsh
        run: |
          if (-not $env:RELEASE_TAG) {
            $env:RELEASE_TAG = gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" --jq .tag_name
            if ($LASTEXITCODE -ne 0) { throw 'Latest release lookup failed' }
          }
          "RELEASE_TAG=$env:RELEASE_TAG" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw 'Invalid release tag' }
          New-Item -ItemType Directory -Force released | Out-Null
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --dir released --pattern multiprompt-x64.exe --pattern zigshell-bridge-x64.exe --pattern 'SHA256SUMS.txt*'
          if ($LASTEXITCODE -ne 0) { throw 'Release download failed' }
          node --input-type=module -e "import fs from 'node:fs'; import crypto from 'node:crypto'; const manifest=fs.readFileSync('released/SHA256SUMS.txt'); const raw=Buffer.from(fs.readFileSync('src/release_signing_public_key.txt','utf8').trim(),'base64'); const key=crypto.createPublicKey({key:Buffer.concat([Buffer.from('302a300506032b6570032100','hex'),raw]),format:'der',type:'spki'}); if(!crypto.verify(null,manifest,key,fs.readFileSync('released/SHA256SUMS.txt.sig'))) throw Error('Invalid signature'); for(const name of ['multiprompt-x64.exe','zigshell-bridge-x64.exe']) { const bytes=fs.readFileSync('released/'+name); const hash=crypto.createHash('sha256').update(bytes).digest('hex'); if(!manifest.toString().split(/\r?\n/).some(line=>line.trim()===hash+'  '+name)) throw Error('Release digest mismatch'); if(name==='multiprompt-x64.exe'&&!bytes.includes(Buffer.from('MPVERSION='+process.env.RELEASE_TAG.slice(1)+';'))) throw Error('Version mismatch'); }"
          if ($LASTEXITCODE -ne 0) { throw 'Release authentication failed' }
          Copy-Item released/multiprompt-x64.exe released/multiprompt.exe
          Copy-Item released/zigshell-bridge-x64.exe released/zigshell-bridge.exe
      - name: Install fixture compiler
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP/zig.zip"
          Invoke-WebRequest https://ziglang.org/download/0.16.0/zig-x86_64-windows-0.16.0.zip -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne '68659eb5f1e4eb1437a722f1dd889c5a322c9954607f5edcf337bc3684a75a7e') { throw 'Zig checksum mismatch' }
          tar -xf $zip -C $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { throw 'Zig extraction failed' }
          "$env:RUNNER_TEMP/zig-x86_64-windows-0.16.0" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: Build transport fixtures only
        shell: pwsh
        run: |
          zig cc -target x86_64-windows-gnu -municode -O2 tools/verify-chat-delivery/launcher.c -o released/ssh.exe
          if ($LASTEXITCODE -ne 0) { throw 'SSH fixture build failed' }
          zig cc -target x86_64-windows-gnu -municode -mwindows -O2 tools/verify-chat-delivery/launcher.c -o released/tmux.exe
          if ($LASTEXITCODE -ne 0) { throw 'tmux fixture build failed' }
      - name: Switch fifty times through 400 MiB history
        shell: powershell
        run: ./tools/switch-performance.ps1 -Exe released/multiprompt.exe -Evidence evidence/released -Revision "$env:RELEASE_TAG" -SwitchOnly
      - name: Require every visible switch below 200 ms
        run: node --input-type=module -e "import fs from 'node:fs'; import {assessSwitches} from './tools/switch-performance.mjs'; const data=JSON.parse(fs.readFileSync('evidence/released/samples.json','utf8').replace(/^\uFEFF/,'')); const verdict=assessSwitches(data); fs.writeFileSync('evidence/released/verdict.json',JSON.stringify(verdict,null,2)); console.log(verdict); if(!verdict.pass) process.exit(1);"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: released-large-history-switches
          path: evidence
          if-no-files-found: error
          retention-days: 7
