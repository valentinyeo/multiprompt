name: Audit serialization proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Repeat original and repaired serializer controls
        shell: pwsh
        run: |
          git show 49518d79:tools/chat-dictation.test.js | Set-Content -Encoding utf8 tools/audit-baseline.test.js
          try {
            1..5 | ForEach-Object {
              Write-Output "BASELINE_SAMPLE=$_"
              node --test --test-name-pattern 'IGSH-893 audit evidence' tools/audit-baseline.test.js
              Write-Output "BASELINE_EXIT=$LASTEXITCODE"
              Write-Output "REPAIRED_SAMPLE=$_"
              node --test --test-name-pattern 'IGSH-893 audit evidence' tools/chat-dictation.test.js
              if ($LASTEXITCODE -ne 0) { throw 'Repaired audit control failed' }
            }
          } finally { Remove-Item tools/audit-baseline.test.js }
