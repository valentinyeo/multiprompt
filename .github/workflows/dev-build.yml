name: Dev build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or commit to build
        required: false
        default: master
        type: string
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'build.zig'
      - 'build.zig.zon'
      - 'extension/**'
      - '.github/workflows/dev-build.yml'

permissions:
  contents: read

concurrency:
  group: dev-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-global-cache
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      - name: Restore Zig toolchain
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/zig-x86_64-linux-0.16.0
          key: ${{ runner.os }}-zig-toolchain-0.16.0
      - name: Restore shared Windows app build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .zig-cache
            ${{ env.ZIG_GLOBAL_CACHE_DIR }}
          key: ${{ runner.os }}-zig-0.16.0-app-x64-${{ hashFiles('build.zig', 'build.zig.zon') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-zig-0.16.0-app-x64-${{ hashFiles('build.zig', 'build.zig.zon') }}-
            ${{ runner.os }}-zig-0.16.0-app-x64-
      - name: Install Zig 0.16.0
        run: |
          if [ ! -x "$RUNNER_TEMP/zig-x86_64-linux-0.16.0/zig" ]; then
            curl -sSfL https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz -o "$RUNNER_TEMP/zig.tar.xz"
            echo "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  $RUNNER_TEMP/zig.tar.xz" | sha256sum -c -
            tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          fi
          echo "$RUNNER_TEMP/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"
      - name: Build the dev app
        run: |
          zig build dev -Dtarget=x86_64-windows-gnu
          mkdir dist
          cp zig-out/bin/multiprompt-dev.exe dist/multiprompt-dev.exe
          cp zig-out/bin/zigshell-bridge.exe dist/zigshell-bridge.exe
          sha256sum dist/* | tee dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: multiprompt-dev
          path: dist/*
      - name: Bound the shared build cache
        shell: bash
        run: |
          du -sh .zig-cache "$ZIG_GLOBAL_CACHE_DIR"
          python3 tools/trim-zig-cache.py --cap-mib 1600
          du -sh "$ZIG_GLOBAL_CACHE_DIR"
          if [ -d .zig-cache ]; then du -sh .zig-cache; fi
