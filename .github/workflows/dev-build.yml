name: Dev build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or commit to build
        required: false
        default: master
        type: string
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'build.zig'
      - 'build.zig.zon'
      - 'extension/**'
      - '.github/workflows/dev-build.yml'

permissions:
  contents: read

concurrency:
  group: dev-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      - name: Install Zig 0.16.0
        run: |
          curl -sSfL https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz -o zig.tar.xz
          echo "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  zig.tar.xz" | sha256sum -c -
          tar -xJf zig.tar.xz
          echo "$PWD/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"
      - name: Build the dev app
        run: |
          zig build dev -Dtarget=x86_64-windows-gnu
          mkdir dist
          cp zig-out/bin/multiprompt-dev.exe dist/multiprompt-dev.exe
          cp zig-out/bin/zigshell-bridge.exe dist/zigshell-bridge.exe
          sha256sum dist/* | tee dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: multiprompt-dev
          path: dist/*
