name: Room safety

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
  pull_request:
    paths:
      - '.github/workflows/room-checks.yml'
      - 'tools/room-checks/**'
      - 'src/room_service.py'
      - 'src/room_bridge.py'
      - 'tools/room_service_test.py'
      - 'tools/room_bridge_test.py'

permissions:
  contents: read

jobs:
  room-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Lint GitHub workflows
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7
        with:
          version: '1.7.12'
          files: .github/workflows/room-checks.yml
          shellcheck: false
          pyflakes: false
      - name: Record run
        if: always()
        run: |
          mkdir -p room-check-results
          printf 'Revision: %s\nRun: %s/%s/actions/runs/%s\n' "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" | tee room-check-results/run.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run room tests
        shell: bash
        run: |
          set -o pipefail
          export HOME
          HOME=$(mktemp -d "$RUNNER_TEMP/room-home.XXXXXX")
          status=0
          for test in tools/room_service_test.py tools/room_bridge_test.py tools/room-checks/protocol.test.py; do
            echo "Running $test"
            python "$test" -v 2>&1 | tee "room-check-results/$(basename "$test").log" || status=1
          done
          exit "$status"
      - name: Add logs to summary
        if: always()
        shell: bash
        run: |
          for log in room-check-results/*.log; do
            [ -f "$log" ] || continue
            printf '\n### %s\n\n```\n' "$(basename "$log")" >> "$GITHUB_STEP_SUMMARY"
            cat "$log" >> "$GITHUB_STEP_SUMMARY"
            printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: room-safety-results
          path: room-check-results/
          if-no-files-found: error
