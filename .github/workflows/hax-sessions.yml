name: Native runner sessions

on:
  workflow_dispatch:
  schedule:
    - cron: '4 3 * * *'

permissions:
  contents: read

concurrency:
  group: hax-sessions-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  runners:
    if: github.event_name != 'pull_request' || github.head_ref != 'ceo/IGSH-1043'
    uses: ./.github/workflows/verify.yml
    with:
      feature: chat-delivery
      hax_sessions_proof: true
