name: Listener rejection proof

on:
  workflow_dispatch:
  schedule:
    - cron: '32 3 * * *'

permissions:
  contents: read

concurrency:
  group: notifications-rejection-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rejection:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install Zig 0.16.0
        uses: ./.github/actions/setup-zig
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Socket error assertion controls
        run: node --test tools/notifications-rejection.test.js
      - name: Build focused regression
        run: zig build local-listener-rejection -Doptimize=Debug -Dcpu=x86_64_v3
      - name: Twenty consecutive rejection runs
        shell: pwsh
        run: |
          for ($i = 1; $i -le 20; $i++) {
            & ./zig-out/bin/local-listener-rejection.exe
            if ($LASTEXITCODE -ne 0) { throw "Listener rejection failed at run $i" }
            Write-Output "LISTENER_REJECTION_PASS $i"
          }
