name: Listener rejection proof

on:
  workflow_dispatch:
  push:
    branches: [ceo/IGSH-1157]

permissions:
  contents: read

jobs:
  rejection:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install Zig
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP/zig.zip"
          Invoke-WebRequest https://ziglang.org/download/0.16.0/zig-x86_64-windows-0.16.0.zip -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() -ne '68659eb5f1e4eb1437a722f1dd889c5a322c9954607f5edcf337bc3684a75a7e') { throw 'zig checksum mismatch' }
          tar -xf $zip -C $env:RUNNER_TEMP
          "$env:RUNNER_TEMP/zig-x86_64-windows-0.16.0" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: Full desktop context with assertion traces
        run: zig build test-main -Doptimize=Debug -Dcpu=x86_64_v3 -Drender-proof=true --summary all
      - name: Build focused regression
        run: zig build local-listener-rejection -Doptimize=Debug -Dcpu=x86_64_v3
      - name: Twenty consecutive rejection runs
        shell: pwsh
        run: |
          for ($i = 1; $i -le 20; $i++) {
            & ./zig-out/bin/local-listener-rejection.exe
            if ($LASTEXITCODE -ne 0) { throw "Listener rejection failed at run $i" }
            Write-Output "LISTENER_REJECTION_PASS $i"
          }
