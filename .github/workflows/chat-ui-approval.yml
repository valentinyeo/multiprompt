name: Chat UI approval

on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number to recheck
        required: true
        type: string
      approval_ticket:
        description: Optional ticket number for a read-only approval API smoke check
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: chat-ui-approval-${{ github.event.pull_request.number || inputs.pull_request }}-${{ github.event_name == 'pull_request' && 'tests' || 'guard' }}
  cancel-in-progress: true

jobs:
  tests:
    if: github.event_name == 'pull_request'
    name: chat-ui-approval-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: node --test tools/chat-ui-approval.test.js

  approval:
    if: github.event_name != 'pull_request'
    name: verify-chat-ui-approval
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Probe read-only approval evidence
        if: github.event_name == 'workflow_dispatch' && inputs.approval_ticket != ''
        env:
          HYPERTASK_AGENT_TOKEN: ${{ secrets.HYPERTASK_AGENT_TOKEN }}
          APPROVAL_TICKET: ${{ inputs.approval_ticket }}
        run: |
          node --input-type=module <<'NODE'
          const ticket = process.env.APPROVAL_TICKET;
          if (!/^IGSH-[1-9]\d*$/.test(ticket) || !process.env.HYPERTASK_AGENT_TOKEN) throw new Error('Approval probe configuration is missing');
          const base = 'https://api.hypertask.ai/api/mcp';
          for (const [endpoint, field] of [['tasks', 'tasks'], ['comments', 'comments'], ['tasks/description-versions', 'versions']]) {
            const response = await fetch(`${base}/${endpoint}?ticket_number=${ticket}`, {headers: {Authorization: `Bearer ${process.env.HYPERTASK_AGENT_TOKEN}`}, signal: AbortSignal.timeout(15000)});
            const data = await response.json().catch(() => null);
            if (!response.ok || !Array.isArray(data?.[field])) throw new Error('Approval evidence read failed');
          }
          console.log('Approval evidence endpoints are readable; no private content was logged.');
          NODE
      - name: Verify linked owner approval
        env:
          GH_TOKEN: ${{ github.token }}
          HYPERTASK_AGENT_TOKEN: ${{ secrets.HYPERTASK_AGENT_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pull_request }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
        run: node tools/check-chat-ui-approval.cjs
