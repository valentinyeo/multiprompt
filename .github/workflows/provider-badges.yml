name: Provider badges
run-name: provider badges ${{ github.ref_name }}
on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  badges:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        dpi: [96, 144]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Zig 0.16.0
        uses: ./.github/actions/setup-zig
      - name: Reject the old badge designs
        if: matrix.dpi == 96
        shell: pwsh
        run: |
          $file = 'src/provider_badge.zig'
          $source = [IO.File]::ReadAllText($file)
          $tests = $source.Substring($source.IndexOf('test "MUBO-568'))
          $cases = @(
            @{ fixture = 'provider-badge-before.zig'; test = 'MUBO-568 a misleading chat name'; label = 'CHAT_NAME_BADGE_REJECTED' },
            @{ fixture = 'provider-badge-round.zig'; test = 'MUBO-568 the solid triangle'; label = 'ROUND_BADGE_REJECTED' }
          )
          try {
            foreach ($case in $cases) {
              [IO.File]::WriteAllText($file, [IO.File]::ReadAllText("tools/fixtures/MUBO-568/$($case.fixture)") + "`n" + $tests)
              zig build test-provider-badges 2>&1 | Tee-Object badge-red.log
              if ($LASTEXITCODE -eq 0 -or -not (Select-String -Quiet -Path badge-red.log -Pattern $case.test)) { throw "The old badge design still passed: $($case.fixture)" }
              $global:LASTEXITCODE = 0
              Write-Host $case.label
            }
          } finally { [IO.File]::WriteAllText($file, $source) }
      - name: Provider badge identity and geometry proof
        shell: pwsh
        run: |
          zig build test-provider-badges
          if ($LASTEXITCODE -ne 0) { throw 'Provider badge unit proof failed' }
      - name: Resolve application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force verify-bin, evidence | Out-Null
          $tag = (git describe --tags --match 'v[0-9]*' --abbrev=0 HEAD).Trim()
          $version = $tag.Substring(1)
          zig build -Dversion="$version" -Drevision="$(git rev-parse HEAD)"
          if ($LASTEXITCODE -ne 0) { throw 'Application build failed' }
          Copy-Item zig-out/bin/multiprompt.exe, zig-out/bin/zigshell-bridge.exe verify-bin/
          zig cc -target x86_64-windows-gnu -municode -O2 tools/verify-chat-delivery/launcher.c -o verify-bin/ssh.exe
          if ($LASTEXITCODE -ne 0) { throw 'SSH fixture build failed' }
          zig cc -target x86_64-windows-gnu -municode -mwindows -O2 tools/verify-chat-delivery/launcher.c -o verify-bin/tmux.exe
          if ($LASTEXITCODE -ne 0) { throw 'Terminal fixture build failed' }
          $hash = (Get-FileHash verify-bin/multiprompt.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          @{version=$version; sha256=$hash; revision=(git rev-parse HEAD).Trim()} | ConvertTo-Json | Set-Content evidence/build.json
          "VERIFY_VERSION=$version" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "VERIFY_HASH=$hash" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Native provider badge pixels and corners
        shell: powershell
        run: |
          & tools/verify-provider-badges/drive.ps1 -Exe "$pwd/verify-bin/multiprompt.exe" -ExpectedVersion $env:VERIFY_VERSION -ExpectedHash $env:VERIFY_HASH -Evidence "$pwd/evidence" -Dpi ${{ matrix.dpi }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: provider-badges-${{ matrix.dpi }}
          path: evidence
          retention-days: 7
