name: Extension version

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  extension-version:
    name: extension-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Test the checker
        run: node --test tools/check-extension-version.test.js
      - name: Fail when the extension changed without a version bump
        if: github.event_name == 'pull_request'
        run: node tools/check-extension-version.mjs origin/${{ github.base_ref }}
