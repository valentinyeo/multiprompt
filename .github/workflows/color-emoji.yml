name: Color emoji

on:
  push:
    branches: [ceo/IGSH-1089]
  pull_request:
    paths:
      - src/color_emoji.cpp
      - src/dwrite_text.zig
      - src/fonts.zig
      - tools/color-emoji.test.js
      - .github/workflows/color-emoji.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pixels:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Install Zig 0.16.0
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP/zig.zip"
          Invoke-WebRequest https://ziglang.org/download/0.16.0/zig-x86_64-windows-0.16.0.zip -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne '68659eb5f1e4eb1437a722f1dd889c5a322c9954607f5edcf337bc3684a75a7e') { throw 'Zig checksum mismatch' }
          Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP
          "$env:RUNNER_TEMP/zig-x86_64-windows-0.16.0" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: Check shared rendering path
        run: node --test tools/color-emoji.test.js
      - name: Paint actual Windows color fonts
        run: zig build test-emoji --summary all
      - name: Save native before and after proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: color-emoji
          path: emoji-*.bmp
          if-no-files-found: error
          retention-days: 14
