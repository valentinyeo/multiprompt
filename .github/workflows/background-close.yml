name: Background close proof

on:
  workflow_dispatch:
    inputs:
      exe_source:
        description: build or a published release tag
        required: true
        default: build
        type: string
  schedule:
    - cron: '4 2 * * *'

permissions:
  contents: read

concurrency:
  group: background-close-${{ github.ref }}
  cancel-in-progress: false

jobs:
  background-close:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      EXE_SOURCE: ${{ inputs.exe_source || 'build' }}
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Acquire real app
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force bin, evidence | Out-Null
          if ($env:EXE_SOURCE -eq 'build') {
            $zip = "$env:RUNNER_TEMP/zig.zip"
            Invoke-WebRequest https://ziglang.org/download/0.16.0/zig-x86_64-windows-0.16.0.zip -OutFile $zip
            if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() -ne '68659eb5f1e4eb1437a722f1dd889c5a322c9954607f5edcf337bc3684a75a7e') { throw 'Zig checksum mismatch' }
            Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP
            & "$env:RUNNER_TEMP/zig-x86_64-windows-0.16.0/zig.exe" build
            if ($LASTEXITCODE -ne 0) { throw 'App build failed' }
            Copy-Item zig-out/bin/multiprompt.exe bin/multiprompt.exe
          } else {
            if ($env:EXE_SOURCE -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw 'Expected build or a release tag' }
            gh release download $env:EXE_SOURCE --repo $env:GITHUB_REPOSITORY --pattern multiprompt-x64.exe --pattern SHA256SUMS.txt --dir bin
            if ($LASTEXITCODE -ne 0) { throw 'Release download failed' }
            $line = @(Get-Content bin/SHA256SUMS.txt | Where-Object { $_ -match '^[a-fA-F0-9]{64}\s+\*?multiprompt-x64\.exe$' })
            if ($line.Count -ne 1) { throw 'Missing unique executable checksum' }
            if ((Get-FileHash bin/multiprompt-x64.exe -Algorithm SHA256).Hash.ToLower() -ne ($line[0] -split '\s+')[0].ToLower()) { throw 'Release checksum mismatch' }
            Copy-Item bin/multiprompt-x64.exe bin/multiprompt.exe
          }
          @{exe_source=$env:EXE_SOURCE; revision=(git rev-parse HEAD); run_url="https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"; exe_sha256=(Get-FileHash bin/multiprompt.exe -Algorithm SHA256).Hash.ToLower()} | ConvertTo-Json | Set-Content evidence/provenance.json
      - name: Exercise external and deliberate close messages
        shell: pwsh
        run: ./tools/background-close.ps1 -Exe "$PWD/bin/multiprompt.exe" -Output "$PWD/evidence"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: background-close-${{ env.EXE_SOURCE }}
          path: evidence
          if-no-files-found: error
          retention-days: 14
