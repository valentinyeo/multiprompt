name: auto-release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  release:
    if: github.ref == 'refs/heads/master'
    uses: ./.github/workflows/release.yml
    secrets:
      MULTIPROMPT_RELEASE_SIGNING_KEY: ${{ secrets.MULTIPROMPT_RELEASE_SIGNING_KEY }}
