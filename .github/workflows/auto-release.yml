name: auto-release

on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  tag:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Require a tested unreleased master head
        id: admit
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          if [ "$GITHUB_EVENT_NAME" = workflow_run ] && [ "$sha" != "$TESTED_SHA" ]; then
            echo 'master has moved past the tested commit; skipping'
            exit 0
          fi
          if git log -1 --pretty=%B | grep -Fq -e '[skip release]' -e '[release skip]'; then
            echo 'commit asks for no release; skipping'
            exit 0
          fi
          if [ -n "$(git tag --points-at HEAD)" ]; then
            echo 'commit is already tagged; skipping'
            exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            gh run list -R "$GITHUB_REPOSITORY" -w test.yml -b master --commit "$sha" --limit 100 \
              --json databaseId,event,status,conclusion | jq -e '
                map(select(.event == "push" or .event == "workflow_dispatch"))
                | sort_by(.databaseId) | last | .status == "completed" and .conclusion == "success"'
          fi
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - name: Tag the tested master commit
        id: tag
        if: steps.admit.outputs.ready == 'true'
        run: |
          set -euo pipefail
          RELEASE_TAG=$(node tools/release-version.mjs --next "$(git describe --tags --abbrev=0)")
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "$RELEASE_TAG already exists; refusing to move it" >&2
            exit 1
          fi
          git tag "$RELEASE_TAG" HEAD
          git push origin "refs/tags/$RELEASE_TAG"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  release:
    needs: tag
    if: needs.tag.outputs.tag != ''
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
    secrets:
      MULTIPROMPT_RELEASE_SIGNING_KEY: ${{ secrets.MULTIPROMPT_RELEASE_SIGNING_KEY }}
