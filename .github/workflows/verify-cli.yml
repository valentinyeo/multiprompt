name: Verify CLI tests

on:
  pull_request:
    paths:
      - 'tools/mbv.mjs'
      - 'tools/mbv.test.mjs'
      - 'tools/touched-journeys.test.js'
      - 'tools/fixtures/SOFT-2755/**'
      - '.claude/skills/verify-multiprompt/features/verify-cli.md'
      - '.github/workflows/verify-cli.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-cli-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cli:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Run the CLI tests on head and on the base source
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/input"
          set +e
          node --test --test-reporter=tap tools/mbv.test.mjs tools/touched-journeys.test.js > "$RUNNER_TEMP/input/head.log" 2>&1
          echo "head=$?" >> "$GITHUB_ENV"
          if [ -n "$BASE_SHA" ]; then
            git worktree add --detach "$RUNNER_TEMP/base" "$BASE_SHA"
            cp tools/mbv.test.mjs tools/touched-journeys.test.js "$RUNNER_TEMP/base/tools/"
            (cd "$RUNNER_TEMP/base" && node --test --test-reporter=tap tools/mbv.test.mjs tools/touched-journeys.test.js) > "$RUNNER_TEMP/input/base.log" 2>&1
            echo "base=$?" >> "$GITHUB_ENV"
          fi
      - name: Write the receipt
        shell: bash
        run: |
          set +e
          if [ -n "$BASE_SHA" ]; then
            node tools/ci-receipt-summary.mjs "$RUNNER_TEMP/receipt" cli "$RUNNER_TEMP/input/head.log" "$head" '^# (pass|fail) |^(ok|not ok) [0-9]+ - (the agent-facing CLI exists|SOFT-2890 )' "$RUNNER_TEMP/input/base.log" "$base"
          else
            node tools/ci-receipt-summary.mjs "$RUNNER_TEMP/receipt" cli "$RUNNER_TEMP/input/head.log" "$head" '^# (pass|fail) |^(ok|not ok) [0-9]+ - (the agent-facing CLI exists|SOFT-2890 )'
          fi
          echo "receipt=$?" >> "$GITHUB_ENV"
          true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: verify-cli
          path: ${{ runner.temp }}/receipt/
          if-no-files-found: error
      - name: Fail when the head tests or the receipt failed
        run: test "$head" = 0 && test "$receipt" = 0
