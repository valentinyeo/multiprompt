name: Verify chat positions

on:
  pull_request:
    paths:
      - .github/workflows/verify-chat-position.yml
      - .github/workflows/verify.yml
      - .claude/skills/verify-multiprompt/drive.ps1
      - .claude/skills/verify-multiprompt/seed-profile.py
      - .claude/skills/verify-multiprompt/features/chat-position-replay.md
      - tools/verify-server-chat/**
      - tools/verify-server-chat.test.py
      - tools/verify-chat-delivery/*frame-probe*
      - tools/verify-chat-delivery/position-replay*
      - tools/verify-chat-delivery/native-console*
      - src/chat*.zig
      - src/console.zig
      - src/focus.zig

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    uses: ./.github/workflows/verify.yml
    with:
      revision: ${{ github.event.pull_request.head.sha }}
      app_revision: 9dd167dad7dde81749519038b0bcc5866c6deebb
      feature: chat-position-replay
  candidate:
    uses: ./.github/workflows/verify.yml
    with:
      revision: ${{ github.event.pull_request.head.sha }}
      feature: chat-position-replay
  chat-view-everywhere:
    uses: ./.github/workflows/verify.yml
    with:
      revision: ${{ github.event.pull_request.head.sha }}
      feature: chat-view-everywhere
  compare:
    if: ${{ always() }}
    needs: [baseline, candidate, chat-view-everywhere]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verify-chat-position-replay-9dd167dad7dde81749519038b0bcc5866c6deebb
          path: baseline
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verify-chat-position-replay
          path: candidate
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verify-chat-view-everywhere
          path: chat-view-everywhere
      - name: Require a real server long-chat console flash on master and none on head
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path
          def load(root, file):
              return json.loads(Path(root, file).read_text(encoding='utf-8-sig'))
          for root in ('baseline', 'candidate'):
              manifest = load(root, 'fixture-manifest.json')
              assert manifest['generatorRevision'] == '60b28893a6b3468c2cf63804c590d5e2978c878d'
              assert manifest['messages'] == 2400 and manifest['rounds'] == 1200
              assert manifest['transport'] == 'Windows OpenSSH -> WSL2 OpenSSH + tmux'
              copied = Path(root, 'open-copied.txt').read_text(encoding='utf-8-sig')
              assert len(re.findall(r'Synthetic chat 00 question \d{4}\.', copied)) == 1200
              assert len(re.findall(r'Synthetic chat 00 answer \d{4}\.', copied)) == 1200
              assert load(root, 'result.json')['cleanup']['activeAfterStop'] == 0
              assert load(root, 'result.json')['keyRemoved'] is True
              assert load(root, 'result.json')['videoExit'] == 0
              assert Path(root, 'journey.mp4').stat().st_size > 1024
              control = load(root, 'observer-control/native-console.json')
              assert control['status'] == 'failed' and control['flashes'], 'The hook must catch the separate real-console positive control'
          before = load('baseline', 'native-console.json')
          after = load('candidate', 'native-console.json')
          assert before['status'] == 'failed' and before['flashes'], 'Master must expose a native console over painted long-chat content on the real server journey'
          assert all(flash['paint']['content'] for flash in before['flashes'])
          assert after['status'] == 'passed' and not after['flashes']
          assert load('candidate', 'position-replay.json')['status'] == 'passed'
          assert load('candidate', 'result.json')['status'] == 'passed'
          assert load('chat-view-everywhere', 'result.json')['status'] == 'passed'
          print(json.dumps(dict(master_console_flashes=before['flashes'], candidate='passed', chat_view_everywhere='passed')))
          PY
