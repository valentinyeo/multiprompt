name: check-red-run

on:
  workflow_dispatch:
    inputs:
      feature:
        description: Optional desktop journey to bisect using head harness and base app
        required: false
        type: string
      base:
        description: Base revision
        default: master^
        required: true
      head:
        description: Head revision
        default: master
        required: true
  workflow_call:
    inputs:
      base:
        type: string
        required: true
      head:
        type: string
        required: true
  schedule:
    - cron: '48 2 * * *'

permissions:
  contents: read

concurrency:
  group: check-red-run-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  journey:
    if: inputs.feature != ''
    uses: ./.github/workflows/verify.yml
    with:
      feature: ${{ inputs.feature }}
      revision: ${{ inputs.head }}
      app_revision: ${{ inputs.base }}

  check-red-run:
    if: inputs.feature == ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.head || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Zig 0.16.0
        run: |
          if [ ! -x "$RUNNER_TEMP/zig-x86_64-linux-0.16.0/zig" ]; then
            curl -fsSL https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz -o "$RUNNER_TEMP/zig.tar.xz"
            echo "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  $RUNNER_TEMP/zig.tar.xz" | sha256sum -c -
            tar -xf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          fi
          echo "ZIG=$RUNNER_TEMP/zig-x86_64-linux-0.16.0/zig" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"
      - name: Install video validation tools
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Test admission controls
        run: node --test tools/check-red-run.test.mjs
      - name: Require changed tests to fail on merge-base source
        env:
          BASE: ${{ inputs.base || format('{0}^', github.sha) }}
          HEAD: ${{ inputs.head || github.sha }}
        run: node tools/check-red-run.mjs "$BASE" "$HEAD"
