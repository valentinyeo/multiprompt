name: PR checks

on:
  workflow_dispatch:
  schedule:
    - cron: '28 3 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  no-comments:
    name: no-comments
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Lint GitHub workflows
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7
        with:
          version: '1.7.12'
          shellcheck: false
          pyflakes: false
      - name: Test the comment checker
        run: node --test tools/strip-comments.test.js
      - name: Fail on any code comment
        run: node tools/strip-comments.mjs --check
      - name: Test routing ID checker
        if: success() || failure()
        run: node --test tools/check-routing-ids.test.js
      - name: Check routing IDs
        if: success() || failure()
        run: node tools/check-routing-ids.mjs
      - name: Test regression input checker
        if: success() || failure()
        run: node --test tools/check-regression-inputs.test.js
      - name: Check durable regression inputs
        if: (success() || failure()) && github.event_name == 'pull_request'
        run: node tools/check-regression-inputs.mjs origin/${{ github.base_ref }}
      - name: Test PowerShell host name checker
        if: success() || failure()
        shell: pwsh
        run: node --test tools/check-powershell-host-names.test.js
      - name: Check PowerShell host names
        if: success() || failure()
        shell: pwsh
        run: ./tools/check-powershell-host-names.ps1 -Root .

  extension-version:
    name: extension-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Test the checker
        run: node --test tools/check-extension-version.test.js
      - name: Fail when the extension changed without a version bump
        if: github.event_name == 'pull_request'
        run: node tools/check-extension-version.mjs origin/${{ github.base_ref }}
      - name: Check extension changes against the default branch on manual runs
        if: github.event_name == 'workflow_dispatch'
        run: node tools/check-extension-version.mjs origin/${{ github.event.repository.default_branch }}
