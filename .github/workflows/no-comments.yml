name: PR checks

on:
  workflow_dispatch:
    inputs:
      agent:
        required: false
        type: string
  schedule:
    - cron: '28 3 * * *'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  no-comments:
    name: no-comments
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Lint GitHub workflows
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7
        with:
          version: '1.7.12'
          shellcheck: false
          pyflakes: false
      - name: Test the comment checker
        run: node --test tools/strip-comments.test.js
      - name: Fail on any code comment
        run: node tools/strip-comments.mjs --check
      - name: Test routing ID checker
        if: success() || failure()
        run: node --test tools/check-routing-ids.test.js
      - name: Check routing IDs
        if: success() || failure()
        run: node tools/check-routing-ids.mjs
      - name: Test regression input checker
        if: success() || failure()
        run: node --test tools/check-regression-inputs.test.js
      - name: Check durable regression inputs
        if: (success() || failure()) && github.event_name == 'pull_request'
        run: node tools/check-regression-inputs.mjs origin/${{ github.base_ref }}
      - name: Test the runtime generation guard
        if: success() || failure()
        run: node --test tools/check-runtime-generation.test.js
      - name: Check the reader runtime generation
        if: success() || failure()
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: node tools/check-runtime-generation.mjs "${BASE}" HEAD
      - name: Test PowerShell host name checker
        if: success() || failure()
        shell: pwsh
        run: node --test tools/check-powershell-host-names.test.js
      - name: Check PowerShell host names
        if: success() || failure()
        shell: pwsh
        run: ./tools/check-powershell-host-names.ps1 -Root .

  extension-version:
    name: extension-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Test the checker
        run: node --test tools/check-extension-version.test.js
      - name: Fail when the extension changed without a version bump
        if: github.event_name == 'pull_request'
        run: node tools/check-extension-version.mjs origin/${{ github.base_ref }}
      - name: Check extension changes against the default branch on manual runs
        if: github.event_name == 'workflow_dispatch'
        run: node tools/check-extension-version.mjs origin/${{ github.event.repository.default_branch }}

  comment-sicko:
    if: github.event_name == 'workflow_dispatch' && inputs.agent != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: soft-2557-chat-open-steady
          fetch-depth: 0
          persist-credentials: false
      - name: Run pstack Comment Sicko on the scoped diff
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          AGENT: ${{ inputs.agent }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, urllib.request
          diff = subprocess.check_output(['git', 'diff', 'origin/master...HEAD', '--', 'src', 'tools', '.claude'], text=True)
          payload = {'model': 'deepseek-flash', 'messages': [
              {'role': 'system', 'content': os.environ['AGENT']},
              {'role': 'user', 'content': 'Goal: opening Multiprompt chat must keep messages steady. Scope is PR 1062, only the supplied diff. Report comment deletions, MUST KILL flags, restores, skips and open constraints. Do not review application behavior or write application code.\n\n' + diff}], 'max_tokens': 2500}
          request = urllib.request.Request('https://api.deepseek.com/chat/completions', data=json.dumps(payload).encode(), headers={'Authorization': 'Bearer ' + os.environ['DEEPSEEK_API_KEY'], 'Content-Type': 'application/json'})
          with urllib.request.urlopen(request, timeout=180) as response:
              result = json.load(response)
          text = result['choices'][0]['message']['content']
          if not text.startswith('Yes... Ha ha ha... Yes!'):
              raise RuntimeError('Comment Sicko did not follow its supplied agent definition')
          open('comment-sicko.md', 'w').write(text + '\n')
          print(text)
          PY
      - name: Post the cleanup report
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment 1062 --repo "$GITHUB_REPOSITORY" --body-file comment-sicko.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: soft-2557-comment-sicko
          path: comment-sicko.md
          if-no-files-found: error
