name: Robot avatars
run-name: robot avatars ${{ inputs.tag || github.ref_name }}
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published release to verify, empty builds this branch
        required: false
        type: string
  schedule:
    - cron: '8 2 * * *'

permissions:
  contents: read
concurrency:
  group: robot-avatars-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: true
jobs:
  robots:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        dpi: [96, 144]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Zig
        shell: pwsh
        run: |
          Invoke-WebRequest https://ziglang.org/download/0.16.0/zig-x86_64-windows-0.16.0.zip -OutFile "$env:RUNNER_TEMP/zig.zip"
          if ((Get-FileHash "$env:RUNNER_TEMP/zig.zip" -Algorithm SHA256).Hash.ToLowerInvariant() -ne '68659eb5f1e4eb1437a722f1dd889c5a322c9954607f5edcf337bc3684a75a7e') { throw 'Zig checksum mismatch' }
          Expand-Archive "$env:RUNNER_TEMP/zig.zip" -DestinationPath $env:RUNNER_TEMP
          "$env:RUNNER_TEMP/zig-x86_64-windows-0.16.0" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: Reject the original binary avatar clipping
        if: inputs.tag == '' && matrix.dpi == 96
        shell: pwsh
        run: |
          $file = 'src/bot_avatar.zig'
          $source = [IO.File]::ReadAllText($file)
          $test = $source.Substring($source.IndexOf('test "IGSH-1192 every robot'))
          try {
            [IO.File]::WriteAllText($file, [IO.File]::ReadAllText('tools/fixtures/IGSH-1192/bot-avatar-before.zig') + "`n" + $test)
            zig build test-smooth-shapes 2>&1 | Tee-Object native-shapes-red.log
            if ($LASTEXITCODE -eq 0 -or -not (Select-String -Quiet -Path native-shapes-red.log -Pattern 'IGSH-1192 face=0 scale=100 fractional=')) { throw 'Original avatar clipping did not fail the native fractional-edge assertion' }
            Write-Host 'ORIGINAL_BINARY_CLIP_REJECTED'
          } finally { [IO.File]::WriteAllText($file, $source) }
      - name: Native fractional circle proof
        shell: pwsh
        run: |
          zig build test-smooth-shapes
          if ($LASTEXITCODE -ne 0) { throw 'Native fractional circle proof failed' }
          New-Item -ItemType Directory -Force evidence | Out-Null
          Copy-Item smooth-shapes-*.bmp evidence/
      - name: Resolve application
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          New-Item -ItemType Directory -Force verify-bin, evidence | Out-Null
          if ($env:RELEASE_TAG) {
            if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw 'Invalid release tag' }
            gh release download $env:RELEASE_TAG --dir verify-bin --pattern multiprompt-x64.exe --pattern zigshell-bridge-x64.exe --pattern SHA256SUMS.txt
            if ($LASTEXITCODE -ne 0) { throw 'Release download failed' }
            foreach ($name in @('multiprompt', 'zigshell-bridge')) {
              $line = @(Get-Content verify-bin/SHA256SUMS.txt | Where-Object { $_ -match ('^[a-fA-F0-9]{64} [ *]' + $name + '-x64\.exe$') })
              if ($line.Count -ne 1 -or (Get-FileHash "verify-bin/$name-x64.exe" -Algorithm SHA256).Hash.ToLowerInvariant() -ne ($line[0] -split '\s+')[0]) { throw 'Release checksum mismatch' }
              Move-Item "verify-bin/$name-x64.exe" "verify-bin/$name.exe"
            }
            $version = $env:RELEASE_TAG.Substring(1)
          } else {
            $tag = (git describe --tags --match 'v[0-9]*' --abbrev=0 HEAD).Trim()
            $version = $tag.Substring(1)
            zig build -Dversion="$version" -Drevision="$(git rev-parse HEAD)"
            if ($LASTEXITCODE -ne 0) { throw 'Application build failed' }
            Copy-Item zig-out/bin/multiprompt.exe, zig-out/bin/zigshell-bridge.exe verify-bin/
          }
          zig cc -target x86_64-windows-gnu -municode -O2 tools/verify-chat-delivery/launcher.c -o verify-bin/ssh.exe
          if ($LASTEXITCODE -ne 0) { throw 'SSH fixture build failed' }
          zig cc -target x86_64-windows-gnu -municode -mwindows -O2 tools/verify-chat-delivery/launcher.c -o verify-bin/tmux.exe
          if ($LASTEXITCODE -ne 0) { throw 'Terminal fixture build failed' }
          $hash = (Get-FileHash verify-bin/multiprompt.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          @{tag=$env:RELEASE_TAG; version=$version; sha256=$hash; revision=(git rev-parse HEAD).Trim()} | ConvertTo-Json | Set-Content evidence/build.json
          "VERIFY_VERSION=$version" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "VERIFY_HASH=$hash" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Reject the published pre-robot application
        if: inputs.tag == '' && matrix.dpi == 96
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force negative-bin, evidence/negative | Out-Null
          gh release download v0.28.990 --dir negative-bin --pattern multiprompt-x64.exe --pattern zigshell-bridge-x64.exe --pattern SHA256SUMS.txt
          if ($LASTEXITCODE -ne 0) { throw 'Negative-control release download failed' }
          foreach ($name in @('multiprompt', 'zigshell-bridge')) {
            $line = @(Get-Content negative-bin/SHA256SUMS.txt | Where-Object { $_ -match ('^[a-fA-F0-9]{64} [ *]' + $name + '-x64\.exe$') })
            if ($line.Count -ne 1 -or (Get-FileHash "negative-bin/$name-x64.exe" -Algorithm SHA256).Hash.ToLowerInvariant() -ne ($line[0] -split '\s+')[0]) { throw 'Negative-control checksum mismatch' }
            Move-Item "negative-bin/$name-x64.exe" "negative-bin/$name.exe"
          }
          Copy-Item verify-bin/ssh.exe, verify-bin/tmux.exe negative-bin/
          $hash = (Get-FileHash negative-bin/multiprompt.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          try { & tools/verify-bot-avatars/drive.ps1 -Exe "$pwd/negative-bin/multiprompt.exe" -ExpectedVersion '0.28.990' -ExpectedHash $hash -Evidence "$pwd/evidence/negative" } catch { Write-Host $_ }
          $result = Get-Content evidence/negative/result.json -Raw | ConvertFrom-Json
          if ($result.passed -or $result.cleanup -ne 0 -or $result.error -cne 'Timed out: large pinned and list robots') { throw 'Old application did not fail the robot outcome' }
          Write-Host 'PRE_ROBOT_RELEASE_REJECTED'
      - name: Native robot pixels and sidebar clicks
        shell: powershell
        run: |
          foreach ($workspace in @('inne', 'Hypertask', 'Software Factory')) {
            & tools/verify-bot-avatars/drive.ps1 -Exe "$pwd/verify-bin/multiprompt.exe" -ExpectedVersion $env:VERIFY_VERSION -ExpectedHash $env:VERIFY_HASH -Evidence "$pwd/evidence/$workspace" -WorkspaceName $workspace -Dpi ${{ matrix.dpi }}
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: robot-avatars-${{ matrix.dpi }}
          path: evidence
          retention-days: 7
