name: Resource warning integration

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: resource-warning-integration
  cancel-in-progress: false

jobs:
  proof:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Initialize evidence
        run: echo '{"status":"not-run"}' > resource-warning-integration-evidence.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Unit tests
        run: node --test tools/auto-revert-board.test.js tools/resource-warning-ticket.test.mjs
      - name: Live integration proof
        env:
          HYPERTASK_AGENT_TOKEN: ${{ secrets.HYPERTASK_AGENT_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
        run: node tools/resource-warning-integration.mjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: resource-warning-integration-evidence
          path: resource-warning-integration-evidence.json
          if-no-files-found: warn
