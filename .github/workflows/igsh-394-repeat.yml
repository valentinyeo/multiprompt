name: IGSH-394 pipe readiness repeat

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repeat:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-global-cache
    steps:
      - name: Keep LF line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Cache Zig toolchain
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/zig-x86_64-windows-0.16.0
          key: ${{ runner.os }}-zig-toolchain-0.16.0
      - name: Cache Zig
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .zig-cache
            ${{ env.ZIG_GLOBAL_CACHE_DIR }}
          key: ${{ runner.os }}-zig-0.16.0-igsh-394-${{ hashFiles('build.zig', 'build.zig.zon') }}
          restore-keys: |
            ${{ runner.os }}-zig-0.16.0-igsh-394-
      - name: Install Zig 0.16.0
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:RUNNER_TEMP\zig-x86_64-windows-0.16.0\zig.exe")) {
            $zip = "$env:RUNNER_TEMP\zig.zip"
            Invoke-WebRequest https://ziglang.org/download/0.16.0/zig-x86_64-windows-0.16.0.zip -OutFile $zip
            $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
            if ($hash -ne '68659eb5f1e4eb1437a722f1dd889c5a322c9954607f5edcf337bc3684a75a7e') { throw "zig checksum mismatch: $hash" }
            tar -xf $zip -C $env:RUNNER_TEMP
            if ($LASTEXITCODE -ne 0) { throw 'zig extraction failed' }
          }
          "$env:RUNNER_TEMP\zig-x86_64-windows-0.16.0" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: Build test executables
        run: zig build --summary all -Dcpu=x86_64_v3
      - name: Run bridge profile pipe test ten times
        shell: pwsh
        run: |
          $env:BRIDGE_EXE = Join-Path $env:GITHUB_WORKSPACE 'zig-out/bin/zigshell-bridge.exe'
          for ($iteration = 1; $iteration -le 10; $iteration++) {
            Write-Host "Bridge profile pipe test $iteration/10"
            node --test tools/bridge-profile-pipes.test.js
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          'Passed 10 consecutive runs.' | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
