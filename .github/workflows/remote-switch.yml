name: Remote switch performance

on:
  workflow_dispatch:
  schedule:
    - cron: '56 3 * * *'

permissions:
  contents: read

concurrency:
  group: remote-switch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    name: remote-switch (paired)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Keep LF line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: harness
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Zig 0.16.0
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP/zig.zip"
          Invoke-WebRequest https://ziglang.org/download/0.16.0/zig-x86_64-windows-0.16.0.zip -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne '68659eb5f1e4eb1437a722f1dd889c5a322c9954607f5edcf337bc3684a75a7e') { throw 'Zig checksum mismatch' }
          Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP
          "$env:RUNNER_TEMP/zig-x86_64-windows-0.16.0" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: Check the independent performance oracle
        run: node --test harness/tools/remote-switch-proof.test.mjs harness/tools/smooth-shapes.test.js
      - name: Build unchanged baseline and candidate
        shell: pwsh
        env:
          BASE: ${{ github.event.pull_request.base.sha || 'origin/master' }}
        run: |
          $base = (git -C harness merge-base $env:BASE HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Baseline resolution failed' }
          git -C harness worktree add --detach ../base $base
          if ($LASTEXITCODE -ne 0) { throw 'Baseline checkout failed' }
          git -C harness worktree add --detach ../head HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Candidate checkout failed' }
          New-Item -ItemType Directory -Force evidence | Out-Null
          foreach ($side in @('base', 'head')) {
            Push-Location $side
            try { zig build; if ($LASTEXITCODE -ne 0) { throw "$side build failed" } } finally { Pop-Location }
            zig cc -target x86_64-windows-gnu -municode -O2 harness/tools/verify-chat-delivery/launcher.c -o "$side/zig-out/bin/ssh.exe"
            if ($LASTEXITCODE -ne 0) { throw 'SSH boundary compile failed' }
            zig cc -target x86_64-windows-gnu -municode -mwindows -O2 harness/tools/verify-chat-delivery/launcher.c -o "$side/zig-out/bin/tmux.exe"
            if ($LASTEXITCODE -ne 0) { throw 'Tmux boundary compile failed' }
            $source = Get-Content "$side/src/main.zig" -Raw
            if ($source -notmatch 'pub const APP_VERSION = (?:build_config\.app_version orelse )?"([^"]+)"') { throw 'Application version missing' }
            $version = $Matches[1]
            $hash = (Get-FileHash "$side/zig-out/bin/multiprompt.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
            @{revision=(git -C $side rev-parse HEAD).Trim(); version=$version; sha256=$hash; harness=(git -C harness rev-parse HEAD).Trim(); runId=$env:GITHUB_RUN_ID; runner=$env:RUNNER_NAME} | ConvertTo-Json | Set-Content "evidence/$side-build.json"
          }
      - name: Measure five alternating unchanged baseline and candidate attempts
        shell: powershell
        env:
          CHAT_SWITCH_PROOF: '1'
          CHAT_SWITCH_PAIRED: '1'
        run: |
          $failures = @()
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            foreach ($side in @('base', 'head')) {
              $directory = "$pwd/evidence/attempt-$attempt/$side"
              $identity = Get-Content "evidence/$side-build.json" -Raw | ConvertFrom-Json
              & powershell -NoProfile -File harness/tools/verify-chat-delivery/drive.ps1 -Feature chat-messages-only -Exe "$pwd/$side/zig-out/bin/multiprompt.exe" -Ssh "$pwd/$side/zig-out/bin/ssh.exe" -ExpectedVersion $identity.version -ExpectedHash $identity.sha256 -Evidence "$directory"
              if ($LASTEXITCODE -ne 0) { $failures += "$attempt/$side" }
              Copy-Item "evidence/$side-build.json" "$directory/build.json"
              if (Test-Path "$directory/remote-switch/error.txt") {
                $problem = (Get-Content "$directory/remote-switch/error.txt" -Raw).Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
                Write-Host "::error::$attempt/$side $problem"
              }
            }
          }
          if ($failures.Count -gt 0) { throw "Remote-switch workload failures: $failures" }
          $global:LASTEXITCODE = 0
      - name: Compare paired medians and report unchanged absolute limits
        run: node harness/tools/remote-switch-proof.mjs evidence --paired
      - name: Preserve frame records and visible proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: remote-switch-paired
          path: evidence/
          if-no-files-found: error
          retention-days: 30
