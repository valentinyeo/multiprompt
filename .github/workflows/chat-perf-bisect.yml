name: Chat perf bisect
run-name: chat perf ${{ inputs.before || inputs.refs || 'v0.28.900 v0.28.917' }}

on:
  workflow_dispatch:
    inputs:
      before:
        description: Optional full pre-fix SHA for five alternating pairs against this branch
        required: false
        type: string
      profile:
        description: Collect separate untimed call profiles for paired measurements
        default: true
        type: boolean
      refs:
        description: Space separated release tags or full 40 character commit SHAs, such as v0.28.900 v0.28.917
        required: true
        default: v0.28.900 v0.28.917
        type: string
      repeats:
        description: Measured runs per ref (1 to 5)
        required: true
        default: '3'
        type: string
  schedule:
    - cron: '24 2 * * *'

permissions:
  contents: read

jobs:
  plan:
    if: inputs.before == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      refs: ${{ steps.matrix.outputs.refs }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Test table calculations
        run: node --test tools/chat-perf-table.test.js
      - name: Validate refs and create matrix
        id: matrix
        env:
          REFS: ${{ inputs.refs || 'v0.28.900 v0.28.917' }}
          REPEATS: ${{ inputs.repeats || '3' }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const { REFS, REPEATS, GITHUB_OUTPUT } = process.env;
          const refs = REFS.trim().split(/\s+/);
          if (refs.length < 1 || refs.length > 40 || refs.some(ref => !/^(v\d+\.\d+\.\d+|[0-9a-f]{40})$/.test(ref))) throw new Error('refs must be 1 to 40 release tags or full commit SHAs');
          if (!/^[1-5]$/.test(REPEATS)) throw new Error('repeats must be 1 to 5');
          fs.appendFileSync(GITHUB_OUTPUT, `refs=${JSON.stringify(refs)}\n`);
          NODE

  measure:
    name: measure ${{ matrix.ref }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ fromJSON(needs.plan.outputs.refs) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: 1
          path: subject
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: tooling
          persist-credentials: false
      - name: Install Zig 0.16.0
        run: |
          curl -fsSL https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz -o "$RUNNER_TEMP/zig.tar.xz"
          echo "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  $RUNNER_TEMP/zig.tar.xz" | sha256sum -c -
          tar -xf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"
      - name: Run the native 50 MB history benchmark
        env:
          REPEATS: ${{ inputs.repeats || '3' }}
          REF: ${{ matrix.ref }}
        run: |
          mkdir -p out
          cd subject
          sha="$(git rev-parse HEAD)"
          subject="$(git log -1 --format=%s)"
          printf '%s\n%s\n' "$sha" "$subject" > ../out/identity.txt
          if ! grep -q 'test-chat-perf' build.zig; then echo "no test-chat-perf step at $sha" > ../out/unsupported.txt; fi
          for index in $(seq 1 "$REPEATS"); do
            set +e
            zig build test-chat-perf --summary all > "../out/run-$index.log" 2>&1
            printf '%s\n' "$?" > "../out/run-$index.exit"
            set -e
          done
          grep -h 'CPU707 benchmark' ../out/run-*.log || true
      - name: Write the row for this ref
        if: always()
        env:
          REF: ${{ matrix.ref }}
        run: node tooling/tools/chat-perf-table.mjs row out "$REF" > "out/row.json"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chat-perf-${{ matrix.ref }}
          path: out/
          if-no-files-found: error

  table:
    needs: measure
    if: always() && inputs.before == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: chat-perf-*
          path: rows
      - name: Build the table
        run: |
          node tools/chat-perf-table.mjs table rows > table.md
          cat table.md >> "$GITHUB_STEP_SUMMARY"
          cat table.md
          echo "::notice title=chat-perf-table::$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' table.md)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chat-perf-table
          path: |
            table.md
            rows/
          if-no-files-found: error

  paired:
    if: inputs.before != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: after
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.before }}
          path: before
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Install pinned Zig
        run: |
          curl -fsSL https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz -o "$RUNNER_TEMP/zig.tar.xz"
          echo '70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  '"$RUNNER_TEMP/zig.tar.xz" | sha256sum -c -
          tar -xf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"
      - name: Check the measurement reader
        run: node --test after/tools/chat-update-speed.test.js
      - name: Build the unchanged native workload
        env:
          BEFORE: ${{ inputs.before }}
        run: |
          [[ "$BEFORE" =~ ^[0-9a-f]{40}$ ]]
          mkdir evidence
          for side in before after; do
            git -C "$side" rev-parse HEAD > "evidence/$side-revision.txt"
            (cd "$side" && zig test src/chat_perf_test.zig -O ReleaseFast -mcpu=baseline -fno-strip --test-filter 'CPU707 synthetic' --test-no-exec -femit-bin="$GITHUB_WORKSPACE/evidence/$side") > "evidence/$side-build.log" 2>&1
          done
          {
            zig version
            uname -a
            lscpu
            nproc
            uptime
            free -m
            printf '\nReleaseFast, baseline CPU, original CPU707 test; no budget edits.\n'
          } > evidence/environment.txt
      - name: Measure five alternating pairs
        run: |
          for sample in 1 2 3 4 5; do
            order='before after'
            if ((sample % 2 == 0)); then order='after before'; fi
            for side in $order; do
              printf '%s %s\n' "$sample" "$side" >> evidence/order.txt
              uptime >> evidence/load.txt
              set +e
              "./evidence/$side" > "evidence/$side-$sample.log" 2>&1
              code=$?
              set -e
              printf '%s\n' "$code" > "evidence/$side-$sample.exit"
            done
          done
      - name: Profile separately from reported timings
        if: inputs.profile
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends linux-tools-generic
          sudo sysctl kernel.perf_event_paranoid=-1
          profiler=$(find /usr/lib/linux-tools -type f -name perf | head -1)
          test -n "$profiler"
          for side in before after; do
            set +e
            sudo "$profiler" record -e cpu-clock -F 499 --call-graph dwarf -o "evidence/$side.perf" -- "./evidence/$side" > "evidence/$side-profile.log" 2>&1
            printf '%s\n' "$?" > "evidence/$side-profile.exit"
            set -e
            sudo "$profiler" report --stdio --no-children -i "evidence/$side.perf" > "evidence/$side-profile.txt"
            sudo chown "$(id -u):$(id -g)" "evidence/$side.perf"
          done
      - name: Compare all measured work and unchanged limits
        run: node after/tools/chat-update-speed.mjs evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: chat-update-speed
          path: evidence/
          if-no-files-found: error
          retention-days: 30
