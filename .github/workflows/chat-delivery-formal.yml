name: Chat delivery formal

on:
  push:
    paths:
      - '.claude/skills/verify-chat-delivery-formal/**'
      - '.claude/skills/verify-multiprompt/features/chat-delivery-formal.md'
      - '.github/workflows/chat-delivery-formal.yml'
  pull_request:
    paths:
      - 'src/chat_echo.zig'
      - 'src/chat_send.zig'
      - 'src/chat_render.zig'
      - 'src/app_state.zig'
      - 'src/chat_history_reader.py'
      - 'src/chat_connectors/claude.py'
      - 'tools/chat-history-reader-test.py'
      - 'tools/multibot-feedback-test.py'
      - 'tools/scoped-pr-checks.test.js'
      - 'tools/verify-reconnect.test.js'
      - '.claude/skills/verify-chat-delivery-formal/**'
      - '.claude/skills/verify-multiprompt/features/chat-delivery-formal.md'
      - '.github/workflows/chat-delivery-formal.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chat-delivery-formal-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  formal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Check the scoped PR policy and feature-map contract
        run: node --test tools/scoped-pr-checks.test.js tools/verify-reconnect.test.js
      - name: Install Zig 0.16.0
        uses: ./.github/actions/setup-zig
      - name: Check delivery, replay findings and catch planted production breaks
        env:
          BASE: ${{ github.event.pull_request.base.sha || 'origin/master' }}
        run: python3 .claude/skills/verify-chat-delivery-formal/check.py --self-test --inherit-from "$BASE" --output "$RUNNER_TEMP/delivery-formal"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: chat-delivery-formal
          path: ${{ runner.temp }}/delivery-formal/
          if-no-files-found: error
  comment-review:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: cursor/plugins
          ref: 2f87c854fe3e2fcda44ca86b46ede35aad3c46b7
          path: pstack
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: valentinyeo/token-ladder
          ref: 496860909aae1692948589cf94c915d58018b774
          path: token-ladder
          persist-credentials: false
      - name: Read the author model family this run must exclude
        id: author
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          body="${PR_BODY:-}"
          if [ -z "$body" ]; then
            pr="$(gh api "repos/$REPO/pulls?state=open&per_page=100" --jq "[.[] | select(.head.ref == \"${GITHUB_REF_NAME}\")][0].number // empty")"
            if [ -n "$pr" ]; then
              body="$(gh api "repos/$REPO/pulls/$pr" --jq '.body')"
            fi
          fi
          printf '%s' "$body" | jq -Rs '{pull_request: {body: .}}' > "$RUNNER_TEMP/event.json"
          families=""
          if ! families="$(python3 token-ladder/ci/model_families.py "$RUNNER_TEMP/event.json" 2>"$RUNNER_TEMP/families.err")"; then
            families=""
            echo "::warning::No author model family to exclude: $(tail -n 1 "$RUNNER_TEMP/families.err")"
          fi
          echo "families=$families" >> "$GITHUB_OUTPUT"
      - name: Run pstack no-comments through the token ladder
        id: comments
        uses: valentinyeo/token-ladder/.github/actions/ladder-agent@496860909aae1692948589cf94c915d58018b774
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        with:
          prompt: |
            Read pstack/pstack/skills/poteto-mode/worker.md before anything else.
            Goal: desktop chat breaks too much. Review only this verification change.
            Shared worker rules: report Hypertask faults with hypertask feedback; report our rules and scripts faults on board 2060 with label Poteto before workarounds. If unavailable, retain the fault in your report for the orchestrator.
            Follow pstack/pstack/skills/no-comments/SKILL.md and the Comment Sicko rules in pstack/pstack/agents/comment-sicko.md.
            This run has no subagent tool, so carry out the Comment Sicko review yourself, in the foreground, in this conversation. A review that has not read the diff has not happened.
            Scope is the diff origin/master...HEAD, not the checked-out pstack or token-ladder trees. Read every changed file.
            This is a report-only check. Do not edit application code, do not commit and do not push.
            Report deletion candidates, MUST KILL flags, suppressions and constraint keeps with evidence. No findings is valid.
            The author applies accepted findings before the independent pstack-verifier.
            Write comment-review.json in the working directory as one JSON object with completed_review set true, deletion_count, restored_comments, must_kill and report. Print the same object as your final answer.
          working-directory: .
          exclude-families: ${{ steps.author.outputs.families }}
          timeout-seconds: '900'
      - name: Retain the review and prove the ladder run answered it
        env:
          ANSWER_FILE: ${{ steps.comments.outputs.answer-file }}
          LANE: ${{ steps.comments.outputs.lane }}
          MODEL: ${{ steps.comments.outputs.model }}
        run: |
          python3 - <<'PYTHON'
          import json, os, pathlib
          answer = pathlib.Path(os.environ['ANSWER_FILE'])
          assert answer.is_file() and answer.stat().st_size, 'the ladder agent left no answer'
          print(answer.read_text(encoding='utf-8', errors='replace'))
          review = json.loads(pathlib.Path('comment-review.json').read_text(encoding='utf-8'))
          assert review.get('completed_review') is True, 'the Comment Sicko review was not completed'
          for field in ('deletion_count', 'restored_comments', 'must_kill', 'report'):
              assert field in review, f'the review is missing {field}'
          review['lane'] = os.environ.get('LANE', '')
          review['model'] = os.environ.get('MODEL', '')
          pathlib.Path('comment-review.json').write_text(json.dumps(review, indent=2))
          print(json.dumps(review, indent=2))
          PYTHON
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chat-delivery-formal-comment-review
          path: comment-review.json
          if-no-files-found: error
