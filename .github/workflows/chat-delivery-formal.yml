name: Chat delivery formal

on:
  push:
    paths:
      - '.claude/skills/verify-chat-delivery-formal/**'
      - '.claude/skills/verify-multiprompt/features/chat-delivery-formal.md'
      - '.github/workflows/chat-delivery-formal.yml'
  pull_request:
    paths:
      - 'src/chat_echo.zig'
      - 'src/chat_send.zig'
      - 'src/chat_render.zig'
      - 'src/app_state.zig'
      - 'src/chat_history_reader.py'
      - 'src/chat_connectors/claude.py'
      - 'tools/chat-history-reader-test.py'
      - 'tools/multibot-feedback-test.py'
      - 'tools/scoped-pr-checks.test.js'
      - 'tools/verify-reconnect.test.js'
      - '.claude/skills/verify-chat-delivery-formal/**'
      - '.claude/skills/verify-multiprompt/features/chat-delivery-formal.md'
      - '.github/workflows/chat-delivery-formal.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chat-delivery-formal-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  formal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Check the scoped PR policy and feature-map contract
        run: node --test tools/scoped-pr-checks.test.js tools/verify-reconnect.test.js
      - name: Install Zig 0.16.0
        uses: ./.github/actions/setup-zig
      - name: Check delivery, replay findings and catch planted production breaks
        env:
          BASE: ${{ github.event.pull_request.base.sha || 'origin/master' }}
        run: python3 .claude/skills/verify-chat-delivery-formal/check.py --self-test --inherit-from "$BASE" --output "$RUNNER_TEMP/delivery-formal"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: chat-delivery-formal
          path: ${{ runner.temp }}/delivery-formal/
          if-no-files-found: error
  comment-review:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: cursor/plugins
          ref: 2f87c854fe3e2fcda44ca86b46ede35aad3c46b7
          path: pstack
          persist-credentials: false
      - name: Run pstack no-comments
        id: comments
        uses: anthropics/claude-code-action@f3b070c88125d33dbae5653df5f143101d4ea9dc
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          plugin_marketplaces: ${{ github.workspace }}/pstack
          plugins: pstack@cursor-plugins
          prompt: |
            Read pstack/pstack/skills/poteto-mode/worker.md before anything else.
            Goal: desktop chat breaks too much. Review only this verification change.
            Shared worker rules: report Hypertask faults with hypertask feedback; report our rules/scripts faults on board 2060 with label Poteto before workarounds. If unavailable, retain the fault in your report for the orchestrator.
            Follow pstack/pstack/skills/no-comments/SKILL.md in full, including spawning Comment Sicko.
            Scope is the diff origin/master...HEAD, not the checked-out pstack plugin.
            This is a report-only check. Do not edit application code or commit.
            Run Comment Sicko in the foreground with run_in_background=false and wait for its final report.
            Inspect that report before returning structured output. A launched or unfinished agent is not a completed review.
            Set completed_review=true only after completing that inspection.
            Report deletion candidates, MUST KILL flags, suppressions, and constraint keeps with evidence.
            No findings is valid. The author will apply accepted findings before the independent pstack-verifier.
          claude_args: |
            --model sonnet
            --max-turns 25
            --allowedTools "Read,Glob,Grep,Task,Agent,Skill,Bash(git diff:*),Bash(git show:*),Bash(git log:*)"
            --json-schema '{"type":"object","properties":{"completed_review":{"type":"boolean"},"deletion_count":{"type":"integer"},"restored_comments":{"type":"integer"},"must_kill":{"type":"array","items":{"type":"string"}},"report":{"type":"string"}},"required":["completed_review","deletion_count","restored_comments","must_kill","report"]}'
      - name: Retain the review and prove Comment Sicko ran
        env:
          REVIEW: ${{ steps.comments.outputs.structured_output }}
          EXECUTION: ${{ steps.comments.outputs.execution_file }}
        run: |
          python3 - <<'PYTHON'
          import json, os, pathlib
          execution = json.loads(pathlib.Path(os.environ['EXECUTION']).read_text())
          calls, completed = {}, set()
          def walk(value):
              if isinstance(value, dict):
                  if value.get('type') == 'tool_use' and value.get('name') in ('Agent', 'Task'):
                      role = value.get('input', {}).get('subagent_type', '')
                      if role.split(':')[-1] == 'comment-sicko' and not value.get('input', {}).get('run_in_background', False):
                          calls[value['id']] = role
                  if value.get('type') == 'tool_result' and not value.get('is_error', False):
                      completed.add(value.get('tool_use_id'))
                  for child in value.values():
                      walk(child)
              elif isinstance(value, list):
                  for child in value:
                      walk(child)
          walk(execution)
          agents = [role for call, role in calls.items() if call in completed]
          assert agents, 'pstack no-comments did not complete a foreground Comment Sicko review'
          review = json.loads(os.environ['REVIEW'])
          assert review.get('completed_review') is True, 'Comment Sicko report was not inspected'
          review['agents'] = agents
          pathlib.Path('comment-review.json').write_text(json.dumps(review, indent=2))
          print(json.dumps(review, indent=2))
          PYTHON
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chat-delivery-formal-comment-review
          path: comment-review.json
          if-no-files-found: error
