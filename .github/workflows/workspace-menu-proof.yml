name: Workspace menu proof

on:
  pull_request:
    paths:
      - src/workspaces.zig
      - src/workspace_switcher.zig
      - .claude/skills/verify-multiprompt/workspace-menu.ps1
      - .claude/skills/verify-multiprompt/control-native.cs
      - tools/verify-workspace-menu/**
      - .github/workflows/workspace-menu-proof.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  revisions:
    runs-on: ubuntu-latest
    outputs:
      head: ${{ steps.revisions.outputs.head }}
      base: ${{ steps.revisions.outputs.base }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: revisions
        run: |
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "base=$(git merge-base HEAD origin/master)" >> "$GITHUB_OUTPUT"
  head:
    needs: revisions
    uses: ./.github/workflows/verify.yml
    with:
      feature: workspace-menu
      revision: ${{ needs.revisions.outputs.head }}
  base:
    needs: revisions
    uses: ./.github/workflows/verify.yml
    with:
      feature: workspace-menu
      revision: ${{ needs.revisions.outputs.head }}
      app_revision: ${{ needs.revisions.outputs.base }}
