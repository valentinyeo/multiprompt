name: chat-auto-switch

on:
  push:
    paths:
      - 'src/chat_auto_switch.zig'
      - 'src/chat_history_reader.py'
      - 'tools/chat-auto-switch-journey.py'
      - 'tools/fixtures/SOFT-2469/**'
      - '.claude/skills/verify-multiprompt/features/chat-auto-switch.md'
      - '.github/workflows/chat-auto-switch.yml'
  pull_request:
    paths:
      - 'src/chat_auto_switch.zig'
      - 'src/chat_history_reader.py'
      - 'tools/chat-auto-switch-journey.py'
      - 'tools/fixtures/SOFT-2469/**'
      - '.claude/skills/verify-multiprompt/features/chat-auto-switch.md'
      - '.github/workflows/chat-auto-switch.yml'
  workflow_dispatch:
    inputs:
      real_pi_codex:
        description: Run the real Pi Codex plan continuity proof without new credentials
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: chat-auto-switch-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  journey:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Replay the recorded usage-limit fixtures
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/revision.txt
          set -o pipefail
          python3 tools/chat-auto-switch-journey.py --evidence evidence 2>&1 | tee evidence/journey.log
      - name: Upload the switch evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chat-auto-switch
          path: evidence/
          if-no-files-found: error

  real-pi-codex:
    if: github.event_name == 'workflow_dispatch' && inputs.real_pi_codex
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: valentinyeo/vstack
          ref: 65cf9d41428d43905cf059fe5ad61ba5d5ffb8c1
          path: proof-skills
          sparse-checkout: skills/valentin-mode
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Install the pinned real clients
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tmux
          npm install --prefix "$RUNNER_TEMP/proof-clients" --no-audit --no-fund @openai/codex@0.169.0 @earendil-works/pi-coding-agent@1.5.0
          echo "$RUNNER_TEMP/proof-clients/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Continue a real Codex plan through Pi and back
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        run: timeout --signal=INT --kill-after=45s 1200 python3 tools/pi-codex-continuity.py --skills proof-skills/skills/valentin-mode --evidence evidence/real-pi-codex
      - name: Retain sanitized real-provider proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: real-pi-codex
          path: evidence/real-pi-codex/
          if-no-files-found: error
