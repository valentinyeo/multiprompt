name: chat-auto-switch

on:
  push:
    paths:
      - 'src/chat_auto_switch.zig'
      - 'src/chat_history_reader.py'
      - 'tools/chat-auto-switch-journey.py'
      - 'tools/fixtures/SOFT-2469/**'
      - '.claude/skills/verify-multiprompt/features/chat-auto-switch.md'
      - '.github/workflows/chat-auto-switch.yml'
  pull_request:
    paths:
      - 'src/chat_auto_switch.zig'
      - 'src/chat_history_reader.py'
      - 'tools/chat-auto-switch-journey.py'
      - 'tools/fixtures/SOFT-2469/**'
      - '.claude/skills/verify-multiprompt/features/chat-auto-switch.md'
      - '.github/workflows/chat-auto-switch.yml'
  workflow_dispatch:
    inputs:
      real_pi_codex:
        description: Run the real Pi Codex plan continuity proof without new credentials
        type: boolean
        default: false
      real_agy_preflight:
        description: Restore the existing Antigravity plan login and check the real CLI
        type: boolean
        default: false
      agy_restore_ref:
        description: Approved full vstack commit containing ci-plan-login-restore
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: chat-auto-switch-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  journey:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Replay the recorded usage-limit fixtures
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/revision.txt
          set -o pipefail
          python3 tools/chat-auto-switch-journey.py --evidence evidence 2>&1 | tee evidence/journey.log
      - name: Upload the switch evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chat-auto-switch
          path: evidence/
          if-no-files-found: error

  real-pi-codex:
    if: github.event_name == 'workflow_dispatch' && inputs.real_pi_codex
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: valentinyeo/vstack
          ref: 65cf9d41428d43905cf059fe5ad61ba5d5ffb8c1
          path: proof-skills
          sparse-checkout: skills/valentin-mode
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Install the pinned real clients
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tmux
          npm install --prefix "$RUNNER_TEMP/proof-clients" --no-audit --no-fund @openai/codex@0.169.0 @earendil-works/pi-coding-agent@1.5.0
          echo "$RUNNER_TEMP/proof-clients/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Continue a real Codex plan through Pi and back
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        run: timeout --signal=INT --kill-after=45s 1200 python3 tools/pi-codex-continuity.py --skills proof-skills/skills/valentin-mode --evidence evidence/real-pi-codex
      - name: Retain sanitized real-provider proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: real-pi-codex
          path: evidence/real-pi-codex/
          if-no-files-found: error

  real-agy-preflight:
    if: github.repository == 'valentinyeo/multiprompt' && github.event_name == 'workflow_dispatch' && inputs.real_agy_preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require the approved restore revision
        env:
          AGY_RESTORE_REF: ${{ inputs.agy_restore_ref }}
        run: |
          if [[ ! "$AGY_RESTORE_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo 'An approved full vstack restore commit is required.' >&2
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: valentinyeo/vstack
          ref: ${{ inputs.agy_restore_ref }}
          path: plan-login-tools
          persist-credentials: false
      - name: Require the restore helper and real CLI
        run: |
          test -x plan-login-tools/tools/ci-plan-login-restore || {
            echo 'The selected revision has no executable plan-login restore helper.' >&2
            exit 1
          }
          command -v agy >/dev/null || {
            echo 'A pinned real Antigravity CLI installation is required on this runner.' >&2
            exit 1
          }
      - name: Restore the existing Antigravity plan login
        env:
          AGY_PLAN_LOGIN: ${{ secrets.AGY_PLAN_LOGIN }}
        run: |
          set +x +v
          umask 077
          if [[ -z "$AGY_PLAN_LOGIN" ]]; then
            echo 'The approved Antigravity plan login is not configured.' >&2
            exit 1
          fi
          plan-login-tools/tools/ci-plan-login-restore agy
      - name: Check the real Neon CLI prerequisite
        run: |
          timeout --signal=INT --kill-after=10s 30 agy --version
          timeout --signal=INT --kill-after=10s 30 agy models > "$RUNNER_TEMP/agy-models.txt"
          if ! grep -Fq 'gemini-4-neon-medium' "$RUNNER_TEMP/agy-models.txt"; then
            echo 'The requested Neon model is unavailable; no substitute will run.' >&2
            exit 1
          fi
          echo 'Restore and CLI preflight completed. Real reply, history and skill continuity remain unverified.' >> "$GITHUB_STEP_SUMMARY"
