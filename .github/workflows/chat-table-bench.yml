name: Chat table bench
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bench:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: after
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.base.sha || 'master' }}
          path: before
      - name: Install pinned Zig
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP/zig.zip"
          Invoke-WebRequest https://ziglang.org/download/0.16.0/zig-x86_64-windows-0.16.0.zip -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne '68659eb5f1e4eb1437a722f1dd889c5a322c9954607f5edcf337bc3684a75a7e') { throw 'Zig checksum mismatch' }
          Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP
          "$env:RUNNER_TEMP/zig-x86_64-windows-0.16.0" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: Measure original and proposed production table measurers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force evidence | Out-Null
          node --test after/tools/chat-table-bench/bench.test.js
          if ($LASTEXITCODE -ne 0) { throw 'Benchmark controls failed' }
          foreach ($revision in @('before', 'after')) {
            git -C $revision rev-parse HEAD | Set-Content "evidence/$revision-revision.txt"
            node after/tools/chat-table-bench/prepare.js $revision
            if ($LASTEXITCODE -ne 0) { throw "Benchmark preparation failed for $revision" }
            $source = (Resolve-Path $revision).Path
            $prefix = Join-Path $pwd "evidence/$revision-bin"
            zig build --build-file after/tools/chat-table-bench/build.zig "-Dsource=$source" --prefix $prefix --summary all 2>&1 | Tee-Object "evidence/$revision-build.log"
            if ($LASTEXITCODE -ne 0) { throw "Table benchmark build failed for $revision" }
            git -C $revision diff --exit-code -- build.zig
            if ($LASTEXITCODE -ne 0) { throw 'Revision build graph changed' }
          }
          foreach ($sample in 1..7) {
            $order = if ($sample % 2) { @('before', 'after') } else { @('after', 'before') }
            foreach ($revision in $order) {
              $env:APPDATA = Join-Path $pwd "evidence/$revision-$sample"
              $env:ZIGSHELL_DEBUG = '0'
              & "./evidence/$revision-bin/bin/chat-table-bench.exe" 2>&1 | Tee-Object "evidence/$revision-$sample.log"
              if ($LASTEXITCODE -ne 0) { throw "Table benchmark sample failed for $revision" }
            }
          }
          node after/tools/chat-table-bench/summary.js evidence
          if ($LASTEXITCODE -ne 0) { throw 'Table benchmark comparison failed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: chat-table-bench
          path: evidence/
