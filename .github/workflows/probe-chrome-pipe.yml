name: Probe Chrome debugging pipe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install Zig 0.16.0
        run: |
          $zip = "$env:RUNNER_TEMP/zig.zip"
          Invoke-WebRequest https://ziglang.org/download/0.16.0/zig-x86_64-windows-0.16.0.zip -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne '68659eb5f1e4eb1437a722f1dd889c5a322c9954607f5edcf337bc3684a75a7e') { throw 'Zig checksum mismatch' }
          Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP
          "$env:RUNNER_TEMP/zig-x86_64-windows-0.16.0" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: Install Chrome for Testing
        run: npm install --prefix "$env:RUNNER_TEMP/browser-verify" puppeteer@24.31.0
      - name: Build bridge
        run: zig build -Dtarget=x86_64-windows-gnu -Drelease=true --summary all
      - name: Probe Chrome profiles
        run: |
          $ErrorActionPreference = 'Continue'
          $branded = 'C:\Program Files\Google\Chrome\Application\chrome.exe'
          $cft = Get-ChildItem "$env:USERPROFILE\.cache\puppeteer\chrome" -Recurse -Filter chrome.exe | Select-Object -First 1
          $ext = (Resolve-Path 'extension').Path
          $theme = Join-Path $ext 'themes\dark'
          $bridge = (Resolve-Path 'zig-out\bin\zigshell-bridge.exe').Path
          $logPath = Join-Path $env:APPDATA 'ZigShell\bridge-launch.log'
          $root = Join-Path $env:RUNNER_TEMP 'probe'
          $results = [System.Collections.Generic.List[string]]::new()
          Write-Output "BRANDED exe=$branded version=$([System.Diagnostics.FileVersionInfo]::GetVersionInfo($branded).FileVersion)"
          Write-Output "CFT exe=$($cft.FullName) folder=$($cft.Directory.Parent.Name) version=$($cft.VersionInfo.FileVersion)"
          Write-Output "EXTENSION $ext"
          Write-Output "THEME $theme"
          Write-Output "BRIDGE $bridge"

          function Invoke-Probe([string]$scenario, [string]$chrome, [string]$profile, [switch]$seed) {
            Write-Output "SCENARIO $scenario exe=$chrome profile=$profile"
            Remove-Item $logPath -Force -ErrorAction SilentlyContinue
            $launcher = $null
            try {
              $arguments = 'chrome-launch "{0}" "{1}" "{2}" "--user-data-dir={3}" "--no-first-run" "--no-default-browser-check" "--new-window" "data:text/html,<title>PROBE</title>"' -f $chrome, $ext, $theme, $profile
              $launcher = Start-Process -FilePath $bridge -ArgumentList $arguments -PassThru
              Start-Sleep -Seconds 25
              $log = if (Test-Path $logPath) { Get-Content $logPath -Raw } else { '' }
              Write-Output "BRIDGE-LOG-BEGIN $scenario"
              Write-Output $log
              Write-Output "BRIDGE-LOG-END $scenario"
              $replies = [regex]::Matches($log, '(?m)^CDP reply id=').Count
              $loaded = if ($log -match '(?m)^extension loaded\r?$') { 'yes' } else { 'no' }
              $preferences = Join-Path $profile 'Default\Secure Preferences'
              $mentionsExtension = $false
              if (Test-Path $preferences) {
                $preferencesText = (Get-Content $preferences -Raw).Replace('\\', '\')
                $mentionsExtension = $preferencesText.IndexOf($ext, [System.StringComparison]::OrdinalIgnoreCase) -ge 0
              }
              Write-Output "SECURE-PREFERENCES $scenario exists=$(Test-Path $preferences) mentions-extension=$mentionsExtension"
              $pipes = @([System.IO.Directory]::GetFiles('\\.\pipe\') | Where-Object { $_ -like '\\.\pipe\multiprompt-browser-isolated-own-*' })
              Write-Output "ISOLATED-PIPES $scenario exists=$($pipes.Count -gt 0) count=$($pipes.Count)"
              $pipes | Write-Output
              $result = "PROBE $scenario replies=$replies loaded=$loaded"
              Write-Output $result
              if (-not $seed) { $results.Add($result) }
            } catch {
              Write-Output "PROBE-ERROR $scenario $_"
              $result = "PROBE $scenario replies=0 loaded=no"
              Write-Output $result
              if (-not $seed) { $results.Add($result) }
            } finally {
              $processes = @(Get-Process -Name chrome -ErrorAction SilentlyContinue)
              $processes | Stop-Process -Force -ErrorAction SilentlyContinue
              foreach ($process in $processes) {
                try { $process.WaitForExit() } catch { Write-Output "CHROME-EXIT $scenario $_" }
              }
              if ($launcher -and -not $launcher.WaitForExit(5000)) {
                $launcher | Stop-Process -Force -ErrorAction SilentlyContinue
                $launcher.WaitForExit()
              }
            }
          }

          Get-Process -Name chrome -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Invoke-Probe 'branded-cold' $branded (Join-Path $root 'branded-cold')
          Invoke-Probe 'cft-migration-seed' $cft.FullName (Join-Path $root 'migrated') -seed
          Invoke-Probe 'cft-then-branded' $branded (Join-Path $root 'migrated')
          Invoke-Probe 'branded-second-launch' $branded (Join-Path $root 'branded-cold')
          Invoke-Probe 'cft-only' $cft.FullName (Join-Path $root 'cft')
          Write-Output 'PROBE SUMMARY'
          $results | Write-Output
          exit 0
