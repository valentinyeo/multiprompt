name: Chat bench A/B
run-name: IGSH-513 one-line idle front A/B ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      tag_a:
        description: First release tag, such as v0.28.783
        required: true
        type: string
      tag_b:
        description: Second release tag, such as v0.28.786
        required: true
        type: string
      runs:
        description: Runs per tag (1 to 10)
        required: true
        default: '3'
        type: string

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      TAG_A: ${{ github.event_name == 'pull_request' && 'v0.28.789' || inputs.tag_a }}
      TAG_B: ${{ github.event_name == 'pull_request' && 'v0.28.791' || inputs.tag_b }}
      RUNS: ${{ github.event_name == 'pull_request' && '3' || inputs.runs }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: tooling
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Test summary calculations
        run: node --test candidate/tools/chat-bench-ab-summary.test.js
      - name: Plan same-source baseline and candidate
        run: |
          mkdir results
          git -C candidate rev-parse HEAD > results/candidate-commit.txt
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const plan = [];
          for (let index = 1; index <= Number(process.env.RUNS); index++) {
            for (const label of ['A', 'B']) plan.push({label, index, path: `runs/${label}-${index}/results.json`});
          }
          fs.writeFileSync('results/manifest.json', JSON.stringify(plan, null, 2));
          NODE
      - name: Set up the documented Linux and Wine environment
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends strace python3 wine64 wine fonts-wine fonts-liberation fonts-dejavu-core xfonts-base xvfb xauth xdotool x11-utils imagemagick curl xz-utils dbus-user-session
          sudo loginctl enable-linger "$(id -un)"
          sudo systemctl start "user@$(id -u).service"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
          sudo mkdir -p /opt/chat-bench
          sudo chown "$(id -u):$(id -g)" /opt/chat-bench
      - name: Prepare synthetic fixtures and reader tooling
        working-directory: tooling
        run: |
          mkdir -p /opt/chat-bench/tooling /opt/chat-bench/results
          cp -r tools src /opt/chat-bench/tooling/
          cp -r ../results/. /opt/chat-bench/results/
          cd /opt/chat-bench
          curl -fsSL https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz -o zig.tar.xz
          echo '70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  zig.tar.xz' | sha256sum -c -
          tar -xf zig.tar.xz
          export ZIG=/opt/chat-bench/zig-x86_64-linux-0.16.0/zig
          export ZIG_GLOBAL_CACHE_DIR=/opt/chat-bench/zig-global-cache
          export ZIG_LOCAL_CACHE_DIR=/opt/chat-bench/zig-local-cache
          cd tooling
          node -e 'const fs = require("fs"); for (const r of JSON.parse(fs.readFileSync("../results/manifest.json"))) console.log([r.label, r.path].join("\t"))' > ../results/plan.tsv
          while IFS=$'\t' read -r label result; do
            out="/opt/chat-bench/results/$(dirname "$result")"
            mkdir -p "$out"
            "$ZIG" cc -target x86_64-windows-gnu -O2 -municode -Wl,--subsystem,windows "$PWD/tools/chat-bench/browser-fixture.c" -o "$out/browser-fixture.exe" -luser32
          done < ../results/plan.tsv
          cd "$GITHUB_WORKSPACE/candidate"
          cp src/main.zig /opt/chat-bench/fixed-main.zig
          python3 - <<'PYBUILD'
          from pathlib import Path
          p = Path('src/main.zig')
          s = p.read_text()
          old = 'visible and sid != null and (user or app_state.g_front_period.selected == sid) and foregroundIsOurs()'
          assert s.count(old) == 1
          p.write_text(s.replace(old, 'visible and foregroundIsOurs()'))
          PYBUILD
          "$ZIG" build -Dtarget=x86_64-windows-gnu
          mkdir -p /opt/chat-bench/results/releases/A /opt/chat-bench/results/releases/B
          cp zig-out/bin/multiprompt.exe /opt/chat-bench/results/releases/A/multiprompt-x64.exe
          cp /opt/chat-bench/fixed-main.zig src/main.zig
          "$ZIG" build -Dtarget=x86_64-windows-gnu
          cp zig-out/bin/multiprompt.exe /opt/chat-bench/results/releases/B/multiprompt-x64.exe
          printf 'A: candidate source with only the foreground eligibility guard reverted. B: candidate source unchanged. These are branch builds, not release-tag results.\n' > /opt/chat-bench/results/comparison.txt
          cd /opt/chat-bench/tooling
          test "$(cat /proc/1/comm)" = systemd
          systemd-run --user --scope --quiet true
          {
            printf 'Linux/Wine on GitHub-hosted Ubuntu 24.04; not native Windows acceptance.\n'
            cat /etc/os-release
            node --version
            wine --version
            dpkg-query -W wine wine64 libwine xvfb fonts-wine fonts-liberation fonts-dejavu-core
            free -m
            nproc
            git -C "$GITHUB_WORKSPACE/tooling" ls-files --eol tools/chat-bench src/chat_history_reader.py
            sha256sum tools/chat-bench/run.mjs tools/chat-bench/lib.mjs tools/chat-bench/reader-service.py tools/chat-bench/browser-fixture.c
          } | tee ../results/environment.txt
      - name: Trace idle syscalls
        working-directory: tooling
        run: |
          python3 - <<'PYTRACE'
          from pathlib import Path
          p = Path('/opt/chat-bench/tooling/tools/chat-bench/run.mjs')
          s = p.read_text()
          s = s.replace("let timer;", "let timer; const traced = new Set();")
          anchor = "      if (guiCount !== config.windows)"
          trace = """      if (run.samples.at(-1).idle && !traced.has(phase)) {
                  traced.add(phase);
                  const args = ['timeout', '12s', 'strace', '-f', '-tt', '-T', '-o', path.join('/opt/chat-bench/results', `idle-${path.basename(out)}-${phase}.strace`), ...[...current.keys()].flatMap(pid => ['-p', String(pid)])];
                  const trace = spawn('sudo', args, { stdio: ['ignore', 'ignore', logFd] });
                  trace.on('error', error => run.errors.push(`trace: ${error.message}`));
                }
          """
          assert anchor in s
          s = s.replace(anchor, trace + anchor)
          p.write_text(s)
          PYTRACE
      - name: Run default config in A B order
        working-directory: tooling
        run: |
          destination="$(pwd)/../results"
          trap 'cp -r /opt/chat-bench/results/. "$destination/"' EXIT
          cd /opt/chat-bench/tooling
          export GITHUB_ACTIONS=true
          export ZIG=/opt/chat-bench/zig-x86_64-linux-0.16.0/zig
          export ZIG_GLOBAL_CACHE_DIR=/opt/chat-bench/zig-global-cache
          export ZIG_LOCAL_CACHE_DIR=/opt/chat-bench/zig-local-cache
          while IFS=$'\t' read -r label result; do
            out="/opt/chat-bench/results/$(dirname "$result")"
            mkdir -p "$out"
            set +e
            node tools/chat-bench/run.mjs --exe "/opt/chat-bench/results/releases/$label/multiprompt-x64.exe" --out "$out" 2>&1 | tee "$out/runner.log"
            code=${PIPESTATUS[0]}
            set -e
            printf '%s\n' "$code" > "$out/exit-code.txt"
            if [ "$code" -ne 0 ] && [ "$code" -ne 1 ]; then
              echo "Benchmark infrastructure failed with exit $code"
              exit "$code"
            fi
            test -f "$out/results.json"
          done < ../results/plan.tsv
      - name: Write one-line comparison
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          for (const row of JSON.parse(fs.readFileSync('results/manifest.json'))) {
            const result = JSON.parse(fs.readFileSync(`results/${row.path}`));
            console.log(row.label, row.index, result.status, result.metrics.idleAverageCpu, result.failures);
          }
          NODE
      - name: Upload all benchmark evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chat-bench-ab
          path: results/
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 9
