name: Structured question journey

on:
  push:
    branches: [ceo/IGSH-1063]
  repository_dispatch:
    types: [structured-question-proof]

permissions:
  contents: read

jobs:
  questions:
    uses: ./.github/workflows/verify.yml
    with:
      feature: chat-options
      tag: ${{ github.event.client_payload.tag || '' }}
