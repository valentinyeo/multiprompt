name: Structured question journey

on:
  workflow_dispatch:
  schedule:
    - cron: '44 3 * * *'

permissions:
  contents: read

concurrency:
  group: question-journey-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  questions:
    uses: ./.github/workflows/verify.yml
    with:
      feature: chat-options
      tag: ${{ github.event.client_payload.tag || '' }}
