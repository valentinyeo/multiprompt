name: Chat echo budget

on:
  pull_request:
    paths:
      - 'src/chat_perf_test.zig'
      - 'src/chat_echo.zig'
      - 'tools/ci-receipt-summary.mjs'
      - '.claude/skills/verify-multiprompt/features/chat-echo-budget.md'
      - '.github/workflows/chat-echo-budget.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chat-echo-budget-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  budget:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Keep LF line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Install Zig 0.16.0
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\zig.zip"
          Invoke-WebRequest https://ziglang.org/download/0.16.0/zig-x86_64-windows-0.16.0.zip -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne '68659eb5f1e4eb1437a722f1dd889c5a322c9954607f5edcf337bc3684a75a7e') { throw "zig checksum mismatch: $hash" }
          tar -xf $zip -C $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { throw 'zig extraction failed' }
          "$env:RUNNER_TEMP\zig-x86_64-windows-0.16.0" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: Run the echo-assign CPU budget
        id: run
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\receipt-input" | Out-Null
          $log = "$env:RUNNER_TEMP\receipt-input\chat-echo-budget.log"
          zig test src/chat_perf_test.zig -O ReleaseSmall -mcpu=baseline --test-filter IGSH-991 2>&1 | Out-File -Encoding utf8 $log
          "code=$LASTEXITCODE" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
      - name: Write the receipt
        if: always()
        shell: pwsh
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $code = '${{ steps.run.outputs.code }}'
          if (-not $code) { $code = '1' }
          node tools/ci-receipt-summary.mjs "$env:RUNNER_TEMP\receipt-input\chat-echo-budget.log" "$env:RUNNER_TEMP\chat-echo-budget" $code '^CPU(961|991) '
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: chat-echo-budget
          path: ${{ runner.temp }}/chat-echo-budget/
          if-no-files-found: error
