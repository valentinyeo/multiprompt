name: IGSH-1049 exact master replay

on:
  push:
    branches: [ceo/IGSH-1049-master-proof]

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Replay the unchanged merged CPU fix
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          sha=$(gh api "repos/$REPO/git/ref/heads/ceo/IGSH-1049-exact-proof" --jq .object.sha)
          test "$sha" = 4231e1738a1dbf9351e69c63e97bb905a751c114
          gh workflow run test.yml -R "$REPO" --ref ceo/IGSH-1049-exact-proof
