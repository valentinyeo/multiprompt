name: Chat agent identity

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/mp_sessions.py'
      - 'src/mp_helper.py'
      - 'src/chat_history_reader.py'
      - 'tools/mb.mjs'
      - 'tools/hypertask-agent-test.py'
      - 'tools/fixtures/SOFT-2443/**'
      - '.github/workflows/hypertask-agent.yml'

permissions:
  contents: read

concurrency:
  group: chat-agent-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  agent-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prove the original rename misses Hypertask
        run: |
          set +e
          MP_AGENT_SESSIONS_SOURCE=tools/fixtures/SOFT-2443/mp_sessions.before.py timeout 60 python3 tools/hypertask-agent-test.py AgentTest.test_rename_reaches_hypertask_with_chat_token > before.log 2>&1
          status=$?
          set -e
          cat before.log
          test "$status" = 1
          grep -F 'AssertionError:' before.log
          grep -F 'Original chat' before.log
      - name: Verify chat agent lifecycle without live services
        run: timeout 120 python3 tools/hypertask-agent-test.py -v
      - name: Verify existing session commands
        run: timeout 120 python3 tools/mp-sessions-test.py -v
      - name: Verify helper commands
        run: timeout 120 python3 tools/mp-helper-test.py -v
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: agent-rename-before
          path: before.log
