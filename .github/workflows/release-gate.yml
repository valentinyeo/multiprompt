name: Release gate
run-name: release gate ${{ github.sha }}

on:
  workflow_dispatch:
  schedule:
    - cron: '52 3 * * *'

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  journey:
    uses: ./.github/workflows/verify.yml
    with:
      feature: relaunch-saved-sessions
