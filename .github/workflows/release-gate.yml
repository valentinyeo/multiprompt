name: Release gate
run-name: release gate ${{ github.sha }}

on:
  workflow_dispatch:
  schedule:
    - cron: '52 3 * * *'

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.event_name == 'push' && github.sha || github.run_id }}
  cancel-in-progress: false

jobs:
  journey:
    uses: ./.github/workflows/verify.yml
    with:
      feature: relaunch-saved-sessions
