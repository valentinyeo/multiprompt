name: automerge

on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write
  checks: read
  statuses: read

concurrency:
  group: automerge
  cancel-in-progress: false

jobs:
  automerge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # SF_APP_* secrets live in this environment, limited to master, so PR branches cannot read them.
    environment: automerge
    steps:
      - name: Mint software-factory-runners token for update-branch
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.SF_APP_ID }}
          private-key: ${{ secrets.SF_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: master
          sparse-checkout: tools
          persist-credentials: false
      - name: Merge admitted heads and start master checks
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REPO_OWNER: ${{ github.repository_owner }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          AUTOMERGE_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = workflow_run ]; then
            if [ "$RUN_CONCLUSION" != success ] || [ "$RUN_EVENT" != pull_request ]; then exit 0; fi
            candidates=$(gh pr list -R "$REPO" --base master --state open --head "$HEAD_BRANCH" --limit 1000 --json number,headRefOid | jq -r --arg sha "$HEAD_SHA" '.[] | select(.headRefOid == $sha) | .number')
          else
            candidates=$(gh pr list -R "$REPO" --base master --state open --search 'status:success' --limit 1000 --json number | jq -r '.[].number')
          fi
          for pr in $candidates; do
            info=$(gh pr view "$pr" -R "$REPO" --json isDraft,labels,mergeable,statusCheckRollup,headRefOid,isCrossRepository,author,baseRefName,changedFiles) || { echo "#$pr: could not read PR"; continue; }
            head_oid=$(jq -er '.headRefOid | select(test("^[0-9a-f]{40}$"))' <<< "$info") || { echo "#$pr: invalid head"; continue; }
            if [ "$EVENT_NAME" = workflow_run ] && [ "$head_oid" != "$HEAD_SHA" ]; then continue; fi
            behind_by=$(gh api "repos/$REPO/compare/master...$head_oid" --jq .behind_by) || behind_by=''
            file_info=$(gh api "repos/$REPO/pulls/$pr/files?per_page=100" --paginate --slurp) || { echo "#$pr: could not list files"; continue; }
            if ! jq -e --argjson count "$(jq '.changedFiles' <<< "$info")" 'add | length == $count' <<< "$file_info" >/dev/null; then
              echo "#$pr: incomplete PR file list"
              continue
            fi
            files=$(jq '[.[][] | .filename, (.previous_filename // empty)]' <<< "$file_info")
            printf '%s' "$info" > "$RUNNER_TEMP/pr-info.json"
            printf '%s' "$files" > "$RUNNER_TEMP/pr-files.json"
            verdict=$(bash tools/automerge-admit.sh "$RUNNER_TEMP/pr-info.json" "$RUNNER_TEMP/pr-files.json" "$behind_by" "$REPO_OWNER") || verdict='skip (admission script failed)'
            echo "#$pr: $verdict"
            if [ "$verdict" = update ]; then
              if [ -z "${AUTOMERGE_TOKEN:-}" ]; then
                echo "#$pr: skip update (no app token; github.token updates do not start checks)"
                continue
              fi
              if GH_TOKEN="$AUTOMERGE_TOKEN" gh api --method PUT "repos/$REPO/pulls/$pr/update-branch" -f expected_head_sha="$head_oid" >/dev/null; then
                echo "#$pr: updated with master"
              else
                echo "#$pr: update branch failed"
              fi
              continue
            fi
            if [ "$verdict" != merge ]; then continue; fi
            if gh pr merge "$pr" -R "$REPO" --squash --delete-branch --match-head-commit "$head_oid"; then
              for workflow in test.yml no-comments.yml gitleaks.yml; do
                gh workflow run "$workflow" -R "$REPO" --ref master
              done
              break
            fi
          done
          if [ "$EVENT_NAME" = workflow_run ]; then exit 0; fi
          head_oid=$(gh api "repos/$REPO/commits/master" --jq .sha)
          for workflow in test.yml no-comments.yml gitleaks.yml; do
            count=$(gh run list -R "$REPO" -w "$workflow" -b master --commit "$head_oid" --event workflow_dispatch --json databaseId -q length)
            push_count=$(gh run list -R "$REPO" -w "$workflow" -b master --commit "$head_oid" --event push --json databaseId -q length)
            if [ "$count" -eq 0 ] && [ "$push_count" -eq 0 ]; then
              gh workflow run "$workflow" -R "$REPO" --ref master
            fi
          done
