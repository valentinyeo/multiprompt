name: automerge

on:
  workflow_run:
    workflows: [Tests, Verify desktop, PR checks, Gitleaks, Ledger guard, check-red-run]
    types: [completed]
    branches-ignore: [master]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number
        required: true
        type: string
      dry_run:
        description: Inspect without merging or dispatching checks
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: write
  actions: write
  checks: read
  statuses: read

jobs:
  automerge:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       toJSON(github.event.workflow_run.pull_requests) != 'null' &&
       github.event.workflow_run.pull_requests[0].number != null &&
       github.event.workflow_run.pull_requests[1] == null)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Record checked out head
        run: git rev-parse HEAD
      - name: Prove regression on merge-base source
        if: github.event_name == 'workflow_dispatch'
        run: node tools/check-red-run.mjs origin/master HEAD
      - name: Check admission regressions before manual inspection
        if: github.event_name == 'workflow_dispatch'
        run: node --test tools/automerge-admit-run.test.js tools/ci-admission.test.js && bash tools/automerge-admit.test.sh
      - name: Inspect one PR and start master checks only after merging
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node tools/automerge-admit-run.js
