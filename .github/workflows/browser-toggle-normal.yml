name: Browser normal-spacing evidence
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published Windows release
        required: true
        default: v0.28.1005
        type: string
permissions:
  contents: read
jobs:
  browser-toggle-normal:
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      RELEASE_TAG: ${{ inputs.tag || 'v0.28.1005' }}
    steps:
      - name: Keep LF line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ee3a7bd498b982fcfae35dcffe166fa66ab94ccb
          path: before-source
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install native recorder
        shell: pwsh
        run: |
          choco install ffmpeg --version=7.1.1 --yes --no-progress --limit-output
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg installation failed' }
      - name: Check regression and PowerShell contracts
        shell: powershell
        run: |
          node --test --test-name-pattern="IGSH-1165" tools/verify-multiprompt.test.js
          if ($LASTEXITCODE -ne 0) { throw 'Normal-spacing regression failed' }
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$pwd/tools/browser-toggle-normal.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { throw ($errors | Out-String) }
      - name: Resolve checksum-verified published executable
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw 'Expected a version tag' }
          New-Item -ItemType Directory -Force verify-bin | Out-Null
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --dir verify-bin --pattern multiprompt-x64.exe --pattern zigshell-bridge-x64.exe --pattern SHA256SUMS.txt
          if ($LASTEXITCODE -ne 0) { throw 'Release download failed' }
          foreach ($asset in @('multiprompt', 'zigshell-bridge')) {
            $checks = @(Get-Content verify-bin/SHA256SUMS.txt | Where-Object { $_ -match ('^[a-fA-F0-9]{64} [ *]' + $asset + '-x64\.exe$') })
            if ($checks.Count -ne 1) { throw "Expected one checksum for $asset" }
            $expected = ($checks[0] -split '\s+')[0].ToLowerInvariant()
            if ((Get-FileHash "verify-bin/$asset-x64.exe" -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw "Release checksum mismatch for $asset" }
            Move-Item "verify-bin/$asset-x64.exe" "verify-bin/$asset.exe"
          }
          $version = $env:RELEASE_TAG.Substring(1)
          $binary = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes("$pwd/verify-bin/multiprompt.exe"))
          if (-not $binary.Contains("MPVERSION=$version;")) { throw 'Executable version mismatch' }
          $hash = (Get-FileHash verify-bin/multiprompt.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "VERIFY_VERSION=$version" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "VERIFY_SHA256=$hash" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Alternate twenty before and twenty after isolated journeys
        shell: powershell
        run: |
          & tools/browser-toggle-normal.ps1 -Exe "$pwd/verify-bin/multiprompt.exe" -ExpectedVersion $env:VERIFY_VERSION -ExpectedHash $env:VERIFY_SHA256 -BeforeRoot "$pwd/before-source" -Output "$pwd/evidence" -Runs 20
      - name: Upload bounded native evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-toggle-normal
          path: evidence/
          if-no-files-found: error
          retention-days: 14
