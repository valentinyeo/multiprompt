name: Verify long chat continuity

on:
  workflow_dispatch:
  schedule:
    - cron: '24 4 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ github.ref_name == 'ceo/IGSH-1059-release' }}
        run: |
          if [ "$RELEASE" = true ]; then
            echo "tag=$(gh api repos/${{ github.repository }}/releases/latest --jq .tag_name)" >> "$GITHUB_OUTPUT"
          fi
  desktop:
    needs: source
    uses: ./.github/workflows/verify.yml
    with:
      feature: chat-full-history
      tag: ${{ needs.source.outputs.tag }}
      long_chat_proof: true
