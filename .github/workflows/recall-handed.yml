name: Handed message recall

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published desktop release to verify
        required: true
        type: string
  push:
    branches:
      - cursor/igsh-1828-handed-recall-proof

permissions:
  contents: read

jobs:
  ui:
    uses: ./.github/workflows/verify.yml
    with:
      feature: chat-delivery
      chat_recall_proof: true
      tag: ${{ inputs.tag || 'v0.28.1677' }}
