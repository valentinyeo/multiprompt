            $version = $env:VERIFY_VERSION
            $embeddedRevision = $env:VERIFY_REVISION
          }
          $binary = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes("$pwd/verify-bin/multiprompt.exe"))
          if (-not $env:RELEASE_TAG -and ($embeddedRevision -cne $revision -or -not $binary.Contains("MPREVISION=$revision;"))) { throw 'Executable source revision mismatch' }
