name: Verify desktop
run-name: verify ${{ inputs.feature || 'appearance' }} ${{ inputs.tag || github.head_ref || github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      feature:
        description: Feature map file stem in .claude/skills/verify-multiprompt/features
        required: true
        default: appearance
        type: string
      tag:
        description: Optional release tag instead of building this branch
        required: false
        type: string
  pull_request:
    paths:
      - .claude/skills/verify-multiprompt/**
      - .github/workflows/verify.yml
      - tools/verify-multiprompt.test.js
      - src/**
      - tools/check-browser-pane-stuck.mjs

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        feature: ${{ github.event_name == 'pull_request' && fromJSON('["appearance", "browser-pane-stuck"]') || fromJSON(format('["{0}"]', inputs.feature)) }}
    env:
      FEATURE: ${{ matrix.feature }}
      RELEASE_TAG: ${{ inputs.tag || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check verification contracts
        run: node --test tools/verify-multiprompt.test.js
      - name: Check browser recovery journey contract
        run: node tools/check-browser-pane-stuck.mjs
      - name: Validate journey and syntax
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:FEATURE -notin @('appearance', 'sessions', 'workspaces', 'inbox', 'command-palette', 'session-open', 'browser-pane-stuck', 'chat-tables')) { throw 'Unknown feature map' }
