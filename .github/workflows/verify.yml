name: Verify desktop
run-name: verify ${{ inputs.feature || (github.event_name == 'push' && 'full' || 'appearance') }} ${{ inputs.tag || github.head_ref || github.ref_name }}

on:
  push:
    branches: [master, 'ceo/IGSH-1072*', ceo/IGSH-1061-recovery, ceo/IGSH-1083, ceo/IGSH-1079, ceo/IGSH-1055-hax2, ceo/IGSH-1053-hax11]
  workflow_dispatch:
    inputs:
      feature:
        description: Feature map file stem in .claude/skills/verify-multiprompt/features, or all for the full matrix
        required: true
        default: appearance
        type: string
      dictation_stall:
        description: Deliberately stall the dictation capture precondition to prove failure evidence
        required: false
        default: false
        type: boolean
      tag:
        description: Optional release tag instead of building this branch
        required: false
        type: string
      usage_pace_proof:
        description: Verify per-window pace through the existing SSH status boundary
        required: false
        default: false
        type: boolean
      usage_pace_status:
        description: Optional base64 sanitized live Token Ladder status snapshot
        required: false
        type: string
      sending_status_proof:
        description: Capture the same message in flight and after delivery
        required: false
        default: false
        type: boolean
      chat_live_delivery_proof:
        description: Three busy sends and ten continuously visible replies within two seconds
        required: false
        default: false
        type: boolean
      chat_accepted_proof:
        description: Check queued message pixels within one second of acceptance
        required: false
        default: false
        type: boolean
      chat_shape_baseline:
        description: Record the known v0.28.946 stale-reply regression without claiming product acceptance
        required: false
        default: false
        type: boolean
      chat_shape_proof:
        description: Use anonymous audit-size chats with strict switch and ordinary CPU evidence
        required: false
        default: false
        type: boolean
      chat_switch_profile:
        description: Record a separate Windows CPU trace of the slowest measured shape route
        required: false
        default: false
        type: boolean
      remote_switch_proof:
        description: Measure 20 local and second-host long-history switches, CPU and native paint gaps
        required: false
        default: false
        type: boolean
      hax_sessions_proof:
        description: Verify native hax messages and close intent across host refresh
        required: false
        default: false
        type: boolean
      remote_sync_proof:
        description: Follow the second host and alternate home through two turns and a new session
        required: false
        default: false
        type: boolean
      chat_skills_proof:
        description: Check fresh skill discovery and stable selection through chat-delivery
        required: false
        default: false
        type: boolean
      chat_retention_proof:
        description: Retain 2000 messages through 200 arrivals and source resets
        required: false
        default: false
        type: boolean
      missing_note_proof:
        description: Open a tab with no transcript and require the plain not-available note, never terminal text
        required: false
        default: false
        type: boolean
      chat_resync_proof:
        description: Reload stale messages and waiting labels without losing drafts or resending
        required: false
        default: false
        type: boolean
      chat_notes_proof:
        description: Match Android runner-note rows with native expand and fold clicks
        required: false
        default: false
        type: boolean
      chat_reactions_proof:
        description: Right-click reactions, transport, same-target restart and fallback
        required: false
        default: false
        type: boolean
      chat_reply_proof:
        description: Compact quoted replies and a native jump to the highlighted source
        required: false
        default: false
        type: boolean
      chat_width_proof:
        description: Capture wide and narrow message geometry with the chat-messages-only journey
        required: false
        default: false
        type: boolean
      long_chat_proof:
        description: Sustain long-chat delivery for thirty minutes on a release
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      chat_reactions_proof:
        required: false
        default: false
        type: boolean
      chat_shape_baseline:
        required: false
        default: false
        type: boolean
      chat_shape_proof:
        required: false
        default: false
        type: boolean
      chat_switch_profile:
        required: false
        default: false
        type: boolean
      long_chat_proof:
        required: false
        default: false
        type: boolean
      hax_sessions_proof:
        required: false
        default: false
        type: boolean
      chat_notes_proof:
        required: false
        default: false
        type: boolean
      feature:
        required: true
        type: string
      tag:
        required: false
        type: string
      chat_width_proof:
        required: false
        default: false
        type: boolean
      chat_retention_proof:
        required: false
        default: false
        type: boolean
      chat_reply_proof:
        required: false
        default: false
        type: boolean
      chat_reply_baseline:
        required: false
        default: false
        type: boolean
  pull_request:
    paths:
      - '**'
      - build.zig
      - build.zig.zon
      - .claude/skills/verify-multiprompt/**
      - .github/workflows/verify.yml
      - .github/workflows/auto-revert-master.yml
      - .github/required-checks.txt
      - tools/auto-revert-master.js
      - tools/auto-revert-master.test.js
      - tools/verify-multiprompt.test.js
      - tools/verify-features.cjs
      - tools/test-workflow-structure.test.mjs
      - tools/chat-history-reader-test.py
      - tools/check-red-run.mjs
      - tools/verify-workflow-branches.mjs
      - tools/chat-sync-audit.py
      - tools/chat-sync-audit.test.py
      - tools/chat-focus.test.js
      - tools/chat-dictation.test.js
      - tools/fixtures/IGSH-812/**
      - tools/fixtures/IGSH-1040/**
      - tools/chat-view-everywhere.test.js
      - tools/chat-view-everywhere-policy.test.js
      - tools/verify-chat-delivery.test.js
      - tools/verify-chat-delivery/**
      - tools/chat-local-agent.c
      - tools/chat-messages-only-proof.mjs
      - tools/chat-messages-only-proof.test.mjs
      - tools/chat-messages-only-proof.test.js
      - tools/chat-unread-divider.test.js
      - tools/chat-code-font-proof.mjs
      - tools/chat-code-font-proof.test.js
      - tools/chat-composer-text-proof.mjs
      - tools/chat-composer-text-proof.test.js
      - tools/start-maximized.test.js
      - tools/verify-scratch.test.ps1
      - tools/favorites-groups.test.js
      - src/**
      - tools/check-browser-pane-stuck.mjs
      - tools/check-browser-pane-locked.test.js
      - tools/check-workspace-focus.mjs
      - tools/pane-spacing.test.js
      - tools/browser-switch-speed.test.js
      - tools/chat-shape-switch.test.js
      - tools/frozen-wake.test.js
      - tools/browser-own-profile.test.js
      - tools/screenshot-upload-receiver.mjs
      - tools/screenshot-upload-receiver.test.js

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ inputs.chat_reply_proof && format('-reply-{0}', inputs.tag || 'candidate') || '' }}${{ github.event_name == 'workflow_dispatch' && format('-{0}-{1}', inputs.feature, inputs.tag) || '' }}${{ inputs.feature && github.event_name == 'push' && format('-gate-{0}', github.sha) || '' }}${{ github.run_attempt != '1' && format('-rerun-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  journeys:
    if: inputs.feature != 'chat-sync-audit'
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.features.outputs.full }}
      pr: ${{ steps.features.outputs.pr }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Check feature discovery contracts
        run: node --test tools/verify-multiprompt.test.js
      - id: features
        run: node tools/verify-features.cjs
  reopen-board-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: node --test tools/auto-revert-board.test.js tools/auto-revert-master.test.js
  chat-sync-audit-changes:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: diff
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          changed=$(git diff --name-only "$BASE...$HEAD" -- tools/chat-sync-audit.py tools/chat-sync-audit.test.py)
          if [ -n "$changed" ]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
  chat-sync-audit:
    needs: chat-sync-audit-changes
    if: inputs.feature == 'chat-sync-audit' || (github.event_name == 'pull_request' && needs.chat-sync-audit-changes.outputs.changed == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Zig 0.16.0
        run: |
          curl -fsSL https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz -o "$RUNNER_TEMP/zig.tar.xz"
          echo "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  $RUNNER_TEMP/zig.tar.xz" | sha256sum -c -
          tar -xf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"
      - name: Build the real audit renderer
        run: zig build chat-audit
      - name: Record renderer file evidence
        run: |
          mkdir -p evidence
          file zig-out/bin/chat-audit | tee evidence/renderer-file.txt
      - name: Upload Linux audit renderer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chat-audit-linux
          path: zig-out/bin/chat-audit
          retention-days: 30
          if-no-files-found: error
      - name: Verify synthetic audit fixtures
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/revision.txt
          set -o pipefail
          python3 tools/chat-sync-audit.test.py -v 2>&1 | tee evidence/fixtures.log
      - name: Upload audit verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verify-chat-sync-audit
          path: evidence/
          if-no-files-found: error
  verify:
    needs: journeys
    if: inputs.feature != 'chat-sync-audit'
    runs-on: windows-latest
    name: ${{ inputs.feature == 'title-bar' && format('verify ({0}, {1}, {2})', matrix.feature, matrix.caption-dpi, matrix.caption-browser-theme) || inputs.feature == 'window-controls' && format('verify ({0}, {1})', matrix.feature, matrix.caption-dpi) || format('verify ({0})', matrix.feature) }}
    timeout-minutes: ${{ inputs.long_chat_proof && 50 || matrix.feature == 'pane-layout' && 60 || matrix.feature == 'chat-switch-speed' && 60 || matrix.feature == 'browser-switch-speed' && 60 || 30 }}
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        feature: ${{ github.event_name == 'push' && github.ref == 'refs/heads/ceo/IGSH-1053-hax11' && fromJSON('["chat-delivery"]') || github.event_name == 'push' && github.ref == 'refs/heads/ceo/IGSH-1055-hax2' && fromJSON('["browser-pane-stuck","chat-messages-only"]') || github.event_name == 'push' && github.ref == 'refs/heads/ceo/IGSH-1079' && fromJSON(format('["{0}"]', 'appearance')) || github.event_name == 'push' && github.ref == 'refs/heads/ceo/IGSH-1083' && fromJSON(format('["{0}"]', 'appearance')) || github.event_name == 'push' && github.ref == 'refs/heads/ceo/IGSH-1061-recovery' && fromJSON(format('["{0}"]', 'browser-pane-stuck')) || github.event_name == 'push' && startsWith(github.ref, 'refs/heads/ceo/IGSH-1072') && fromJSON(format('["{0}"]', 'chat-dictation')) || inputs.feature && github.event_name == 'push' && fromJSON(format('["{0}"]', inputs.feature)) || !inputs.chat_reply_proof && !inputs.chat_notes_proof && !inputs.chat_retention_proof && !inputs.hax_sessions_proof && github.event_name == 'pull_request' && fromJSON(needs.journeys.outputs.pr) || (github.event_name == 'push' || inputs.feature == 'all') && fromJSON(needs.journeys.outputs.full) || fromJSON(format('["{0}"]', inputs.feature)) }}
        app-revision: ${{ github.event_name == 'push' && github.ref == 'refs/heads/ceo/IGSH-1055-hax2' && fromJSON(format('["5d2a820355969173090f0fcd0c72a7b3bd222141","{0}"]', github.sha)) || fromJSON('[""]') }}
        caption-dpi: ${{ inputs.feature == 'title-bar' && fromJSON('[96,120,144]') || inputs.feature == 'window-controls' && fromJSON('[96,120,144]') || fromJSON('[96]') }}
        caption-browser-theme: ${{ inputs.feature == 'title-bar' && fromJSON('["light","dark"]') || fromJSON('["light"]') }}
    env:
      CAPTION_DPI: ${{ matrix.caption-dpi }}
      CAPTION_BROWSER_THEME: ${{ matrix.caption-browser-theme }}
      CHAT_ACCEPTED_PROOF: ${{ inputs.chat_accepted_proof && '1' || '' }}
      CHAT_SENDING_PROOF: ${{ inputs.sending_status_proof && '1' || '' }}
      CHAT_LIVE_DELIVERY_PROOF: ${{ inputs.chat_live_delivery_proof && '1' || '' }}
      CHAT_SKILLS_PROOF: ${{ inputs.chat_skills_proof && '1' || '' }}
      CHAT_REACTIONS_PROOF: ${{ inputs.chat_reactions_proof && '1' || '' }}
      CHAT_RESYNC_PROOF: ${{ (inputs.chat_resync_proof || (github.event_name == 'push' && github.ref == 'refs/heads/ceo/IGSH-1053-hax11')) && '1' || '' }}
      CHAT_NOTES_PROOF: ${{ inputs.chat_notes_proof && '1' || '' }}
      CHAT_REPLY_PROOF: ${{ inputs.chat_reply_proof && '1' || '' }}
      CHAT_REPLY_BASELINE: ${{ inputs.chat_reply_baseline && '1' || '' }}
      CHAT_WIDTH_PROOF: ${{ inputs.chat_width_proof && '1' || '' }}
      CHAT_SWITCH_PROOF: ${{ inputs.remote_switch_proof && '1' || '' }}
      CHAT_SHAPE_BASELINE: ${{ inputs.chat_shape_baseline && '1' || '' }}
      CHAT_SHAPE_PROOF: ${{ inputs.chat_shape_proof && '1' || '' }}
      CHAT_SWITCH_PROFILE: ${{ inputs.chat_switch_profile && '1' || '' }}
      CHAT_HAX_PROOF: ${{ inputs.hax_sessions_proof && '1' || '' }}
      CHAT_REMOTE_PROOF: ${{ inputs.remote_sync_proof && '1' || '' }}
      CHAT_MISSING_PROOF: ${{ inputs.missing_note_proof && '1' || '' }}
      CHAT_LONG_PROOF: ${{ inputs.long_chat_proof && '1' || '' }}
      CHAT_RETENTION_PROOF: ${{ inputs.chat_retention_proof && '1' || '' }}
      VERIFY_DICTATION_STALL: ${{ inputs.dictation_stall && '1' || '' }}
      USAGE_PACE_PROOF: ${{ inputs.usage_pace_proof && '1' || '' }}
      USAGE_PACE_STATUS: ${{ inputs.usage_pace_status || '' }}
      VERIFY_APP_REVISION: ${{ matrix.app-revision }}
      FEATURE: ${{ matrix.feature }}
      RELEASE_TAG: ${{ inputs.tag || '' }}
    steps:
      - name: Keep LF line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check verification contracts
        run: node --test --test-concurrency=1 tools/verify-multiprompt.test.js tools/chat-shape-switch.test.js tools/chat-width-proof.test.mjs tools/title-bar.test.js tools/window-controls.test.js tools/chat-view-everywhere.test.js tools/chat-focus.test.js tools/chat-dictation.test.js tools/grok-chat.test.js tools/chat-view-everywhere-policy.test.js tools/verify-chat-delivery.test.js tools/favorites-groups.test.js tools/check-browser-pane-locked.test.js tools/start-maximized.test.js tools/browser-switch-speed.test.js tools/frozen-wake.test.js tools/browser-pane-hibernation.test.js tools/browser-own-profile.test.js tools/screenshot-upload-receiver.test.js tools/chat-code-font-proof.test.js tools/chat-composer-text-proof.test.js tools/chat-messages-only-proof.test.mjs tools/chat-messages-only-proof.test.js tools/chat-history-retention-proof.test.mjs tools/chat-retention-arrival-order.test.js tools/capture-usage-pace.test.js
      - name: Check remote sync proof oracle
        run: node --test tools/chat-remote-sync-proof.test.mjs tools/remote-switch-proof.test.mjs tools/chat-missing-note-proof.test.mjs
      - name: Check accepted message pixel oracle
        run: node --test tools/chat-accepted-proof.test.mjs tools/chat-reactions-proof.test.mjs
      - name: Check inline working pixel oracle
        run: node --test tools/chat-working-proof.test.mjs
      - name: Check unread divider contracts
        run: node --test tools/chat-unread-divider.test.js tools/chat-sending-status-proof.test.mjs tools/chat-delivery-live-proof.test.mjs
      - name: Check workspace focus journey contract
        run: node tools/check-workspace-focus.mjs
      - name: Check browser recovery journey contract
        run: node tools/check-browser-pane-stuck.mjs
      - name: Check runner-note pixel oracle
        if: env.CHAT_NOTES_PROOF == '1'
        run: node --test tools/chat-notes-proof.test.mjs
      - name: Validate journey and syntax
        shell: powershell
        env:
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          $ErrorActionPreference = 'Stop'
          node tools/verify-features.cjs $env:FEATURE
          if ($LASTEXITCODE -ne 0) { throw 'Unsupported desktop journey' }
          if ($env:FEATURE -eq 'appearance' -and $env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF -eq 'refs/heads/master' -and $env:HEAD_COMMIT_MESSAGE.Split([char]10)[0].Contains('IGSH-837 red proof') -and -not $env:HEAD_COMMIT_MESSAGE.StartsWith('Revert')) { throw 'IGSH-837 deliberate red master proof' }
          if ($env:FEATURE -eq 'chat-dictation' -and $env:RELEASE_TAG) { throw 'Chat dictation requires the branch offline fixture boundary' }
          if ($env:CHAT_SHAPE_PROOF -eq '1' -and $env:FEATURE -ne 'chat-switch-speed') { throw 'Shape proof requires chat-switch-speed' }
          if ($env:CHAT_SWITCH_PROFILE -eq '1' -and $env:CHAT_SHAPE_PROOF -ne '1') { throw 'Switch profile requires shape proof' }
          if ($env:FEATURE -in @('browser-emulation', 'browser-switch-speed', 'chat-switch-speed', 'title-bar') -and $env:RELEASE_TAG) {
            if ($env:FEATURE -ne 'chat-switch-speed' -or $env:CHAT_SHAPE_PROOF -ne '1' -or $env:RELEASE_TAG -ne 'v0.28.946') { throw 'Browser emulation requires a branch build with matching extension and bridge' }
          }
          if ($env:RELEASE_TAG -and $env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw 'Expected a version tag' }
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$pwd/.claude/skills/verify-multiprompt/control.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { throw ($errors | Out-String) }
          New-Item -ItemType Directory -Force evidence | Out-Null
          & tools/split-feature-controls.ps1 -Path "$pwd/.claude/skills/verify-multiprompt/control.ps1" -Output "$pwd/evidence/control-ast.json"
          if ($env:FEATURE -eq 'chat-options') {
            [System.Management.Automation.Language.Parser]::ParseFile("$pwd/.claude/skills/verify-multiprompt/chat-options.ps1", [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw ($errors | Out-String) }
          }
          if ($env:FEATURE -eq 'chat-skill-pill') {
            [System.Management.Automation.Language.Parser]::ParseFile("$pwd/.claude/skills/verify-multiprompt/chat-skill-pill.ps1", [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw ($errors | Out-String) }
          }
          if ($env:FEATURE -eq 'window-controls') {
            [System.Management.Automation.Language.Parser]::ParseFile("$pwd/.claude/skills/verify-multiprompt/window-controls.ps1", [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw ($errors | Out-String) }
          }
          if ($env:FEATURE -eq 'title-bar') {
            [System.Management.Automation.Language.Parser]::ParseFile("$pwd/.claude/skills/verify-multiprompt/title-bar.ps1", [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw ($errors | Out-String) }
          }
          if ($env:FEATURE -in @('chat-delivery', 'chat-messages-only', 'chat-full-history')) {
            [System.Management.Automation.Language.Parser]::ParseFile("$pwd/tools/verify-chat-delivery/drive.ps1", [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw ($errors | Out-String) }
          }
      - name: Install Zig 0.16.0
        if: env.RELEASE_TAG == '' || env.FEATURE == 'chat-delivery' || env.FEATURE == 'composer-buttons' || env.FEATURE == 'chat-working' || env.FEATURE == 'chat-view' || env.FEATURE == 'chat-messages-only' || env.FEATURE == 'chat-full-history' || env.FEATURE == 'tmux-binding' || env.CHAT_SHAPE_PROOF == '1' || env.FEATURE == 'chat-options' || env.USAGE_PACE_PROOF == '1'
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP/zig.zip"
          Invoke-WebRequest https://ziglang.org/download/0.16.0/zig-x86_64-windows-0.16.0.zip -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne '68659eb5f1e4eb1437a722f1dd889c5a322c9954607f5edcf337bc3684a75a7e') { throw 'Zig checksum mismatch' }
          Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP
          "$env:RUNNER_TEMP/zig-x86_64-windows-0.16.0" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: Test maximized startup decision
        if: env.FEATURE == 'appearance' && env.RELEASE_TAG == ''
        run: zig test src/launch_plan.zig --test-filter IGSH-587
      - name: Prepare job-only signed local release
        if: env.FEATURE == 'safe-updates'
        shell: powershell
        run: |
          if ($env:RELEASE_TAG) { throw 'safe-updates requires the branch verifier built with the job-only public key' }
          & tools/update-release-fixtures.ps1 -Root "$env:RUNNER_TEMP/update-release-fixtures"
      - name: Check out the independent application revision
        if: matrix.app-revision != ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ matrix.app-revision }}
          path: app-source
          persist-credentials: false
          fetch-depth: 0
      - name: Identify branch executable
        if: env.RELEASE_TAG == ''
        shell: pwsh
        run: |
          $revision = (git rev-parse HEAD).Trim()
          if ($env:VERIFY_APP_REVISION) { $revision = (git -C app-source rev-parse HEAD).Trim() }
          $tag = if ($env:VERIFY_APP_REVISION) { (git -C app-source describe --tags --match 'v[0-9]*' --abbrev=0 HEAD).Trim() } else { (git describe --tags --match 'v[0-9]*' --abbrev=0 HEAD).Trim() }
          if ($LASTEXITCODE -ne 0 -or $tag -notmatch '^v(\d+\.\d+\.\d+)$') { throw 'Reachable release version not found' }
