        shell: pwsh
        run: |
          npm install --prefix "$env:RUNNER_TEMP/browser-verify" puppeteer@24.31.0
          if ($LASTEXITCODE -ne 0) { throw 'Chrome for Testing install failed' }
          "VERIFY_BROWSER_MODULE=$env:RUNNER_TEMP/browser-verify" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Verify real native browser journey
        if: env.FEATURE == 'browser-emulation' || env.FEATURE == 'browser-switch-speed' || env.FEATURE == 'chat-switch-speed' || env.FEATURE == 'browser-own-profile' || env.FEATURE == 'title-bar'
        shell: powershell
        run: |
          & .claude/skills/verify-multiprompt/control.ps1 -Feature $env:FEATURE -Exe "$pwd/verify-bin/multiprompt.exe" -ExpectedVersion $env:VERIFY_VERSION -ExpectedHash $env:VERIFY_SHA256 -Evidence "$pwd/evidence"
      - name: Check real-shape observations after owned cleanup
        if: always() && env.CHAT_SHAPE_PROOF == '1'
        run: |
          $baseline = @()
          if ($env:CHAT_SHAPE_BASELINE -eq '1') {
            if ($env:RELEASE_TAG -ne 'v0.28.946') { throw 'Baseline recording requires published v0.28.946' }
            $baseline = @('--expect-regression')
          }
          python tools/verify-chat-delivery/chat-switch-evidence.py evidence/shape-switch.json --require-cleanup @baseline
          if ($LASTEXITCODE -ne 0) { throw 'Real-shape evidence or cleanup did not satisfy the recorded contract' }
      - name: Retain pre-launch failure result
        if: always()
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force evidence | Out-Null
          if ($env:FEATURE -eq 'safe-updates' -and (Test-Path evidence/safe-updates.json)) {
            $proof = Get-Content evidence/safe-updates.json -Raw | ConvertFrom-Json
            @{ feature = 'safe-updates'; version = $env:VERIFY_VERSION; sha256 = $env:VERIFY_SHA256; status = $(if ($proof.success) { 'passed' } else { 'failed' }); checks = $proof.checks; cleanup = $proof.cleanup } | ConvertTo-Json -Depth 6 | Set-Content -Encoding UTF8 evidence/result.json
          }
          if (-not (Test-Path evidence/result.json)) {
            $failure = @{ feature = $env:FEATURE; version = $env:VERIFY_VERSION; sha256 = $env:VERIFY_SHA256; status = 'failed'; error = 'Workflow failed before the harness produced a result; inspect the job log'; cleanup = 'Harness result unavailable; disposable runner teardown is the final cleanup boundary' }
            if ($env:FEATURE -eq 'chat-delivery') {
              $failure.agentBoundary = 'stand-in remote shell + fake tmux + scripted agent screen, not real Claude or a real server'
              $failure.cases = @('busy-send', 'idle-suggestion', 'steer-chord', 'wrapped-leftover', 'queue-draft-sync', 'send-stays-gone') | ForEach-Object { @{name=$_; passed=$false; detail='Workflow failed before journey launch'} }
            }
            $failure | ConvertTo-Json -Depth 6 | Set-Content -Encoding UTF8 evidence/result.json
          }
      - name: Upload durable verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verify-${{ env.FEATURE }}${{ matrix.app-revision && format('-{0}', matrix.app-revision) || '' }}${{ inputs.chat_reply_proof && format('-reply-{0}', inputs.chat_reply_baseline && 'baseline' || 'candidate') || '' }}${{ (env.FEATURE == 'title-bar' || env.FEATURE == 'window-controls') && format('-{0}-{1}', env.CAPTION_DPI, env.CAPTION_BROWSER_THEME) || '' }}
          path: evidence/
          if-no-files-found: error
  tmux-identity-semantics:
    if: inputs.feature == 'tmux-binding'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verify-tmux-binding
          path: binding-evidence
      - name: Install isolated tmux proof dependency
        run: sudo apt-get update -qq && sudo apt-get install -y tmux
      - name: Prove the exact Windows-generated command against real tmux
        run: python3 tools/tmux-generation-proof.py binding-evidence/binding-commands.jsonl
