name: Verify desktop
run-name: verify ${{ inputs.feature || 'appearance' }} ${{ inputs.tag || github.head_ref || github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      feature:
        description: Feature map file stem in .claude/skills/verify-multiprompt/features
        required: true
        default: appearance
        type: string
      tag:
        description: Optional release tag instead of building this branch
        required: false
        type: string
  pull_request:
    paths:
      - .claude/skills/verify-multiprompt/**
      - .github/workflows/verify.yml
      - tools/verify-multiprompt.test.js
      - tools/chat-focus.test.js
      - tools/chat-view-everywhere.test.js
      - tools/chat-view-everywhere-policy.test.js
      - tools/verify-chat-delivery.test.js
      - tools/verify-chat-delivery/**
      - tools/chat-local-agent.c
      - tools/chat-code-font-proof.mjs
      - tools/chat-code-font-proof.test.js
      - tools/start-maximized.test.js
      - tools/verify-scratch.test.ps1
      - tools/favorites-groups.test.js
      - src/**
      - tools/check-browser-pane-stuck.mjs
      - tools/check-browser-pane-locked.test.js
      - tools/check-workspace-focus.mjs
      - tools/pane-spacing.test.js
      - tools/browser-switch-speed.test.js
      - tools/frozen-wake.test.js
      - tools/browser-own-profile.test.js

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && format('-{0}-{1}', inputs.feature, inputs.tag) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  chat-sync-audit:
    if: inputs.feature == 'chat-sync-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Zig 0.16.0
        run: |
          curl -fsSL https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz -o "$RUNNER_TEMP/zig.tar.xz"
          echo "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  $RUNNER_TEMP/zig.tar.xz" | sha256sum -c -
          tar -xf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"
      - name: Build the real audit renderer
        run: zig build chat-audit
      - name: Record renderer file evidence
        run: |
          mkdir -p evidence
          file zig-out/bin/chat-audit | tee evidence/renderer-file.txt
      - name: Upload Linux audit renderer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chat-audit-linux
          path: zig-out/bin/chat-audit
          retention-days: 30
          if-no-files-found: error
      - name: Verify synthetic audit fixtures
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/revision.txt
          set -o pipefail
          python3 tools/chat-sync-audit.test.py -v 2>&1 | tee evidence/fixtures.log
      - name: Upload audit verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verify-chat-sync-audit
          path: evidence/
          if-no-files-found: error
  verify:
    if: inputs.feature != 'chat-sync-audit'
    runs-on: windows-latest
    timeout-minutes: ${{ matrix.feature == 'browser-switch-speed' && 60 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        feature: ${{ github.event_name == 'pull_request' && fromJSON('["appearance", "session-restore", "workspace-focus", "favorites-groups", "browser-pane-stuck", "browser-pane-locked", "group-rail", "pane-layout", "chat-view", "chat-view-everywhere", "chat-focus", "browser-own-profile", "status-card", "palette-order", "remind-me"]') || fromJSON(format('["{0}"]', inputs.feature)) }}
    env:
      FEATURE: ${{ matrix.feature }}
      RELEASE_TAG: ${{ inputs.tag || '' }}
    steps:
      - name: Keep LF line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check verification contracts
        run: node --test tools/verify-multiprompt.test.js tools/chat-view-everywhere.test.js tools/chat-focus.test.js tools/chat-view-everywhere-policy.test.js tools/verify-chat-delivery.test.js tools/favorites-groups.test.js tools/check-browser-pane-locked.test.js tools/start-maximized.test.js tools/browser-switch-speed.test.js tools/frozen-wake.test.js tools/browser-pane-hibernation.test.js tools/browser-own-profile.test.js tools/chat-code-font-proof.test.js
      - name: Check workspace focus journey contract
        run: node tools/check-workspace-focus.mjs
      - name: Check browser recovery journey contract
        run: node tools/check-browser-pane-stuck.mjs
      - name: Validate journey and syntax
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:FEATURE -notin @('appearance', 'sessions', 'session-restore', 'workspaces', 'workspace-focus', 'inbox', 'command-palette', 'session-open', 'favorites-groups', 'browser-switch-speed', 'browser-pane-stuck', 'browser-pane-locked', 'group-rail', 'pane-layout', 'chat-tables', 'chat-code-font', 'safe-updates', 'chat-view', 'chat-view-everywhere', 'chat-focus', 'chat-delivery', 'browser-emulation', 'status-card', 'palette-order', 'browser-own-profile', 'remind-me')) { throw 'Unknown feature map' }
          if ($env:FEATURE -in @('browser-emulation', 'browser-switch-speed') -and $env:RELEASE_TAG) { throw 'Browser emulation requires a branch build with matching extension and bridge' }
          if ($env:RELEASE_TAG -and $env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw 'Expected a version tag' }
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$pwd/.claude/skills/verify-multiprompt/control.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { throw ($errors | Out-String) }
          if ($env:FEATURE -eq 'chat-delivery') {
            [System.Management.Automation.Language.Parser]::ParseFile("$pwd/tools/verify-chat-delivery/drive.ps1", [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw ($errors | Out-String) }
          }
      - name: Install Zig 0.16.0
        if: env.RELEASE_TAG == '' || env.FEATURE == 'chat-delivery' || env.FEATURE == 'chat-view'
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP/zig.zip"
          Invoke-WebRequest https://ziglang.org/download/0.16.0/zig-x86_64-windows-0.16.0.zip -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne '68659eb5f1e4eb1437a722f1dd889c5a322c9954607f5edcf337bc3684a75a7e') { throw 'Zig checksum mismatch' }
          Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP
          "$env:RUNNER_TEMP/zig-x86_64-windows-0.16.0" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: Test maximized startup decision
        if: env.FEATURE == 'appearance' && env.RELEASE_TAG == ''
        run: zig test src/launch_plan.zig --test-filter IGSH-587
      - name: Prepare job-only signed local release
        if: env.FEATURE == 'safe-updates'
        shell: powershell
        run: |
          if ($env:RELEASE_TAG) { throw 'safe-updates requires the branch verifier built with the job-only public key' }
          & tools/update-release-fixtures.ps1 -Root "$env:RUNNER_TEMP/update-release-fixtures"
      - name: Build branch executable
        if: env.RELEASE_TAG == ''
        run: zig build -Drelease=${{ env.FEATURE == 'safe-updates' }}
      - name: Resolve real executable
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force verify-bin, evidence | Out-Null
          $revision = (git rev-parse HEAD).Trim()
          if ($env:RELEASE_TAG) {
            gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --dir verify-bin --pattern multiprompt-x64.exe --pattern zigshell-bridge-x64.exe --pattern SHA256SUMS.txt
            if ($LASTEXITCODE -ne 0) { throw 'Release download failed' }
            foreach ($asset in @('multiprompt', 'zigshell-bridge')) {
              $checks = @(Get-Content verify-bin/SHA256SUMS.txt | Where-Object { $_ -match ('^[a-fA-F0-9]{64} [ *]' + $asset + '-x64\.exe$') })
              if ($checks.Count -ne 1) { throw "Expected exactly one x64 checksum for $asset" }
              $expected = ($checks[0] -split '\s+')[0].ToLowerInvariant()
              if ((Get-FileHash "verify-bin/$asset-x64.exe" -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw "Release checksum mismatch for $asset" }
              Move-Item "verify-bin/$asset-x64.exe" "verify-bin/$asset.exe"
            }
            $version = $env:RELEASE_TAG.Substring(1)
          } else {
            Copy-Item zig-out/bin/multiprompt.exe verify-bin/multiprompt.exe
            Copy-Item zig-out/bin/zigshell-bridge.exe verify-bin/zigshell-bridge.exe
            $source = Get-Content src/main.zig -Raw
            if ($source -notmatch 'pub const APP_VERSION = "([^"]+)"') { throw 'Version not found' }
            $version = $Matches[1]
          }
          $hash = (Get-FileHash verify-bin/multiprompt.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          @{ revision = $revision; tag = $env:RELEASE_TAG; version = $version; sha256 = $hash; run = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID" } | ConvertTo-Json | Set-Content evidence/build.json
          "VERIFY_VERSION=$version" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "VERIFY_SHA256=$hash" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        if: env.FEATURE == 'chat-delivery'
        with:
          python-version: '3.12'
      - name: Compile chat delivery remote-shell boundary
        if: env.FEATURE == 'chat-delivery'
        shell: pwsh
        run: |
          zig cc -target x86_64-windows-gnu -municode -O2 tools/verify-chat-delivery/launcher.c -o verify-bin/ssh.exe
          if ($LASTEXITCODE -ne 0) { throw 'Chat delivery boundary compile failed' }
          zig cc -target x86_64-windows-gnu -municode -mwindows -O2 tools/verify-chat-delivery/launcher.c -o verify-bin/tmux.exe
          if ($LASTEXITCODE -ne 0) { throw 'Fake tmux compile failed' }
      - name: Build local Claude console stand-in
        if: env.FEATURE == 'chat-view'
        run: |
          zig cc -target x86_64-windows-gnu -O2 tools/chat-local-agent.c -o verify-bin/claude.exe
          if ($LASTEXITCODE -ne 0) { throw 'Local Claude console stand-in build failed' }
      - name: Render received Markdown with the real Windows painter
        if: (env.FEATURE == 'chat-view' || env.FEATURE == 'chat-view-everywhere') && env.RELEASE_TAG == ''
        shell: powershell
        env:
          MULTIPROMPT_CHAT_RENDER_PROOF: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.Drawing
          foreach ($mode in @('1', '0')) {
            $env:IGSH_610 = $mode
            Remove-Item chat-markdown-proof.bmp, chat-markdown-proof.json -ErrorAction SilentlyContinue
            zig build test-main -Drender-proof=true --summary all
            if ($LASTEXITCODE -ne 0) { throw 'Native desktop rendering tests failed' }
            $imagePath = if ($mode -eq '1') { "$pwd/evidence/chat-markdown-render.png" } else { "$pwd/evidence/chat-markdown-render-gdi.png" }
            $metadataPath = if ($mode -eq '1') { 'evidence/chat-render-dwrite.json' } else { 'evidence/chat-render-gdi.json' }
            $image = [Drawing.Bitmap]::FromFile("$pwd/chat-markdown-proof.bmp")
            try { $image.Save($imagePath, [Drawing.Imaging.ImageFormat]::Png) } finally { $image.Dispose() }
            Copy-Item chat-markdown-proof.json $metadataPath
          }
          Remove-Item Env:IGSH_610
          node tools/chat-render-reference.mjs evidence
          if ($LASTEXITCODE -ne 0) { throw 'Chrome reference or repaint evidence failed' }
          foreach ($file in @('chat-markdown-render.png', 'chat-markdown-render-gdi.png', 'chrome-reference.png', 'repaint-ms.json')) {
            if (-not (Test-Path "evidence/$file")) { throw "Missing rendering evidence: $file" }
          }
      - name: Render Chat View code and diff rows with the real Windows painter
        if: env.FEATURE == 'chat-code-font' && env.RELEASE_TAG == ''
        shell: powershell
        env:
          MULTIPROMPT_CHAT_RENDER_PROOF: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($mode in @('1', '0')) {
            $env:IGSH_610 = $mode
            Remove-Item chat-code-proof.bmp, chat-code-proof.json -ErrorAction SilentlyContinue
            zig build test-main -Drender-proof=true --summary all
            if ($LASTEXITCODE -ne 0) { throw 'Native desktop rendering tests failed' }
            $suffix = if ($mode -eq '1') { 'dwrite' } else { 'gdi' }
            Copy-Item chat-code-proof.bmp "evidence/chat-code-proof-$suffix.bmp"
            Copy-Item chat-code-proof.json "evidence/chat-code-proof-$suffix.json"
          }
          Remove-Item Env:IGSH_610
          node tools/chat-code-font-proof.mjs evidence
          if ($LASTEXITCODE -ne 0) { throw 'IGSH-678 painter proof evaluation crashed' }
      - name: Launch Doctor Drive Evidence Cleanup
        if: env.FEATURE != 'browser-emulation' && env.FEATURE != 'browser-switch-speed' && env.FEATURE != 'browser-own-profile'
        shell: powershell
        run: |
          & .claude/skills/verify-multiprompt/control.ps1 -Feature $env:FEATURE -Exe "$pwd/verify-bin/multiprompt.exe" -ExpectedVersion $env:VERIFY_VERSION -ExpectedHash $env:VERIFY_SHA256 -Evidence "$pwd/evidence"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: env.FEATURE == 'browser-emulation' || env.FEATURE == 'browser-switch-speed' || env.FEATURE == 'browser-own-profile'
        with:
          node-version: 22
      - name: Install isolated Chrome for Testing driver
        if: env.FEATURE == 'browser-emulation' || env.FEATURE == 'browser-switch-speed' || env.FEATURE == 'browser-own-profile'
        shell: pwsh
        run: |
          npm install --prefix "$env:RUNNER_TEMP/browser-verify" puppeteer@24.31.0
          if ($LASTEXITCODE -ne 0) { throw 'Chrome for Testing install failed' }
          "VERIFY_BROWSER_MODULE=$env:RUNNER_TEMP/browser-verify" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Verify real native browser journey
        if: env.FEATURE == 'browser-emulation' || env.FEATURE == 'browser-switch-speed' || env.FEATURE == 'browser-own-profile'
        shell: powershell
        run: |
          & .claude/skills/verify-multiprompt/control.ps1 -Feature $env:FEATURE -Exe "$pwd/verify-bin/multiprompt.exe" -ExpectedVersion $env:VERIFY_VERSION -ExpectedHash $env:VERIFY_SHA256 -Evidence "$pwd/evidence"
      - name: Retain pre-launch failure result
        if: always()
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force evidence | Out-Null
          if ($env:FEATURE -eq 'safe-updates' -and (Test-Path evidence/safe-updates.json)) {
            $proof = Get-Content evidence/safe-updates.json -Raw | ConvertFrom-Json
            @{ feature = 'safe-updates'; status = $(if ($proof.success) { 'passed' } else { 'failed' }); checks = $proof.checks; cleanup = $proof.cleanup } | ConvertTo-Json -Depth 6 | Set-Content -Encoding UTF8 evidence/result.json
          }
          if (-not (Test-Path evidence/result.json)) {
            $failure = @{ feature = $env:FEATURE; status = 'failed'; error = 'Workflow failed before the harness produced a result; inspect the job log'; cleanup = 'Harness result unavailable; disposable runner teardown is the final cleanup boundary' }
            if ($env:FEATURE -eq 'chat-delivery') {
              $failure.agentBoundary = 'stand-in remote shell + fake tmux + scripted agent screen, not real Claude or a real server'
              $failure.cases = @('busy-send', 'idle-suggestion', 'steer-chord', 'wrapped-leftover', 'queue-draft-sync') | ForEach-Object { @{name=$_; passed=$false; detail='Workflow failed before journey launch'} }
            }
            $failure | ConvertTo-Json -Depth 6 | Set-Content -Encoding UTF8 evidence/result.json
          }
      - name: Upload durable verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verify-${{ env.FEATURE }}
          path: evidence/
          if-no-files-found: error
  probe-chrome-pipe:
    if: inputs.feature == 'probe-chrome-pipe'
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install Zig 0.16.0
        run: |
          $zip = "$env:RUNNER_TEMP/zig.zip"
          Invoke-WebRequest https://ziglang.org/download/0.16.0/zig-x86_64-windows-0.16.0.zip -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne '68659eb5f1e4eb1437a722f1dd889c5a322c9954607f5edcf337bc3684a75a7e') { throw 'Zig checksum mismatch' }
          Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP
          "$env:RUNNER_TEMP/zig-x86_64-windows-0.16.0" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: Install Chrome for Testing
        run: npm install --prefix "$env:RUNNER_TEMP/browser-verify" puppeteer@24.31.0
      - name: Build bridge
        run: zig build -Dtarget=x86_64-windows-gnu -Drelease=true --summary all
      - name: Probe Chrome profiles
        run: |
          $ErrorActionPreference = 'Continue'
          $branded = 'C:\Program Files\Google\Chrome\Application\chrome.exe'
          $cft = Get-ChildItem "$env:USERPROFILE\.cache\puppeteer\chrome" -Recurse -Filter chrome.exe | Select-Object -First 1
          $ext = (Resolve-Path 'extension').Path
          $theme = Join-Path $ext 'themes\dark'
          $bridge = (Resolve-Path 'zig-out\bin\zigshell-bridge.exe').Path
          $logPath = Join-Path $env:APPDATA 'ZigShell\bridge-launch.log'
          $root = Join-Path $env:RUNNER_TEMP 'probe'
          $results = [System.Collections.Generic.List[string]]::new()
          Write-Output "BRANDED exe=$branded version=$([System.Diagnostics.FileVersionInfo]::GetVersionInfo($branded).FileVersion)"
          Write-Output "CFT exe=$($cft.FullName) folder=$($cft.Directory.Parent.Name) version=$($cft.VersionInfo.FileVersion)"
          Write-Output "EXTENSION $ext"
          Write-Output "THEME $theme"
          Write-Output "BRIDGE $bridge"

          function Invoke-Probe([string]$scenario, [string]$chrome, [string]$profile, [switch]$seed) {
            Write-Output "SCENARIO $scenario exe=$chrome profile=$profile"
            Remove-Item $logPath -Force -ErrorAction SilentlyContinue
            $launcher = $null
            try {
              $arguments = 'chrome-launch "{0}" "{1}" "{2}" "--user-data-dir={3}" "--no-first-run" "--no-default-browser-check" "--new-window" "data:text/html,<title>PROBE</title>"' -f $chrome, $ext, $theme, $profile
              $launcher = Start-Process -FilePath $bridge -ArgumentList $arguments -PassThru
              Start-Sleep -Seconds 25
              $log = if (Test-Path $logPath) { Get-Content $logPath -Raw } else { '' }
              Write-Output "BRIDGE-LOG-BEGIN $scenario"
              Write-Output $log
              Write-Output "BRIDGE-LOG-END $scenario"
              $replies = [regex]::Matches($log, '(?m)^CDP reply id=').Count
              $loaded = if ($log -match '(?m)^extension loaded\r?$') { 'yes' } else { 'no' }
              $preferences = Join-Path $profile 'Default\Secure Preferences'
              $mentionsExtension = $false
              if (Test-Path $preferences) {
                $preferencesText = (Get-Content $preferences -Raw).Replace('\\', '\')
                $mentionsExtension = $preferencesText.IndexOf($ext, [System.StringComparison]::OrdinalIgnoreCase) -ge 0
              }
              Write-Output "SECURE-PREFERENCES $scenario exists=$(Test-Path $preferences) mentions-extension=$mentionsExtension"
              $pipes = @([System.IO.Directory]::GetFiles('\\.\pipe\') | Where-Object { $_ -like '\\.\pipe\multiprompt-browser-isolated-own-*' })
              Write-Output "ISOLATED-PIPES $scenario exists=$($pipes.Count -gt 0) count=$($pipes.Count)"
              $pipes | Write-Output
              $result = "PROBE $scenario replies=$replies loaded=$loaded"
              Write-Output $result
              if (-not $seed) { $results.Add($result) }
            } catch {
              Write-Output "PROBE-ERROR $scenario $_"
              $result = "PROBE $scenario replies=0 loaded=no"
              Write-Output $result
              if (-not $seed) { $results.Add($result) }
            } finally {
              $processes = @(Get-Process -Name chrome -ErrorAction SilentlyContinue)
              $processes | Stop-Process -Force -ErrorAction SilentlyContinue
              foreach ($process in $processes) {
                try { $process.WaitForExit() } catch { Write-Output "CHROME-EXIT $scenario $_" }
              }
              if ($launcher -and -not $launcher.WaitForExit(5000)) {
                $launcher | Stop-Process -Force -ErrorAction SilentlyContinue
                $launcher.WaitForExit()
              }
            }
          }

          Get-Process -Name chrome -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Invoke-Probe 'branded-cold' $branded (Join-Path $root 'branded-cold')
          Invoke-Probe 'cft-migration-seed' $cft.FullName (Join-Path $root 'migrated') -seed
          Invoke-Probe 'cft-then-branded' $branded (Join-Path $root 'migrated')
          Invoke-Probe 'branded-second-launch' $branded (Join-Path $root 'branded-cold')
          Invoke-Probe 'cft-only' $cft.FullName (Join-Path $root 'cft')
          Write-Output 'PROBE SUMMARY'
          $results | Write-Output
          exit 0
