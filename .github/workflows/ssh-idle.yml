name: Verify idle SSH reuse
on:
  workflow_dispatch:
    inputs:
      app_revision:
        description: Optional baseline app revision with this same counting harness
        required: false
        type: string
  push:
    branches: ['mubo-532-ssh-idle*']
permissions:
  contents: read
concurrency:
  group: ssh-idle-${{ github.ref }}-${{ inputs.app_revision || 'candidate' }}
  cancel-in-progress: true
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: ./.github/actions/setup-zig
      - run: node --test tools/shared-helper-channels.test.js tools/chat-transport.test.js tools/chat-transport-writer.test.js tools/token-ladder-panel.test.js
      - run: node tools/check-timer-ratchet.mjs
      - run: node tools/strip-comments.mjs --check
      - run: node tools/check-file-size.mjs
      - run: node tools/check-journey-evidence.mjs
  server-chat:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      SSH_IDLE_PROOF: '1'
      APP_REVISION: ${{ inputs.app_revision || github.sha }}
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: ./.github/actions/setup-zig
      - uses: Vampire/setup-wsl@887f39deb6c0976365e546926fe66f41b77d65ff
        with:
          distribution: Ubuntu-24.04
          wsl-version: '2'
          additional-packages: openssh-server tmux python3
      - uses: ./.github/actions/install-ffmpeg
        with:
          version: '7.1.1'
      - name: Build app and transparent SSH counter
        shell: pwsh
        run: |
          $version = ((git describe --tags --match 'v[0-9]*' --abbrev=0 $env:APP_REVISION).Trim()).Substring(1)
          $revision = (git rev-parse $env:APP_REVISION).Trim()
          git worktree add --detach app-source $revision
          if ($LASTEXITCODE -ne 0) { throw 'App checkout failed' }
          Push-Location app-source
          try {
            zig build -Dtarget=x86_64-windows-gnu -Dversion="$version" -Drevision="$revision"
            if ($LASTEXITCODE -ne 0) { throw 'App build failed' }
          } finally { Pop-Location }
          New-Item -ItemType Directory -Force zig-out/bin | Out-Null
          Copy-Item app-source/zig-out/bin/* zig-out/bin/
          zig cc -target x86_64-windows-gnu -municode -O2 tools/verify-server-chat/count-ssh.c -o zig-out/bin/count-ssh.exe
          if ($LASTEXITCODE -ne 0) { throw 'Counter build failed' }
          New-Item -ItemType Directory -Force evidence | Out-Null
          $hash = (Get-FileHash zig-out/bin/multiprompt.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          @{ revision=$revision; harness_revision=(git rev-parse HEAD).Trim(); version=$version; sha256=$hash; run="$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID" } | ConvertTo-Json | Set-Content evidence/build.json
          "VERIFY_VERSION=$version" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "VERIFY_SHA256=$hash" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Reconnect state and probe regression tests
        run: node --test --test-concurrency=1 tools/ssh-reconnect.test.js tools/ssh-probe-511.test.js tools/ssh-clock-standby.test.js
      - name: Server chat, idle login bound, dropped link and idle again
        shell: powershell
        run: ./.claude/skills/verify-multiprompt/drive.ps1 -Feature server-chat -Exe "$PWD/zig-out/bin/multiprompt.exe" -ExpectedVersion $env:VERIFY_VERSION -ExpectedHash $env:VERIFY_SHA256 -Evidence "$PWD/evidence"
      - name: Check receipts, video, login counts and cleanup
        run: node tools/verify-server-chat/check-evidence.cjs evidence
      - name: Preserve the before or after recording
        if: always()
        shell: pwsh
        env:
          VIDEO_LABEL: ${{ inputs.app_revision && 'before' || 'after' }}
        run: |
          if (Test-Path evidence/journey.mp4) { Copy-Item evidence/journey.mp4 "evidence/$env:VIDEO_LABEL.mp4" }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ssh-idle-${{ github.sha }}
          path: evidence
          if-no-files-found: error
          retention-days: 7
