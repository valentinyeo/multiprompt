name: Reaction reply journey

on:
  workflow_dispatch:
  schedule:
    - cron: '48 3 * * *'

permissions:
  contents: read

concurrency:
  group: reaction-journey-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  reactions:
    uses: ./.github/workflows/verify.yml
    with:
      feature: chat-delivery
      chat_reactions_proof: true
