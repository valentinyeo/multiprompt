name: Rooms regression

on:
  pull_request:
    paths:
      - '.github/workflows/rooms-design-a.yml'
      - '.claude/skills/verify-multiprompt/rooms*'
      - '.claude/skills/verify-multiprompt/features/rooms.md'
      - 'src/room*'
      - 'tools/room-input-focus.test.js'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  master:
    uses: ./.github/workflows/verify.yml
    with:
      feature: rooms
      revision: ${{ github.event.pull_request.head.sha }}
      app_revision: ${{ github.event.pull_request.base.sha }}
  candidate:
    uses: ./.github/workflows/verify.yml
    with:
      feature: rooms
      revision: ${{ github.event.pull_request.head.sha }}
