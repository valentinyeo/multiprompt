name: Chat stillness

on:
  pull_request:
    paths:
      - 'src/chat*'
      - 'src/app_state.zig'
      - 'src/main.zig'
      - 'src/layout.zig'
      - 'tools/chat-still/**'
      - 'tools/verify-chat-still'
      - 'tools/pr-verifier*'
      - '.claude/skills/verify-multiprompt/**'
      - '.github/workflows/chat-still.yml'
  workflow_dispatch:
    inputs:
      comment_review:
        description: Run pstack no-comments before the independent verifier
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: chat-still-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  formal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install the replay compiler
        run: |
          curl -fsSL https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz -o "$RUNNER_TEMP/zig.tar.xz"
          echo "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  $RUNNER_TEMP/zig.tar.xz" | sha256sum -c -
          tar -xf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"
      - name: Check every geometry and replay every counterexample
        run: bash tools/verify-chat-still --self-test --replay --output evidence/formal.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: chat-still-formal
          path: evidence/
          if-no-files-found: error
  desktop:
    uses: ./.github/workflows/verify.yml
    with:
      revision: ${{ github.event.pull_request.head.sha || github.sha }}
      feature: chat-still
  comment-review:
    if: always() && github.event_name == 'workflow_dispatch' && inputs.comment_review
    needs: [formal, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: cursor/plugins
          ref: bf0c7cd80abdbf7fe47b634978a7d1b4071f71a7
          path: pstack
          persist-credentials: false
      - name: Register the pinned pstack adapter
        run: |
          mkdir -p pstack/pstack/.claude-plugin
          cp pstack/pstack/plugin.json pstack/pstack/.claude-plugin/plugin.json
      - name: Run pstack no-comments
        uses: anthropics/claude-code-action@f3b070c88125d33dbae5653df5f143101d4ea9dc
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            Follow pstack/pstack/skills/no-comments/SKILL.md in full, including spawning Comment Sicko.
            Scope is the diff origin/master...HEAD, not the checked-out pstack plugin.
            This is a report-only check. Do not edit application code or commit.
            Report deletion candidates, MUST KILL flags, suppressions, and constraint keeps with evidence.
            No findings is valid. The author will apply accepted findings before the independent pstack-verifier.
          claude_args: |
            --model sonnet
            --plugin-dir pstack/pstack
            --max-turns 25
            --allowedTools "Read,Glob,Grep,Task,Agent,Skill,Bash(git diff:*),Bash(git show:*),Bash(git log:*)"
