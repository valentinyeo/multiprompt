name: PR verifier infrastructure recovery

on:
  workflow_run:
    workflows: [PR verifier]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: pr-verifier-recovery-${{ github.event.workflow_run.display_title || github.ref }}
  cancel-in-progress: true

jobs:
  blocked:
    concurrency:
      group: pstack-verdict-${{ github.event.workflow_run.display_title }}
      cancel-in-progress: false
    if: github.event.workflow_run.conclusion != 'success' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Report BLOCKED when the verifier could not publish a verdict
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: node tools/pr-verifier.cjs recover
