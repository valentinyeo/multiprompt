name: Speed proof
run-name: speed proof ${{ github.run_id }} ${{ github.ref_name }}
on:
  workflow_dispatch:
    inputs:
      only:
        description: live, stream, both, smoke, card, bare, chat or all
        default: live
        required: false
  push:
    branches:
      - proof/mubo-speed-verify
      - proof/mubo-idle-live
      - proof/mubo-idle-stream
permissions:
  contents: read
concurrency:
  group: speed-proof-${{ github.run_id }}
  cancel-in-progress: false
env:
  BEFORE_TAG: v0.28.1683
  AFTER_TAG: v0.28.1953
jobs:
  live-smoke:
    name: live chat idle smoke
    if: github.event_name == 'push' || inputs.only == 'smoke' || inputs.only == 'all'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Keep LF line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Download both released binaries
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/mubo-speed/download-releases.ps1 -Tags @($env:BEFORE_TAG, $env:AFTER_TAG)
      - name: Build the boundary launcher
        shell: pwsh
        run: ./tools/mubo-speed/build-launcher.ps1
      - name: Measure a short live idle window
        shell: pwsh
        run: |
          foreach ($scenario in @('live', 'stream')) {
            foreach ($tag in @($env:BEFORE_TAG, $env:AFTER_TAG)) {
              ./tools/mubo-speed/idle-log-cpu.ps1 -Exe "bin/$tag/multiprompt-x64.exe" -Evidence "evidence/$scenario/$tag" -Tag $tag -Scenario $scenario -SshPath harness/ssh.exe -IdleSeconds 120 -SettleSeconds 30
              Write-Host "$tag $scenario smoke exit $LASTEXITCODE"
              if ($LASTEXITCODE -ne 0) { throw "The $scenario fixture never reached a live idle window for $tag" }
            }
          }
      - name: Summarise
        if: always()
        shell: pwsh
        run: |
          node tools/mubo-speed/summarize.mjs evidence
          if (Test-Path evidence/summary.md) { Get-Content evidence/summary.md -Raw | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: speed-proof-live-smoke-${{ github.run_id }}
          path: evidence
          if-no-files-found: error
          retention-days: 14
  idle-live:
    name: live chat idle window, round ${{ matrix.round }}
    if: inputs.only == 'live' || inputs.only == 'both' || inputs.only == 'all'
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        round: [1, 2, 3]
    steps:
      - name: Keep LF line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Download both released binaries
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/mubo-speed/download-releases.ps1 -Tags @($env:BEFORE_TAG, $env:AFTER_TAG)
      - name: Build the boundary launcher
        shell: pwsh
        run: ./tools/mubo-speed/build-launcher.ps1
      - name: Measure one live idle window per release, alternating the order
        shell: pwsh
        env:
          ROUND: ${{ matrix.round }}
        run: |
          $order = if ([int]$env:ROUND % 2 -eq 1) { @($env:BEFORE_TAG, $env:AFTER_TAG) } else { @($env:AFTER_TAG, $env:BEFORE_TAG) }
          foreach ($tag in $order) {
            ./tools/mubo-speed/idle-log-cpu.ps1 -Exe "bin/$tag/multiprompt-x64.exe" -Evidence "evidence/round-$($env:ROUND)/$tag" -Tag $tag -Scenario live -SshPath harness/ssh.exe -IdleSeconds 600 -SettleSeconds 60
            Write-Host "$tag round $($env:ROUND) live idle exit $LASTEXITCODE"
          }
          exit 0
      - name: Summarise this round
        if: always()
        shell: pwsh
        run: |
          node tools/mubo-speed/summarize.mjs evidence
          if (Test-Path evidence/summary.md) { Get-Content evidence/summary.md -Raw | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: speed-proof-live-${{ github.run_id }}-${{ matrix.round }}
          path: evidence
          if-no-files-found: error
          retention-days: 14
  idle-stream:
    name: streaming reply idle window, round ${{ matrix.round }}
    if: inputs.only == 'stream' || inputs.only == 'both' || inputs.only == 'all'
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        round: [1, 2, 3, 4, 5]
    steps:
      - name: Keep LF line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Download both released binaries
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/mubo-speed/download-releases.ps1 -Tags @($env:BEFORE_TAG, $env:AFTER_TAG)
      - name: Build the boundary launcher
        shell: pwsh
        run: ./tools/mubo-speed/build-launcher.ps1
      - name: Measure one streaming idle window per release, alternating the order
        shell: pwsh
        env:
          ROUND: ${{ matrix.round }}
        run: |
          $order = if ([int]$env:ROUND % 2 -eq 1) { @($env:BEFORE_TAG, $env:AFTER_TAG) } else { @($env:AFTER_TAG, $env:BEFORE_TAG) }
          foreach ($tag in $order) {
            ./tools/mubo-speed/idle-log-cpu.ps1 -Exe "bin/$tag/multiprompt-x64.exe" -Evidence "evidence/round-$($env:ROUND)/$tag" -Tag $tag -Scenario stream -SshPath harness/ssh.exe -IdleSeconds 600 -SettleSeconds 60
            Write-Host "$tag round $($env:ROUND) stream idle exit $LASTEXITCODE"
          }
          exit 0
      - name: Summarise this round
        if: always()
        shell: pwsh
        run: |
          node tools/mubo-speed/summarize.mjs evidence
          if (Test-Path evidence/summary.md) { Get-Content evidence/summary.md -Raw | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: speed-proof-live-${{ github.run_id }}-stream-${{ matrix.round }}
          path: evidence
          if-no-files-found: error
          retention-days: 14
  live-report:
    name: MUBO-17 live idle verdict
    needs: [idle-live, idle-stream]
    if: always() && (needs.idle-live.result != 'skipped' || needs.idle-stream.result != 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: speed-proof-live-${{ github.run_id }}-*
          path: evidence
      - name: Show the downloaded evidence
        run: find evidence -name 'idle.json' | sort
      - name: Verdict against the one megabyte per hour bar
        run: |
          set +e
          node tools/mubo-speed/live-verdict.mjs evidence evidence/report.txt
          code=$?
          cat evidence/report.txt >> "$GITHUB_STEP_SUMMARY"
          exit $code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: speed-proof-live-report-${{ github.run_id }}
          path: evidence/report.txt
          if-no-files-found: warn
          retention-days: 30
  card:
    name: usage card open time
    if: inputs.only == 'card' || inputs.only == 'all'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Keep LF line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Reject PowerShell host name collisions
        shell: pwsh
        run: ./tools/check-powershell-host-names.ps1
      - name: Download both released binaries
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/mubo-speed/download-releases.ps1 -Tags @($env:BEFORE_TAG, $env:AFTER_TAG)
      - name: Measure card open time
        shell: pwsh
        run: |
          $rounds = @(
            @($env:BEFORE_TAG, $env:AFTER_TAG),
            @($env:AFTER_TAG, $env:BEFORE_TAG)
          )
          $index = 0
          foreach ($round in $rounds) {
            $index++
            foreach ($tag in $round) {
              ./tools/mubo-speed/card-open-timing.ps1 -Exe "bin/$tag/multiprompt-x64.exe" -Evidence "evidence/$tag/round-$index" -Tag $tag -Samples 7
              Write-Host "$tag round $index card exit $LASTEXITCODE"
            }
          }
          exit 0
      - name: Summarise
        if: always()
        shell: pwsh
        run: |
          node tools/mubo-speed/summarize.mjs evidence
          if (Test-Path evidence/summary.md) { Get-Content evidence/summary.md -Raw | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: speed-proof-card-${{ github.run_id }}
          path: evidence
          if-no-files-found: error
          retention-days: 14
  idle-bare:
    name: idle log and CPU, no chat open
    if: inputs.only == 'bare' || inputs.only == 'all'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      SCENARIO: bare
    steps:
      - name: Keep LF line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Reject PowerShell host name collisions
        shell: pwsh
        run: ./tools/check-powershell-host-names.ps1
      - name: Download both released binaries
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/mubo-speed/download-releases.ps1 -Tags @($env:BEFORE_TAG, $env:AFTER_TAG)
      - name: Measure idle log and CPU
        shell: pwsh
        run: |
          foreach ($tag in @($env:BEFORE_TAG, $env:AFTER_TAG)) {
            ./tools/mubo-speed/idle-log-cpu.ps1 -Exe "bin/$tag/multiprompt-x64.exe" -Evidence "evidence/$tag" -Tag $tag -Scenario $env:SCENARIO -IdleSeconds 660
            Write-Host "$tag idle exit $LASTEXITCODE"
          }
          exit 0
      - name: Summarise
        if: always()
        shell: pwsh
        run: |
          node tools/mubo-speed/summarize.mjs evidence
          if (Test-Path evidence/summary.md) { Get-Content evidence/summary.md -Raw | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: speed-proof-idle-bare-${{ github.run_id }}
          path: evidence
          if-no-files-found: error
          retention-days: 14
  idle-chat:
    name: idle log and CPU, chat view open
    if: inputs.only == 'chat' || inputs.only == 'all'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      SCENARIO: chat
    steps:
      - name: Keep LF line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Reject PowerShell host name collisions
        shell: pwsh
        run: ./tools/check-powershell-host-names.ps1
      - name: Download both released binaries
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/mubo-speed/download-releases.ps1 -Tags @($env:BEFORE_TAG, $env:AFTER_TAG)
      - name: Measure idle log and CPU
        shell: pwsh
        run: |
          foreach ($tag in @($env:BEFORE_TAG, $env:AFTER_TAG)) {
            ./tools/mubo-speed/idle-log-cpu.ps1 -Exe "bin/$tag/multiprompt-x64.exe" -Evidence "evidence/$tag" -Tag $tag -Scenario $env:SCENARIO -IdleSeconds 660
            Write-Host "$tag idle exit $LASTEXITCODE"
          }
          exit 0
      - name: Summarise
        if: always()
        shell: pwsh
        run: |
          node tools/mubo-speed/summarize.mjs evidence
          if (Test-Path evidence/summary.md) { Get-Content evidence/summary.md -Raw | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: speed-proof-idle-chat-${{ github.run_id }}
          path: evidence
          if-no-files-found: error
          retention-days: 14
