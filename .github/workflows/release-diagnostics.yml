name: Release diagnostics
on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'
permissions:
  contents: read
jobs:
  publication-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: node --test tools/release-version.test.mjs tools/version-stamp.test.mjs tools/release-update-gate.test.mjs
  journeys:
    uses: ./.github/workflows/verify.yml
    with:
      feature: all
  runner-sessions:
    uses: ./.github/workflows/verify.yml
    with:
      feature: chat-delivery
      hax_sessions_proof: true
