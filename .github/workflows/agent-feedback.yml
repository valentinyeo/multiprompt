name: Agent feedback

on:
  pull_request:
    paths:
      - 'src/multibot_feedback.py'
      - 'tools/multibot-feedback-proof.py'
      - 'tools/multibot-feedback-test.py'
      - '.claude/skills/verify-multiprompt/features/agent-feedback.md'
      - '.github/workflows/agent-feedback.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-feedback-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  feedback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Run the wish tool against a fake board
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/input"
          set +e
          python3 tools/multibot-feedback-test.py -v > "$RUNNER_TEMP/input/head.log" 2>&1
          echo "head=$?" >> "$GITHUB_ENV"
          true
      - name: Write the receipt
        shell: bash
        run: |
          set +e
          node tools/ci-receipt-summary.mjs "$RUNNER_TEMP/receipt" feedback "$RUNNER_TEMP/input/head.log" "$head" '^(Ran [0-9]+ tests|test_(?:existing_wish_with_any_ticket_prefix_is_reused|description_shape_keeps_long_text_inside_quote_blocks|description_leaves_fix_to_be_written|session_token_file_is_used_when_ht_token_is_unset|drain_drops_queue_rows_saved_before_the_cutoff))'
          echo "receipt=$?" >> "$GITHUB_ENV"
          true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: agent-feedback
          path: ${{ runner.temp }}/receipt/
          if-no-files-found: error
      - name: Fail when the wish cases or the receipt failed
        run: test "$head" = 0 && test "$receipt" = 0
