name: PR verifier tools

on:
  pull_request:
    paths:
      - 'tools/pr-verifier.cjs'
      - 'tools/pr-verifier*.test.js'
      - 'tools/ci-receipt-summary.mjs'
      - '.claude/skills/verify-multiprompt/features/pr-verifier-tools.md'
      - '.github/workflows/pr-verifier-tools.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-verifier-tools-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Run every PR verifier test
        id: run
        shell: bash
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/receipt-input"
          node --test --test-reporter=tap tools/pr-verifier*.test.js > "$RUNNER_TEMP/receipt-input/pr-verifier-tools.log" 2>&1
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: Write the receipt
        if: always()
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node tools/ci-receipt-summary.mjs "$RUNNER_TEMP/receipt-input/pr-verifier-tools.log" "$RUNNER_TEMP/pr-verifier-tools" "${{ steps.run.outputs.code || 1 }}" '^(ok|not ok) [0-9]+ - (a cancelled run queues|an active latest-head run|recovery never restarts)|^# (pass|fail) '
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pr-verifier-tools
          path: ${{ runner.temp }}/pr-verifier-tools/
          if-no-files-found: error
