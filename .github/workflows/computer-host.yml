name: Computer host
on:
  workflow_call:
    inputs:
      revision:
        required: false
        type: string

permissions:
  contents: read

jobs:
  host:
    name: disposable linux desktop host
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - name: Run the disposable desktop host behind the free tunnels
        id: host
        timeout-minutes: 42
        run: bash tools/verify-computer/host.sh "$RUNNER_TEMP/computer-host" "$GITHUB_OUTPUT"
      - name: Report the host identity
        if: always()
        run: |
          echo "host ready=${{ steps.host.outputs.host_ready }} port=${{ steps.host.outputs.host_port }} user=${{ steps.host.outputs.host_user }}"
