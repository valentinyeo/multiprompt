name: Shared chat style

on:
  workflow_dispatch:
  pull_request:
    paths:
      - src/message_menu.zig
      - tools/chat-shared-style.test.js
      - tools/chat-reactions-proof.mjs
      - tools/chat-reactions-proof.test.mjs
      - tools/verify-chat-delivery/reactions.ps1
      - tools/verify-chat-delivery/desktop.cs
      - .github/workflows/chat-style.yml
  push:
    branches: [master, ceo/IGSH-1019]
    paths:
      - src/message_menu.zig
      - tools/chat-shared-style.test.js
      - tools/chat-reactions-proof.mjs
      - tools/verify-chat-delivery/reactions.ps1
      - tools/verify-chat-delivery/desktop.cs
      - .github/workflows/chat-style.yml
  release:
    types: [published]

permissions:
  contents: read
  actions: read

concurrency:
  group: shared-chat-style-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  reactions:
    uses: ./.github/workflows/verify.yml
    with:
      feature: chat-delivery
      tag: ${{ github.event.release.tag_name || '' }}
      chat_reactions_proof: true
