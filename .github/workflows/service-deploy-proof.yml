name: Service deploy proof

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: service-deploy-proof
  cancel-in-progress: true

env:
  PROOF_WORKER: multibot-cloud-proof
  PROOF_DATABASE: multibot-cloud-proof

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: service-proof
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: service/package-lock.json
      - name: Write the Wrangler JSON reader
        run: |
          cat > "$RUNNER_TEMP/wrangler-json.mjs" <<'READER'
          import { readFileSync } from 'node:fs';

          function parse(text) {
            const trimmed = text.trim();
            if (!trimmed) return null;
            try {
              return JSON.parse(trimmed);
            } catch {}
            for (let start = 0; start < trimmed.length; start += 1) {
              const closer = trimmed[start] === '[' ? ']' : trimmed[start] === '{' ? '}' : null;
              if (!closer) continue;
              let from = trimmed.length;
              while (from > start) {
                const end = trimmed.lastIndexOf(closer, from - 1);
                if (end <= start) break;
                try {
                  return JSON.parse(trimmed.slice(start, end + 1));
                } catch {}
                from = end;
              }
            }
            return null;
          }

          const mode = process.argv[2];
          const data = parse(readFileSync(0, 'utf8'));
          if (data === null) {
            console.error('wrangler printed no readable JSON');
            process.exit(1);
          }

          if (mode === 'database-id') {
            const rows = Array.isArray(data) ? data : (data.result ?? data.results ?? []);
            const row = rows.find((entry) => entry && entry.name === process.argv[3]);
            if (row) process.stdout.write(String(row.uuid ?? row.id ?? ''));
          } else if (mode === 'table-count') {
            const rows = Array.isArray(data) ? data : [data];
            const result = rows.find((entry) => entry && Array.isArray(entry.results));
            const value = result?.results?.[0]?.tables;
            if (typeof value !== 'number') {
              console.error('no table count in the query result');
              process.exit(1);
            }
            process.stdout.write(String(value));
          } else {
            console.error(`unknown mode ${mode}`);
            process.exit(1);
          }
          READER
      - name: Install the service dependencies
        working-directory: service
        run: npm ci --no-audit --no-fund --prefer-offline
      - name: Find or create the proof D1 database
        working-directory: service
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          list_id() {
            npx wrangler d1 list --json | node "$RUNNER_TEMP/wrangler-json.mjs" database-id "$PROOF_DATABASE"
          }
          id="$(list_id)"
          if [ -z "$id" ]; then
            npx wrangler d1 create "$PROOF_DATABASE" > "$RUNNER_TEMP/d1-create.log"
            cat "$RUNNER_TEMP/d1-create.log"
            id="$(list_id)"
          fi
          if [ -z "$id" ]; then
            id="$(grep -v 'preview_database_id' "$RUNNER_TEMP/d1-create.log" | sed -n 's/.*database_id[[:space:]]*=[[:space:]]*"\([0-9a-f-]\{36\}\)".*/\1/p' | head -1)"
          fi
          test -n "$id"
          echo "PROOF_DATABASE_ID=$id" >> "$GITHUB_ENV"
          echo "PROOF_AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "proof database $PROOF_DATABASE is $id" >> "$GITHUB_STEP_SUMMARY"
      - name: Build the proof config from wrangler.jsonc
        working-directory: service
        run: |
          set -euo pipefail
          node -e 'const fs=require("node:fs");const config=JSON.parse(fs.readFileSync("wrangler.jsonc","utf8"));config.name=process.env.PROOF_WORKER;const db=config.d1_databases[0];db.database_name=process.env.PROOF_DATABASE;db.database_id=process.env.PROOF_DATABASE_ID;config.vars.BETTER_AUTH_SECRET=process.env.PROOF_AUTH_SECRET;fs.writeFileSync("wrangler.proof.jsonc",JSON.stringify(config,null,2))'
      - name: Apply the migrations and deploy the Worker
        working-directory: service
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler d1 migrations apply DB --remote --config wrangler.proof.jsonc
          npx wrangler deploy --config wrangler.proof.jsonc | tee "$RUNNER_TEMP/deploy.log"
      - name: Read the deployed URL
        id: url
        run: |
          set -euo pipefail
          url="$(grep -oE 'https://[A-Za-z0-9._-]+\.workers\.dev' "$RUNNER_TEMP/deploy.log" | head -1)"
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed $url" >> "$GITHUB_STEP_SUMMARY"
          echo "$url"
      - name: Smoke-check the deployment
        env:
          URL: ${{ steps.url.outputs.url }}
        run: |
          set -euo pipefail
          code=""
          for attempt in $(seq 1 24); do
            code="$(curl -sS -o "$RUNNER_TEMP/health.json" -w '%{http_code}' "$URL/health" || true)"
            if [ "$code" = 200 ]; then break; fi
            sleep 5
          done
          test "$code" = 200
          grep -q 'multiprompt-account' "$RUNNER_TEMP/health.json"
          page="$(curl -sS -o "$RUNNER_TEMP/signin.html" -w '%{http_code}' "$URL/signin")"
          test "$page" = 200
          grep -q 'data-page="signin"' "$RUNNER_TEMP/signin.html"
          auth="$(curl -sS -o /dev/null -w '%{http_code}' "$URL/api/auth/ok" || true)"
          {
            echo "health: 200 $URL/health"
            echo "sign-in page: 200 $URL/signin"
            echo "auth endpoint: $auth $URL/api/auth/ok"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Confirm the schema landed in the proof database
        working-directory: service
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          tables="$(npx wrangler d1 execute DB --remote --json --config wrangler.proof.jsonc --command "SELECT count(*) AS tables FROM sqlite_master WHERE type='table' AND name IN ('devices','layouts','bot_photos')" | node "$RUNNER_TEMP/wrangler-json.mjs" table-count)"
          echo "schema tables: $tables" >> "$GITHUB_STEP_SUMMARY"
          test "$tables" = 3
