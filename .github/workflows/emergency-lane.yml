name: Emergency lane

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited, labeled, unlabeled, closed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  emergency-lane:
    name: emergency-lane
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Test emergency lane policy
        run: node --test tools/check-emergency-lane.test.mjs tools/emergency-release-path.test.mjs
      - name: Enforce emergency lane merge order
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          PR_STATE: ${{ github.event.pull_request.state }}
        run: node tools/check-emergency-lane.mjs check

  refresh:
    if: github.event_name == 'pull_request' && contains(fromJson('["closed","labeled","unlabeled"]'), github.event.action)
    needs: emergency-lane
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Rerun emergency-lane for open pull requests after the lane clears
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_ACTION: ${{ github.event.action }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: node tools/check-emergency-lane.mjs refresh