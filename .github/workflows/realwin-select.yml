name: ISSUE-438 real Windows investigation

on:
  pull_request:

permissions:
  contents: read

jobs:
  selection:
    if: github.head_ref == 'ceo/IGSH-438-realwin'
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: master
            revision: cf4ac72ca4cc19a1b9300e4b197dd75657f685f0
          - label: release-0.28.779
            revision: 7a8704b932287b493689f7a1e175ee7f56d05f37
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: driver
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ matrix.revision }}
          path: app
      - name: Install Zig 0.16.0
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\zig.zip"
          Invoke-WebRequest https://ziglang.org/download/0.16.0/zig-x86_64-windows-0.16.0.zip -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne '68659eb5f1e4eb1437a722f1dd889c5a322c9954607f5edcf337bc3684a75a7e') { throw "zig checksum mismatch: $hash" }
          Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP
          "$env:RUNNER_TEMP\zig-x86_64-windows-0.16.0" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: Install OCR
        run: choco install tesseract --no-progress -y
      - name: Build exact source revision
        working-directory: app
        run: |
          git rev-parse HEAD
          zig build -Dtarget=x86_64-windows-gnu --summary all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise native desktop input
        shell: pwsh
        run: ./driver/tools/ISSUE-438-realwin.ps1 -SourceRoot "$PWD/app" -Output "$PWD/evidence" -Label '${{ matrix.label }}'
      - name: Request 150 percent scaling and measure effective DPI
        if: always()
        shell: pwsh
        run: |
          Set-ItemProperty 'HKCU:\Control Panel\Desktop' -Name LogPixels -Type DWord -Value 144
          Set-ItemProperty 'HKCU:\Control Panel\Desktop' -Name Win8DpiScaling -Type DWord -Value 1
          Get-ItemProperty 'HKCU:\Control Panel\Desktop' -Name LogPixels,Win8DpiScaling
          ./driver/tools/ISSUE-438-realwin.ps1 -SourceRoot "$PWD/app" -Output "$PWD/evidence/scaling-request" -Label '${{ matrix.label }}-requested150'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ISSUE-438-${{ matrix.label }}
          path: evidence
