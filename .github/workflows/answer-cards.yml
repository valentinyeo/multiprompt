name: Verify answer cards

on:
  push:
    branches: [ceo/IGSH-1047, 'ceo/IGSH-1047-release/v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Optional released version
        type: string
        default: ''

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.source.outputs.tag }}
    steps:
      - id: source
        env:
          REF_NAME: ${{ github.ref_name }}
          TAG: ${{ inputs.tag }}
        run: |
          if [[ "$REF_NAME" == ceo/IGSH-1047-release/v* ]]; then
            TAG=${REF_NAME#ceo/IGSH-1047-release/}
          fi
          if [[ -n "$TAG" && ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then exit 1; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
  native:
    needs: source
    uses: ./.github/workflows/verify.yml
    with:
      feature: chat-options
      tag: ${{ needs.source.outputs.tag }}
