name: Tests
run-name: SOFT-3163 measurement ${{ inputs.trials }} trials x ${{ inputs.samples }} samples
on:
  workflow_dispatch:
    inputs:
      samples:
        type: number
        default: 100
      trials:
        type: number
        default: 5
permissions:
  contents: read
jobs:
  pairs:
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-global-cache
      ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache
    steps:
      - name: Keep LF line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Cache Zig toolchain
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/zig-x86_64-windows-0.16.0
          key: ${{ runner.os }}-zig-toolchain-0.16.0
      - name: Install Zig 0.16.0
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:RUNNER_TEMP/zig-x86_64-windows-0.16.0/zig.exe")) {
            $zip = "$env:RUNNER_TEMP/zig.zip"
            Invoke-WebRequest https://ziglang.org/download/0.16.0/zig-x86_64-windows-0.16.0.zip -OutFile $zip
            if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne '68659eb5f1e4eb1437a722f1dd889c5a322c9954607f5edcf337bc3684a75a7e') { throw 'Zig checksum mismatch' }
            tar -xf $zip -C $env:RUNNER_TEMP
            if ($LASTEXITCODE -ne 0) { throw 'Zig extraction failed' }
          }
          "$env:RUNNER_TEMP/zig-x86_64-windows-0.16.0" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: Restore Zig build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .zig-cache
            ${{ env.ZIG_GLOBAL_CACHE_DIR }}
          key: ${{ runner.os }}-zig-0.16.0-pairs-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-zig-0.16.0-pairs-
            ${{ runner.os }}-zig-0.16.0-speed-
      - name: Validate measurement tooling
        shell: pwsh
        run: |
          $tokens = $null; $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$pwd/tools/everyday-performance.ps1", [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          [void][System.Management.Automation.Language.Parser]::ParseFile("$pwd/tools/everyday-performance-pairs.ps1", [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          node --check tools/everyday-performance-profile.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Profiler syntax failed' }
      - name: Build base and head in production configuration
        shell: pwsh
        run: |
          $base = (git rev-parse origin/master).Trim()
          $head = (git rev-parse HEAD).Trim()
          "$base`n$head" | Set-Content revisions.txt
          git switch --detach --quiet $base
          zig build -Dtarget=x86_64-windows-gnu -Drelease=true
          if ($LASTEXITCODE -ne 0) { throw 'Base release build failed; no ancestor fallback allowed' }
          zig cc -target x86_64-windows-gnu -municode -O2 tools/verify-chat-delivery/launcher.c -o zig-out/bin/ssh.exe
          if ($LASTEXITCODE -ne 0) { throw 'Base SSH fixture build failed' }
          zig cc -target x86_64-windows-gnu -municode -mwindows -O2 tools/verify-chat-delivery/launcher.c -o zig-out/bin/tmux.exe
          if ($LASTEXITCODE -ne 0) { throw 'Base tmux fixture build failed' }
          New-Item -ItemType Directory -Force base-bin | Out-Null
          Copy-Item zig-out/bin/* base-bin -Force
          @{ builtRevision=$base; sourceTree=(git rev-parse "${base}:src").Trim(); build=(git rev-parse "${base}:build.zig").Trim(); sha256=(Get-FileHash base-bin/multiprompt.exe -Algorithm SHA256).Hash } | ConvertTo-Json | Set-Content base-bin/measurement-build.json
          git switch --detach --quiet $head
          zig build -Dtarget=x86_64-windows-gnu -Drelease=true
          if ($LASTEXITCODE -ne 0) { throw 'Head release build failed; no ancestor fallback allowed' }
          zig cc -target x86_64-windows-gnu -municode -O2 tools/verify-chat-delivery/launcher.c -o zig-out/bin/ssh.exe
          if ($LASTEXITCODE -ne 0) { throw 'Head SSH fixture build failed' }
          zig cc -target x86_64-windows-gnu -municode -mwindows -O2 tools/verify-chat-delivery/launcher.c -o zig-out/bin/tmux.exe
          if ($LASTEXITCODE -ne 0) { throw 'Head tmux fixture build failed' }
          New-Item -ItemType Directory -Force head-bin | Out-Null
          Copy-Item zig-out/bin/* head-bin -Force
          @{ builtRevision=$head; sourceTree=(git rev-parse "${head}:src").Trim(); build=(git rev-parse "${head}:build.zig").Trim(); sha256=(Get-FileHash head-bin/multiprompt.exe -Algorithm SHA256).Hash } | ConvertTo-Json | Set-Content head-bin/measurement-build.json
          $built = Get-Content head-bin/measurement-build.json -Raw | ConvertFrom-Json
          if ($built.sourceTree -ne (git rev-parse "${head}:src").Trim() -or $built.build -ne (git rev-parse "${head}:build.zig").Trim()) { throw 'Head build has a different product source tree' }
      - name: Measure alternating base and head trials
        shell: powershell
        run: |
          $lines = Get-Content revisions.txt
          $env:BASE_SHA = $lines[0].Trim()
          $env:HEAD_SHA = $lines[1].Trim()
          ./tools/everyday-performance-pairs.ps1 -BaseExe base-bin/multiprompt.exe -HeadExe head-bin/multiprompt.exe -BaseRevision $env:BASE_SHA -HeadRevision $env:HEAD_SHA -Evidence evidence -Count ${{ inputs.samples }} -Trials ${{ inputs.trials }}
          if ($LASTEXITCODE -ne 0) { throw 'Paired measurement failed' }
      - name: Compare base and head
        shell: pwsh
        run: |
          python tools/everyday-performance-compare.py evidence
          if ($LASTEXITCODE -ne 0) { throw 'Comparison failed' }
          Get-Content evidence/comparison.json | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: soft-3163-pairs-${{ github.run_id }}
          path: |
            evidence
            base-bin/measurement-build.json
            head-bin/measurement-build.json
            revisions.txt
          if-no-files-found: error
          retention-days: 14
