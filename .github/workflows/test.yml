name: Tests
run-name: SOFT-3163 alternating base/head ${{ inputs.trials }} trials x ${{ inputs.samples }} samples
on:
  workflow_dispatch:
    inputs:
      samples:
        type: number
        default: 100
      trials:
        type: number
        default: 5
permissions:
  contents: read
jobs:
  pairs:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-global-cache
      ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache
    steps:
      - name: Keep LF line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Zig 0.16.0
        uses: ./.github/actions/setup-zig
      - name: Build head in production configuration
        shell: pwsh
        run: |
          zig build -Dtarget=x86_64-windows-gnu -Drelease=true
          if ($LASTEXITCODE -ne 0) { throw 'Head build failed' }
          zig cc -target x86_64-windows-gnu -municode -O2 tools/verify-chat-delivery/launcher.c -o zig-out/bin/ssh.exe
          if ($LASTEXITCODE -ne 0) { throw 'SSH fixture build failed' }
          zig cc -target x86_64-windows-gnu -municode -mwindows -O2 tools/verify-chat-delivery/launcher.c -o zig-out/bin/tmux.exe
          if ($LASTEXITCODE -ne 0) { throw 'tmux fixture build failed' }
          @{ builtRevision=(git rev-parse HEAD).Trim(); sourceTree=(git rev-parse HEAD:src).Trim(); build=(git rev-parse HEAD:build.zig).Trim(); sha256=(Get-FileHash zig-out/bin/multiprompt.exe -Algorithm SHA256).Hash } | ConvertTo-Json | Set-Content zig-out/bin/measurement-build.json
      - name: Build base in production configuration
        shell: pwsh
        run: |
          $base = (git merge-base origin/master HEAD).Trim()
          "SPEED_BASE=$base" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          git worktree add --detach base $base
          if ($LASTEXITCODE -ne 0) { throw 'Base checkout failed' }
          Push-Location base
          try {
            zig build -Dtarget=x86_64-windows-gnu -Drelease=true
            if ($LASTEXITCODE -ne 0) { throw 'Base build failed' }
            zig cc -target x86_64-windows-gnu -municode -O2 tools/verify-chat-delivery/launcher.c -o zig-out/bin/ssh.exe
            if ($LASTEXITCODE -ne 0) { throw 'Base SSH fixture build failed' }
            zig cc -target x86_64-windows-gnu -municode -mwindows -O2 tools/verify-chat-delivery/launcher.c -o zig-out/bin/tmux.exe
            if ($LASTEXITCODE -ne 0) { throw 'Base tmux fixture build failed' }
            @{ builtRevision=(git rev-parse HEAD).Trim(); sourceTree=(git rev-parse HEAD:src).Trim(); build=(git rev-parse HEAD:build.zig).Trim(); sha256=(Get-FileHash zig-out/bin/multiprompt.exe -Algorithm SHA256).Hash } | ConvertTo-Json | Set-Content zig-out/bin/measurement-build.json
          } finally { Pop-Location }
      - name: Alternate base and head over five everyday actions
        shell: powershell
        run: ./tools/everyday-performance-pairs.ps1 -BaseExe base/zig-out/bin/multiprompt.exe -HeadExe zig-out/bin/multiprompt.exe -BaseRevision "$env:SPEED_BASE" -HeadRevision "${{ github.sha }}" -Evidence evidence -Count ${{ inputs.samples }} -Trials ${{ inputs.trials }}
      - name: Compare base and head
        run: python tools/everyday-performance-compare.py evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: speed-pairs-${{ github.run_id }}
          path: evidence
          if-no-files-found: error
          retention-days: 14
