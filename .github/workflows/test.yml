          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash -e -o pipefail tools/classify-test-paths.sh
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: steps.paths.outputs.heavy == 'true'
