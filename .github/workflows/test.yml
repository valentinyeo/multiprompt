            zig-out/bin/multiprompt.exe
            zig-out/bin/update-test-key.der
          if-no-files-found: error
          retention-days: 1
          overwrite: true

      - name: Build newer native update fixture
        if: steps.paths.outputs.heavy == 'true' && matrix.arch == 'x64'
        run: zig build -Dtarget=x86_64-windows-gnu -Drelease=true -Dversion=9.99.999 --prefix "$RUNNER_TEMP/native-update" --summary all
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.paths.outputs.heavy == 'true' && matrix.arch == 'x64'
        with:
          name: native-update-x64-${{ github.run_id }}
          path: ${{ runner.temp }}/native-update/bin/multiprompt.exe
          if-no-files-found: error
          retention-days: 1


  speed-baseline:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-global-cache
      ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache
    steps:
      - name: Keep LF line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Restore Zig (PR)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .zig-cache
            ${{ env.ZIG_GLOBAL_CACHE_DIR }}
          key: ${{ runner.os }}-zig-0.16.0-speed-${{ hashFiles('build.zig', 'build.zig.zon') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-zig-0.16.0-speed-
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Reject PowerShell host name collisions
        shell: pwsh
        run: ./tools/check-powershell-host-names.ps1
      - name: Test session speed oracle
        run: node --test tools/switch-performance.test.mjs
      - name: Cache Zig toolchain
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/zig-x86_64-windows-0.16.0
          key: ${{ runner.os }}-zig-toolchain-0.16.0
      - name: Install Zig 0.16.0
        uses: ./.github/actions/setup-zig
      - name: Build baseline
        shell: pwsh
        env:
          BASE: ${{ github.event.pull_request.base.sha || (github.ref == 'refs/heads/master' && (github.event.before || format('{0}^', github.sha))) || 'origin/master' }}
        run: |
          $requested = (git merge-base $env:BASE HEAD).Trim()
          $base = $requested
          $buildError = ''
          for ($attempt = 0; $attempt -lt 12; $attempt += 1) {
            git worktree remove --force baseline 2>$null
            git worktree add --detach baseline $base
            if ($LASTEXITCODE -ne 0) { throw 'Baseline checkout failed' }
            node tools/switch-performance.mjs instrument baseline
            if ($LASTEXITCODE -ne 0) { throw 'Baseline timing instrumentation failed' }
            $log = Join-Path $env:RUNNER_TEMP "baseline-build-$attempt.log"
            Push-Location baseline
            try { zig build *> $log } finally { Pop-Location }
            if ($LASTEXITCODE -eq 0) { break }
            $firstError = Select-String -Path $log -Pattern 'error:' | Select-Object -First 1
            if ($firstError) { $buildError = $firstError.Line.Trim() }
            $parent = (git rev-parse "$base^").Trim()
            if ($LASTEXITCODE -ne 0 -or -not $parent) { throw "Baseline build failed on $base and has no ancestor left: $buildError" }
            $base = $parent
            if ($attempt -eq 11) { throw "Baseline build failed after 12 commits from ${requested}: $buildError" }
          }
          zig cc -target x86_64-windows-gnu -municode -O2 tools/verify-chat-delivery/launcher.c -o "baseline/zig-out/bin/ssh.exe"
          if ($LASTEXITCODE -ne 0) { throw 'SSH fixture build failed' }
          zig cc -target x86_64-windows-gnu -municode -mwindows -O2 tools/verify-chat-delivery/launcher.c -o "baseline/zig-out/bin/tmux.exe"
          if ($LASTEXITCODE -ne 0) { throw 'tmux fixture build failed' }
          "SPEED_BASE=$base" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "SPEED_REQUESTED_BASE=$requested" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          if ($base -ne $requested) {
            "SPEED_BASE_FALLBACK=$buildError" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          }
      - name: Record baseline commit
        shell: bash
        run: |
          mkdir -p evidence/base
          {
            printf 'requested base: %s\n' "$SPEED_REQUESTED_BASE"
            printf 'measured baseline: %s\n' "$SPEED_BASE"
            if [ -n "${SPEED_BASE_FALLBACK:-}" ]; then
              printf 'walked back because: %s\n' "$SPEED_BASE_FALLBACK"
            fi
          } > evidence/base/baseline.txt
          cat evidence/base/baseline.txt
      - name: Measure baseline session speed
        shell: powershell
        run: ./tools/switch-performance.ps1 -Exe baseline/zig-out/bin/multiprompt.exe -Evidence evidence/base -Revision "$env:SPEED_BASE"
      - name: Bound Zig cache before save
        if: always()
        shell: bash
        run: |
          du -sh .zig-cache "$ZIG_GLOBAL_CACHE_DIR"
          python3 tools/trim-zig-cache.py --cap-mib 1600
          du -sh "$ZIG_GLOBAL_CACHE_DIR"
          if [ -d .zig-cache ]; then du -sh .zig-cache; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: speed-base-${{ github.run_id }}
          path: evidence/base
          if-no-files-found: error
          retention-days: 7

  speed-candidate:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-global-cache
      ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache
    steps:
      - name: Keep LF line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Restore Zig (PR)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .zig-cache
            ${{ env.ZIG_GLOBAL_CACHE_DIR }}
          key: ${{ runner.os }}-zig-0.16.0-speed-${{ hashFiles('build.zig', 'build.zig.zon') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-zig-0.16.0-speed-
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Cache Zig toolchain
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/zig-x86_64-windows-0.16.0
          key: ${{ runner.os }}-zig-toolchain-0.16.0
      - name: Install Zig 0.16.0
        uses: ./.github/actions/setup-zig
      - name: Build candidate
        shell: pwsh
        run: |
          node tools/switch-performance.mjs instrument .
          if ($LASTEXITCODE -ne 0) { throw 'Candidate timing instrumentation failed' }
          zig build
          if ($LASTEXITCODE -ne 0) { throw 'Candidate build failed' }
          zig cc -target x86_64-windows-gnu -municode -O2 tools/verify-chat-delivery/launcher.c -o "zig-out/bin/ssh.exe"
          if ($LASTEXITCODE -ne 0) { throw 'SSH fixture build failed' }
          zig cc -target x86_64-windows-gnu -municode -mwindows -O2 tools/verify-chat-delivery/launcher.c -o "zig-out/bin/tmux.exe"
          if ($LASTEXITCODE -ne 0) { throw 'tmux fixture build failed' }
          "SPEED_HEAD=$((git rev-parse HEAD).Trim())" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Measure candidate session speed
        shell: powershell
        run: ./tools/switch-performance.ps1 -Exe zig-out/bin/multiprompt.exe -Evidence evidence/head -Revision "$env:SPEED_HEAD"
      - name: Bound Zig cache before save
        if: always()
        shell: bash
        run: |
          du -sh .zig-cache "$ZIG_GLOBAL_CACHE_DIR"
          python3 tools/trim-zig-cache.py --cap-mib 1600
          du -sh "$ZIG_GLOBAL_CACHE_DIR"
          if [ -d .zig-cache ]; then du -sh .zig-cache; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: speed-head-${{ github.run_id }}
          path: evidence/head
          if-no-files-found: error
          retention-days: 7

  switch-performance:
    needs: [speed-baseline, speed-candidate]
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: speed-base-${{ github.run_id }}
          path: evidence/base
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: speed-head-${{ github.run_id }}
          path: evidence/head
      - name: Require session speed limits
        run: node tools/switch-performance.mjs report evidence/base/samples.json evidence/head/samples.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: switch-performance-${{ github.run_id }}
          path: evidence
          if-no-files-found: error
          retention-days: 7

  test-result:
    name: test
    needs: [test, test-vps, build-windows, test-worker, test-update-source]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every test job
        env:
          WINDOWS: ${{ needs.test.result }}
          VPS: ${{ needs.test-vps.result }}
          BUILD: ${{ needs.build-windows.result }}
          WORKER: ${{ needs.test-worker.result }}
          UPDATE_SOURCE: ${{ needs.test-update-source.result }}
          EVENT: ${{ github.event_name }}
        run: |
          require_jobs() {
            for result in "$@"; do
              [ "$result" = success ] || return 1
            done
          }
          require_jobs success success success success success success success success success
          for result in failure cancelled skipped; do
            if require_jobs "$result" success success success success success success success success; then exit 1; fi
            if require_jobs success "$result" success success success success success success success; then exit 1; fi
            if require_jobs success success "$result" success success success success success success; then exit 1; fi
            if require_jobs success success success "$result" success success success success success; then exit 1; fi
            if require_jobs success success success success "$result" success success success success; then exit 1; fi
            if require_jobs success success success success success "$result" success success success; then exit 1; fi
            if require_jobs success success success success success success "$result" success success; then exit 1; fi
            if require_jobs success success success success success success success "$result" success; then exit 1; fi
            if require_jobs success success success success success success success success "$result"; then exit 1; fi
          done
          echo 'Aggregate routing controls passed'
          require_jobs "$WINDOWS" "$VPS" "$BUILD" "$WORKER" "$UPDATE_SOURCE"
