name: Tests
run-name: SOFT-3163 measurement ${{ inputs.trials }} trials x ${{ inputs.samples }} samples
on:
  workflow_dispatch:
    inputs:
      samples:
        type: number
        default: 100
      trials:
        type: number
        default: 5
permissions:
  contents: read
jobs:
  speed-baseline:
    runs-on: windows-latest
    timeout-minutes: 50
    env:
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-global-cache
      ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache
    steps:
      - name: Keep LF line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Restore Zig (PR)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .zig-cache
            ${{ env.ZIG_GLOBAL_CACHE_DIR }}
          key: ${{ runner.os }}-zig-0.16.0-speed-${{ hashFiles('build.zig', 'build.zig.zon') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-zig-0.16.0-speed-
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Cache Zig toolchain
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/zig-x86_64-windows-0.16.0
          key: ${{ runner.os }}-zig-toolchain-0.16.0
      - name: Install Zig 0.16.0
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:RUNNER_TEMP/zig-x86_64-windows-0.16.0/zig.exe")) {
            $zip = "$env:RUNNER_TEMP/zig.zip"
            Invoke-WebRequest https://ziglang.org/download/0.16.0/zig-x86_64-windows-0.16.0.zip -OutFile $zip
            if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne '68659eb5f1e4eb1437a722f1dd889c5a322c9954607f5edcf337bc3684a75a7e') { throw 'Zig checksum mismatch' }
            tar -xf $zip -C $env:RUNNER_TEMP
            if ($LASTEXITCODE -ne 0) { throw 'Zig extraction failed' }
          }
          "$env:RUNNER_TEMP/zig-x86_64-windows-0.16.0" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: Validate measurement tooling
        shell: pwsh
        run: |
          ./tools/check-powershell-host-names.ps1
          $tokens = $null; $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$pwd/tools/everyday-performance.ps1", [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          node --check tools/everyday-performance-profile.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Profiler syntax failed' }
      - name: Build exact requested revision in production configuration
        shell: pwsh
        run: |
          zig build -Dtarget=x86_64-windows-gnu -Drelease=true
          if ($LASTEXITCODE -ne 0) { throw 'Release build failed; no ancestor fallback allowed' }
          zig cc -target x86_64-windows-gnu -municode -O2 tools/verify-chat-delivery/launcher.c -o zig-out/bin/ssh.exe
          if ($LASTEXITCODE -ne 0) { throw 'SSH fixture build failed' }
          zig cc -target x86_64-windows-gnu -municode -mwindows -O2 tools/verify-chat-delivery/launcher.c -o zig-out/bin/tmux.exe
          if ($LASTEXITCODE -ne 0) { throw 'tmux fixture build failed' }
      - name: Measure five everyday desktop actions
        shell: powershell
        run: ./tools/everyday-performance.ps1 -Exe zig-out/bin/multiprompt.exe -Evidence evidence -Revision "${{ github.sha }}" -Count ${{ inputs.samples }} -Trials ${{ inputs.trials }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: speed-baseline-${{ github.run_id }}
          path: evidence
          if-no-files-found: error
          retention-days: 14
  speed-candidate:
    runs-on: windows-latest
    timeout-minutes: 50
    env:
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-global-cache
      ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache
    steps:
      - name: Keep LF line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Restore Zig (PR)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .zig-cache
            ${{ env.ZIG_GLOBAL_CACHE_DIR }}
          key: ${{ runner.os }}-zig-0.16.0-speed-${{ hashFiles('build.zig', 'build.zig.zon') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-zig-0.16.0-speed-
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Cache Zig toolchain
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/zig-x86_64-windows-0.16.0
          key: ${{ runner.os }}-zig-toolchain-0.16.0
      - name: Install Zig 0.16.0
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:RUNNER_TEMP/zig-x86_64-windows-0.16.0/zig.exe")) {
            $zip = "$env:RUNNER_TEMP/zig.zip"
            Invoke-WebRequest https://ziglang.org/download/0.16.0/zig-x86_64-windows-0.16.0.zip -OutFile $zip
            if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne '68659eb5f1e4eb1437a722f1dd889c5a322c9954607f5edcf337bc3684a75a7e') { throw 'Zig checksum mismatch' }
            tar -xf $zip -C $env:RUNNER_TEMP
            if ($LASTEXITCODE -ne 0) { throw 'Zig extraction failed' }
          }
          "$env:RUNNER_TEMP/zig-x86_64-windows-0.16.0" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: Validate measurement tooling
        shell: pwsh
        run: |
          ./tools/check-powershell-host-names.ps1
          $tokens = $null; $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$pwd/tools/everyday-performance.ps1", [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          node --check tools/everyday-performance-profile.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Profiler syntax failed' }
      - name: Instrument separate profiling replay only
        run: node tools/everyday-performance-profile.mjs .
      - name: Build exact requested revision in production configuration
        shell: pwsh
        run: |
          zig build -Dtarget=x86_64-windows-gnu -Drelease=true
          if ($LASTEXITCODE -ne 0) { throw 'Release build failed; no ancestor fallback allowed' }
          zig cc -target x86_64-windows-gnu -municode -O2 tools/verify-chat-delivery/launcher.c -o zig-out/bin/ssh.exe
          if ($LASTEXITCODE -ne 0) { throw 'SSH fixture build failed' }
          zig cc -target x86_64-windows-gnu -municode -mwindows -O2 tools/verify-chat-delivery/launcher.c -o zig-out/bin/tmux.exe
          if ($LASTEXITCODE -ne 0) { throw 'tmux fixture build failed' }
      - name: Measure five everyday desktop actions
        shell: powershell
        run: ./tools/everyday-performance.ps1 -Exe zig-out/bin/multiprompt.exe -Evidence evidence -Revision "${{ github.sha }}" -Count ${{ inputs.samples }} -Trials 1 -Profile
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: speed-candidate-${{ github.run_id }}
          path: evidence
          if-no-files-found: error
          retention-days: 14
