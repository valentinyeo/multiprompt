      - name: Restore Zig (PR)
        if: steps.paths.outputs.heavy == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .zig-cache
            ${{ env.ZIG_GLOBAL_CACHE_DIR }}
          key: ${{ runner.os }}-zig-0.16.0-shards-v4-${{ matrix.arch }}-${{ hashFiles('build.zig', 'build.zig.zon') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-zig-0.16.0-shards-v4-${{ matrix.arch }}-
      - name: Install Zig 0.16.0
        if: steps.paths.outputs.heavy == 'true'
        uses: ./.github/actions/setup-zig
      - name: Test hosted rows retire once above their replies
        if: steps.paths.outputs.heavy == 'true' && matrix.arch == 'x64'
        run: timeout 180 node --test tools/chat-row-identity.test.js
      - name: Test Zig syntax preflight
        if: steps.paths.outputs.heavy == 'true' && matrix.arch == 'x64'
        run: node --test tools/check-zig-syntax.test.mjs
      - name: Test routing and message IDs
        if: steps.paths.outputs.heavy == 'true' && matrix.arch == 'x64'
        run: node --test tools/check-routing-ids.test.js
      - name: Check Zig syntax
        if: steps.paths.outputs.heavy == 'true'
