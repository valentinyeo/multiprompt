name: SOFT-2557 comment cleanup
on:
  workflow_dispatch:
    inputs:
      agent:
        required: true
        type: string
permissions:
  contents: read
  pull-requests: write
jobs:
  comment-sicko:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run pstack Comment Sicko on the scoped diff
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          AGENT: ${{ inputs.agent }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, urllib.request
          diff = subprocess.check_output(['git', 'diff', 'origin/master...HEAD', '--', 'src', 'tools', '.claude'], text=True)
          payload = {'model': 'deepseek-flash', 'messages': [
              {'role': 'system', 'content': os.environ['AGENT']},
              {'role': 'user', 'content': 'Goal: opening Multiprompt chat must keep messages steady. Scope is PR 1062, only the supplied diff. Report comment deletions, MUST KILL flags, restores, skips and open constraints. Do not review application behavior or write application code.\n\n' + diff}], 'max_tokens': 2500}
          request = urllib.request.Request('https://api.deepseek.com/chat/completions', data=json.dumps(payload).encode(), headers={'Authorization': 'Bearer ' + os.environ['DEEPSEEK_API_KEY'], 'Content-Type': 'application/json'})
          with urllib.request.urlopen(request, timeout=180) as response:
              result = json.load(response)
          text = result['choices'][0]['message']['content']
          if not text.startswith('Yes... Ha ha ha... Yes!'):
              raise RuntimeError('Comment Sicko did not follow its supplied agent definition')
          open('comment-sicko.md', 'w').write(text + '\n')
          print(text)
          PY
      - name: Post the cleanup report
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment 1062 --repo "$GITHUB_REPOSITORY" --body-file comment-sicko.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: soft-2557-comment-sicko
          path: comment-sicko.md
          if-no-files-found: error
