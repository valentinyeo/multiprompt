name: Transcript queue reconciliation

on:
  workflow_dispatch:
  schedule:
    - cron: '44 2 * * *'

permissions:
  contents: read

jobs:
  transcript-queue-reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Check chat delivery proof contracts
        continue-on-error: true
        run: node --test tools/verify-chat-delivery.test.js
      - name: Check Windows notification reader contracts
        run: node --test --test-name-pattern='^(Windows notification stand-in keeps the supplied reader push algorithm and emits appended data|native runner file descriptors share one Windows notification root with their fixture state)$' tools/verify-chat-delivery.test.js
      - name: Check recovery proof oracle
        run: node --test --test-name-pattern='^recovery oracle' tools/chat-resync.test.js
      - name: Check remote sync proof oracle
        run: node --test tools/chat-remote-sync-proof.test.mjs tools/remote-switch-proof.test.mjs tools/chat-missing-note-proof.test.mjs
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Require recorded transcript and identical-send fixtures to fail before the fix
        shell: bash
        run: |
          set -euo pipefail
          status=0
          python3 tools/chat-transcript-reconcile.test.py --before > red.log 2>&1 || status=$?
          cat red.log
          test "$status" -eq 1
          ! grep -q '^ERROR:' red.log
          grep -q '^FAIL: test_IGSH_835_recorded_transcript_clears_queue_on_next_refresh' red.log
          grep -q '^FAIL: test_IGSH_835_identical_sends_need_distinct_occurrences' red.log
          echo 'RED PROVEN: both fixtures fail on the pre-fix queue replay'
      - name: Prove transcript reconciliation regressions pass after the fix
        run: python3 tools/chat-transcript-reconcile.test.py
      - name: Run the complete reader regression suite
        run: python3 tools/chat-history-reader-test.py -v
      - name: Verify queue tracing diagnostics (report only)
        continue-on-error: true
        run: python3 -m unittest discover -s tools/verify-chat-delivery -p test_queue_trace.py -v
      - name: Verify shared reader selection
        run: python3 tools/chat-shared-runtime.test.py -v

  native-structural-replay:
    # Independent, report-only investigation; never a release gate.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Native identity model controls
        run: python3 -m unittest discover -s tools/chat-native-replay -p 'test_*.py' -v
      - name: Replay anonymized real-derived structural corpus
        run: python3 tools/chat-native-replay/replay.py tools/chat-native-replay/structural.jsonl.gz

  codex-socket-binding:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify synthetic socket boundaries
        run: python3 tools/chat-history-reader-test.py -k IGSH_1266 -v
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Install native Codex and tmux
        run: |
          npm install --prefix "$RUNNER_TEMP/codex-smoke" @openai/codex@0.166.0
          sudo apt-get update && sudo apt-get install -y tmux iproute2
      - name: Verify default daemon with isolated provider
        run: |
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_OS unshare --net bash -c 'ip link set lo up; python3 tools/verify-codex-hook/native-smoke.py "$1"' _ "$RUNNER_TEMP/codex-smoke/node_modules/.bin/codex"
