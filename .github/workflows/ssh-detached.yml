name: SSH helpers without consoles

on:
  schedule:
    - cron: '28 5 * * *'
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Real Windows OpenSSH runs detached with no console
        shell: pwsh
        run: ./tools/ssh-detached/proof.ps1
