name: Repeated idle polling proof
run-name: mbv-249 ${{ inputs.label }}
on:
  workflow_dispatch:
    inputs:
      label:
        description: Run label
        required: false
        default: measure
        type: string

permissions:
  contents: read

jobs:
  measure:
    name: measure ${{ matrix.side }}
    runs-on: windows-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - side: parent
            sha: 407338e086259e8bf198071335a77f6eb81b566b
          - side: head
            sha: 065db60dbdafad09f800fb8a737023825af211dc
    steps:
      - name: Keep LF line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: tooling
          ref: ${{ github.sha }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: subject
          ref: ${{ matrix.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Zig 0.16.0
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP/zig.zip"
          Invoke-WebRequest https://ziglang.org/download/0.16.0/zig-x86_64-windows-0.16.0.zip -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne '68659eb5f1e4eb1437a722f1dd889c5a322c9954607f5edcf337bc3684a75a7e') { throw 'Zig checksum mismatch' }
          tar -xf $zip -C $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { throw 'Zig extraction failed' }
          "$env:RUNNER_TEMP/zig-x86_64-windows-0.16.0" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: Build the app
        shell: pwsh
        working-directory: subject
        run: |
          zig build -Dtarget=x86_64-windows-gnu -Drelease=true "-Dversion=0.99.0"
          if ($LASTEXITCODE -ne 0) { throw 'App build failed' }
          git rev-parse HEAD
      - name: Build the SSH and tmux fixtures
        shell: pwsh
        run: |
          zig cc -target x86_64-windows-gnu -municode -O2 tooling/tools/verify-chat-delivery/launcher.c -o subject/zig-out/bin/ssh.exe
          if ($LASTEXITCODE -ne 0) { throw 'SSH fixture build failed' }
          zig cc -target x86_64-windows-gnu -municode -mwindows -O2 tooling/tools/verify-chat-delivery/launcher.c -o subject/zig-out/bin/tmux.exe
          if ($LASTEXITCODE -ne 0) { throw 'tmux fixture build failed' }
      - name: Measure twice
        shell: powershell
        run: |
          foreach ($run in 1, 2) {
            ./tooling/tools/mbv-249-measure.ps1 -Exe subject/zig-out/bin/multiprompt.exe -Evidence "evidence/run-$run" -Revision "${{ matrix.sha }}"
          }
          $global:LASTEXITCODE = 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mbv249-${{ matrix.side }}
          path: evidence
          if-no-files-found: warn
          retention-days: 14
