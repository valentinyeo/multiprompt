name: Runner message parity

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'

permissions:
  contents: read

concurrency:
  group: session-notes-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  notes:
    uses: ./.github/workflows/verify.yml
    with:
      feature: chat-delivery
      chat_notes_proof: true
