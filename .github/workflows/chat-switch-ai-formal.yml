name: chat-switch-ai-formal

on:
  push:
    paths:
      - '.claude/skills/verify-switch-ai-formal/**'
      - '.claude/skills/verify-multiprompt/features/chat-switch-ai-formal.md'
      - '.github/workflows/chat-switch-ai-formal.yml'
  pull_request:
    paths:
      - 'src/chat_history_reader.py'
      - 'tools/chat-switch-ai.test.js'
      - '.claude/skills/verify-switch-ai-formal/**'
      - '.claude/skills/verify-multiprompt/features/chat-switch-ai-formal.md'
      - '.github/workflows/chat-switch-ai-formal.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chat-switch-ai-formal-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  formal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Check switch AI, replay findings and catch planted breaks
        env:
          BASE: ${{ github.event.pull_request.base.sha || 'origin/master' }}
        run: python3 .claude/skills/verify-switch-ai-formal/check.py --self-test --inherit-from "$BASE" --output "$RUNNER_TEMP/switch-ai-formal"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: chat-switch-ai-formal
          path: ${{ runner.temp }}/switch-ai-formal/
          if-no-files-found: error