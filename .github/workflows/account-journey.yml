name: Account layout journey

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published version tag
        required: false
        type: string
      pictures:
        description: Run the live desktop-to-phone picture proof
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: read

concurrency:
  group: account-journey-${{ inputs.pictures && 'pictures' || github.run_id }}
  cancel-in-progress: false

jobs:
  desktop:
    if: ${{ !inputs.pictures }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Install pinned Windows Zig
        if: inputs.tag == ''
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\zig.zip"
          Invoke-WebRequest https://ziglang.org/download/0.16.0/zig-x86_64-windows-0.16.0.zip -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() -ne '68659eb5f1e4eb1437a722f1dd889c5a322c9954607f5edcf337bc3684a75a7e') { throw 'Zig checksum mismatch' }
          Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP
          "$env:RUNNER_TEMP\zig-x86_64-windows-0.16.0" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: Build the real app
        if: inputs.tag == ''
        shell: pwsh
        run: |
          zig build -Dtarget=x86_64-windows-gnu -Dcpu=baseline --summary all
          if ($LASTEXITCODE -ne 0) { throw 'App build failed' }
          New-Item -ItemType Directory -Force bin | Out-Null
          Copy-Item zig-out/bin/multiprompt.exe bin/multiprompt.exe
          Copy-Item zig-out/bin/zigshell-bridge.exe bin/zigshell-bridge.exe
      - name: Acquire published binaries
        if: inputs.tag != ''
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:RELEASE_TAG
          if ($tag -cnotmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') { throw 'Invalid release tag' }
          if ($env:GITHUB_REF -cne "refs/tags/$tag") { throw 'Dispatch ref must equal release tag' }
          $headSha = (git rev-parse HEAD).Trim()
          $tagSha = (git rev-parse "refs/tags/$tag^{commit}").Trim()
          if ($LASTEXITCODE -ne 0 -or $headSha -cne $tagSha -or $headSha -cne $env:GITHUB_SHA) { throw 'Release tag and checkout differ' }
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $release.tag_name -cne $tag -or $release.draft -or $release.prerelease) { throw 'Published release not found' }
          $releaseTarget = (git rev-parse --verify "$($release.target_commitish)^{commit}").Trim()
          if ($LASTEXITCODE -ne 0 -or $releaseTarget -cne $tagSha) { throw 'Published release target differs from tag' }
          New-Item -ItemType Directory -Force bin | Out-Null
          gh release download $tag --repo $env:GITHUB_REPOSITORY --dir bin --pattern multiprompt-x64.exe --pattern zigshell-bridge-x64.exe --pattern SHA256SUMS.txt
          if ($LASTEXITCODE -ne 0) { throw 'Release download failed' }
          $manifest = Get-Content bin/SHA256SUMS.txt
          foreach ($asset in @('multiprompt-x64.exe', 'zigshell-bridge-x64.exe')) {
            $lines = @($manifest | Where-Object { $_ -cmatch ('^[a-fA-F0-9]{64}\s+\*?' + [regex]::Escape($asset) + '$') })
            if ($lines.Count -ne 1) { throw "Missing or duplicate checksum for $asset" }
            $expected = $lines[0].Substring(0, 64).ToLowerInvariant()
            if ((Get-FileHash "bin/$asset" -Algorithm SHA256).Hash.ToLowerInvariant() -cne $expected) { throw "Checksum mismatch for $asset" }
          }
          Copy-Item bin/multiprompt-x64.exe bin/multiprompt.exe
          Copy-Item bin/zigshell-bridge-x64.exe bin/zigshell-bridge.exe
      - name: Record binary provenance
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $bytes = [IO.File]::ReadAllBytes("$PWD/bin/multiprompt.exe")
          $binaryText = [Text.Encoding]::GetEncoding(28591).GetString($bytes)
          $markers = [regex]::Matches($binaryText, 'MPVERSION=(\d+\.\d+\.\d+);')
          $versions = @($markers | ForEach-Object { $_.Groups[1].Value } | Select-Object -Unique)
          if ($versions.Count -ne 1) { throw 'Missing or inconsistent embedded version' }
          if ($env:RELEASE_TAG -and $versions[0] -cne $env:RELEASE_TAG.Substring(1)) { throw 'Embedded version differs from release tag' }
          $sha = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve source SHA' }
          New-Item -ItemType Directory -Force evidence | Out-Null
          [ordered]@{ mode = if ($env:RELEASE_TAG) { 'published' } else { 'branch-build' }; tag = $env:RELEASE_TAG; harness_sha = $sha; app_source_sha = $sha; app_sha256 = (Get-FileHash bin/multiprompt.exe -Algorithm SHA256).Hash.ToLowerInvariant(); bridge_sha256 = (Get-FileHash bin/zigshell-bridge.exe -Algorithm SHA256).Hash.ToLowerInvariant(); embedded_version = $versions[0]; run_url = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID" } | ConvertTo-Json | Set-Content evidence/provenance.json
      - name: Build the test account service
        working-directory: service
        shell: pwsh
        run: |
          npm ci --no-audit --no-fund --prefer-offline
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed' }
          npx wrangler deploy --dry-run --outdir .build
          if ($LASTEXITCODE -ne 0) { throw 'Worker build failed' }
      - name: Drive the real desktop against the account service
        shell: pwsh
        run: ./tools/account-journey/drive.ps1 -Exe "$PWD/bin/multiprompt.exe" -Output "$PWD/evidence"
      - name: Require native roundtrip evidence
        shell: pwsh
        run: |
          $result = Get-Content evidence/result.json -Raw | ConvertFrom-Json
          $devices = @($result.native_roundtrip.device_ids)
          if ($result.verdict -cne 'pass' -or $result.native_roundtrip.verdict -cne 'pass' -or $devices.Count -ne 2 -or !$devices[0] -or !$devices[1] -or $devices[0] -ceq $devices[1]) { throw 'Missing native roundtrip proof' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: account-journey-desktop
          path: |
            evidence/result.json
            evidence/provenance.json
            evidence/native-*.png
            evidence/native-*.json
            evidence/desktop-*.png
            evidence/desktop-*.json
          if-no-files-found: error

  picture-desktop:
    if: ${{ inputs.pictures }}
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install Zig 0.16.0
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP/zig.zip"
          Invoke-WebRequest https://ziglang.org/download/0.16.0/zig-x86_64-windows-0.16.0.zip -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne '68659eb5f1e4eb1437a722f1dd889c5a322c9954607f5edcf337bc3684a75a7e') { throw 'Zig checksum mismatch' }
          Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP
          "$env:RUNNER_TEMP/zig-x86_64-windows-0.16.0" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: Build the desktop app
        shell: pwsh
        run: |
          zig build -Dtarget=x86_64-windows-gnu -Dcpu=baseline --summary all
          if ($LASTEXITCODE -ne 0) { throw 'Desktop build failed' }
      - name: Upload the picture through the app
        shell: powershell
        env:
          PHOTO_PROOF_CREDENTIAL: ${{ secrets.IGSH_1612_PHOTO_PROOF }}
        run: ./tools/verify-account-photos/desktop.ps1 -Exe "$PWD/zig-out/bin/multiprompt.exe" -Evidence "$PWD/desktop-evidence"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: session-picture-desktop
          path: |
            desktop-evidence/*.png
            desktop-evidence/desktop.json
          if-no-files-found: error

  picture-android:
    if: ${{ inputs.pictures }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      COMPANION: ${{ github.workspace }}/companion
      MULTIPROMPT_DIR: ${{ github.workspace }}
      FIXTURE: ${{ github.workspace }}-photo-fixture
      EVIDENCE: ${{ github.workspace }}/phone-evidence
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: valentinyeo/multiprompt-android
          ref: fc9d6133e75c0fb22434beac3aa4a49e774becd9
          path: companion
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '9.5.1'
      - name: Build the Android app and test
        run: |
          cp tools/verify-account-photos/AccountPhotoProof.kt "$COMPANION/app/src/androidTest/java/dev/multiprompt/companion/ui/AccountPhotoProof.kt"
          cd "$COMPANION"
          gradle --no-daemon -Dorg.gradle.jvmargs=-Xmx3g assembleDebug assembleDebugAndroidTest
      - name: Start the SSH fixture
        run: bash "$COMPANION/tools/account-journey/fixture.sh"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm && test -w /dev/kvm
      - uses: reactivecircus/android-emulator-runner@1dcd0090116d15e7c562f8db72807de5e036a4ed
        env:
          PHOTO_PROOF_CREDENTIAL: ${{ secrets.IGSH_1612_PHOTO_PROOF }}
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          disk-size: 2G
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash tools/verify-account-photos/android.sh
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: session-picture-phone
          path: |
            phone-evidence/avatar.png
            phone-evidence/root.png
            phone-evidence/phone.json
          if-no-files-found: error

  picture-compare:
    if: ${{ inputs.pictures }}
    needs: [picture-desktop, picture-android]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: session-picture-desktop
          path: desktop
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: session-picture-phone
          path: phone
      - name: Check live propagation time
        run: node tools/check-account-picture-proof.mjs desktop/desktop.json phone/phone.json
