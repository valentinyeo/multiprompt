name: Release

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create, for example v0.28.712
        required: true

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Resolve release version and commit
        id: version
        env:
          REQUESTED_TAG: ${{ github.event.inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: |
          sha=$(git rev-parse HEAD)
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && git show-ref --verify --quiet "refs/tags/$REQUESTED_TAG"; then
            sha=$(git rev-parse "refs/tags/$REQUESTED_TAG^{commit}")
          fi
          git show "$sha:src/changelog.zig" > "$RUNNER_TEMP/changelog.zig"
          tag=$(node tools/release-version.mjs "$RUNNER_TEMP/changelog.zig" "$REQUESTED_TAG")
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    name: build-${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: x64
            target: x86_64-windows-gnu
          - arch: arm64
            target: aarch64-windows-gnu
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Install Zig 0.16.0
        run: |
          curl -sSfL https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz | tar -xJ
          echo "$PWD/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"
      - name: Build
        run: zig build -Dtarget=${{ matrix.target }}
      - name: Package
        run: |
          mkdir dist
          cp zig-out/bin/multiprompt.exe dist/multiprompt-${{ matrix.arch }}.exe
          cp zig-out/bin/zigshell-bridge.exe dist/zigshell-bridge-${{ matrix.arch }}.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: multiprompt-${{ matrix.arch }}
          path: dist/*

  release:
    needs: [prepare, build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ needs.prepare.outputs.tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: dist
          merge-multiple: true
      - name: Package extension and checksums
        run: |
          (cd extension && zip -r ../dist/multiprompt-extension.zip . -x 'themes/current/*')
          (cd dist && sha256sum *.exe *.zip > SHA256SUMS.txt)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          BUILT_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/master ]; then
            status=0
            git ls-remote --exit-code --tags origin "refs/tags/$TAG" || status=$?
            if [ "$status" = 0 ]; then
              echo "Tag $TAG already exists; skipping publication"
              exit 0
            fi
            if [ "$status" != 2 ]; then exit "$status"; fi
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping publication"
            exit 0
          fi
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$BUILT_SHA" \
            --latest --title "multiprompt $TAG" --generate-notes
