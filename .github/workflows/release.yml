name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create, for example v0.28.712
        required: true
      proof:
        description: Build both architectures without publishing
        type: boolean
        default: false
      publication_proof:
        description: Test publication ordering without building or publishing
        type: boolean
        default: false

  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    secrets:
      MULTIPROMPT_RELEASE_SIGNING_KEY:
        required: true

permissions:
  contents: write

jobs:
  publication-proof:
    if: inputs.publication_proof
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Prove forward-only publication
        run: node --test tools/release-version.test.mjs

  prepare:
    if: github.event_name != 'pull_request' && !inputs.publication_proof
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Verify release history on the branch
        if: inputs.proof
        run: node --test tools/version-stamp.test.mjs tools/release-version.test.mjs
      - name: Resolve release version and commit
        id: version
        env:
          REQUESTED_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          if [ -n "$REQUESTED_TAG" ] && git show-ref --verify --quiet "refs/tags/$REQUESTED_TAG"; then
            sha=$(git rev-parse "refs/tags/$REQUESTED_TAG^{commit}")
          fi
          git show "$sha:src/changelog.zig" > "$RUNNER_TEMP/changelog.zig"
          tag=$(node tools/release-version.mjs "$RUNNER_TEMP/changelog.zig")
          if [ -n "$REQUESTED_TAG" ]; then
            [[ "$REQUESTED_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
            tag=$REQUESTED_TAG
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  journeys:
    needs: prepare
    uses: ./.github/workflows/verify.yml
    with:
      feature: all
      revision: ${{ needs.prepare.outputs.sha }}

  build:
    needs: [prepare, journeys]
    name: build-${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: x64
            target: x86_64-windows-gnu
          - arch: arm64
            target: aarch64-windows-gnu
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - name: Install Zig 0.16.0
        run: |
          curl -sSfL https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz | tar -xJ
          echo "$PWD/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Build
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
          PROOF: ${{ inputs.proof }}
        run: |
          if [ "$PROOF" != true ]; then
            node tools/version-stamp.mjs build "$TAG"
          fi
          zig build -Dtarget=${{ matrix.target }} -Drelease=${{ github.event_name != 'pull_request' }} -Dversion="${TAG#v}"
          node --input-type=module - "$TAG" <<'NODE'
          import fs from 'node:fs';
          const expected = process.argv[2].slice(1);
          const versions = [...fs.readFileSync('zig-out/bin/multiprompt.exe').toString('latin1').matchAll(/MPVERSION=(\d+\.\d+\.\d+);/g)].map(match => match[1]);
          if (versions.length === 0 || versions.some(version => version !== expected)) throw new Error('Executable embedded version does not match release tag');
          NODE
      - name: Package
        run: |
          mkdir dist
          cp zig-out/bin/multiprompt.exe dist/multiprompt-${{ matrix.arch }}.exe
          cp zig-out/bin/zigshell-bridge.exe dist/zigshell-bridge-${{ matrix.arch }}.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: multiprompt-${{ matrix.arch }}
          path: dist/*

  release:
    needs: [prepare, build]
    permissions:
      contents: write
    if: github.event_name != 'pull_request' && !inputs.proof
    runs-on: ubuntu-latest
    concurrency:
      group: release-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: multiprompt-x64
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: multiprompt-arm64
          path: dist
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Publish plain versioned update notes
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node tools/version-stamp.mjs build "$TAG"
          node tools/release-notes.mjs src/changelog.zig "$TAG" dist/release-notes.json
      - name: Package extension and checksums
        run: |
          (cd extension && zip -r ../dist/multiprompt-extension.zip . -x 'themes/current/*')
          (cd dist && sha256sum *.exe *.zip release-notes.json > SHA256SUMS.txt)
      - name: Sign checksum manifest
        env:
          MULTIPROMPT_RELEASE_SIGNING_KEY: ${{ secrets.MULTIPROMPT_RELEASE_SIGNING_KEY }}
        run: node tools/sign-release.mjs
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          BUILT_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/master ]; then
            status=0
            git ls-remote --exit-code --tags origin "refs/tags/$TAG" || status=$?
            if [ "$status" = 0 ]; then
              echo "Tag $TAG already exists; skipping publication"
              exit 0
            fi
            if [ "$status" != 2 ]; then exit "$status"; fi
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping publication"
            exit 0
          fi
          published_tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')
          latest=$(node --input-type=module - "$TAG" "$published_tag" <<'NODE'
          const versions = process.argv.slice(2).map(tag => {
            const match = /^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.exec(tag);
            if (!match) throw new Error(`Invalid release tag: ${tag}`);
            return match.slice(1).map(BigInt);
          });
          const index = versions[0].findIndex((part, index) => part !== versions[1][index]);
          console.log(index !== -1 && versions[0][index] > versions[1][index]);
          NODE
          )
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$BUILT_SHA" \
            --latest="$latest" --title "multiprompt $TAG" --generate-notes

  runner-sessions:
    needs: [prepare, release]
    uses: ./.github/workflows/verify.yml
    with:
      feature: chat-delivery
      hax_sessions_proof: true
      tag: ${{ needs.prepare.outputs.tag }}
