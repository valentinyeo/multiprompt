name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Optional new release tag
        required: false
        type: string
  workflow_call:
    secrets:
      MULTIPROMPT_RELEASE_SIGNING_KEY:
        required: true
      HYPERTASK_AGENT_TOKEN:
        required: true

permissions:
  contents: write

concurrency:
  group: release-publication
  cancel-in-progress: false

jobs:
  gitleaks:
    uses: ./.github/workflows/gitleaks.yml
    with:
      release_scan: true

  prepare:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Require the permanent old-client update origin
        if: github.repository == 'valentinyeo/multibot'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/legacy-update-feed.mjs --check-origin
      - name: Resolve release version and commit
        id: version
        env:
          REQUESTED_TAG: ${{ inputs.tag || '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          if [ -n "$REQUESTED_TAG" ]; then
            [[ "$REQUESTED_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
            tag=$REQUESTED_TAG
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
              git fetch --no-tags origin "+refs/tags/$tag:refs/tags/$tag"
            else
              status=$?
              [ "$status" -eq 2 ] || exit "$status"
            fi
            if git show-ref --verify --quiet "refs/tags/$tag"; then
              sha=$(git rev-parse --verify "refs/tags/$tag^{commit}")
            fi
          else
            previous=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
            [[ "$previous" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
            if ! git rev-parse --verify --quiet "refs/tags/$previous^{commit}" >/dev/null; then
              git fetch --no-tags origin "refs/tags/$previous:refs/tags/$previous"
            fi
            base=$(git rev-parse --verify "refs/tags/$previous^{commit}")
            git merge-base --is-ancestor "$base" "$sha"
            git rev-list --first-parent "$sha" | grep -Fx "$base" >/dev/null || { echo 'Latest release is not on the first-parent history' >&2; exit 1; }
            distance=$(git rev-list --first-parent --count "$base..$sha")
            [ "$distance" -gt 0 ] || { echo 'No commits since latest release' >&2; exit 1; }
            tag=$(node --input-type=module - "$previous" "$distance" <<'NODE'
          const match = /^v(\d+)\.(\d+)\.(\d+)$/.exec(process.argv[2]);
          console.log(`v${match[1]}.${match[2]}.${BigInt(match[3]) + BigInt(process.argv[3])}`);
          NODE
            )
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Resolve authoritative release notes
        env:
          TAG: ${{ steps.version.outputs.tag }}
          SHA: ${{ steps.version.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
          HYPERTASK_AGENT_TOKEN: ${{ secrets.HYPERTASK_AGENT_TOKEN }}
        run: |
          test "$SHA" = "$(git rev-parse HEAD)" || { echo 'Release commit must be the trusted workflow commit' >&2; exit 1; }
          git merge-base --is-ancestor "$SHA" origin/master
          node tools/version-stamp.mjs build "$TAG"
          node tools/release-notes.mjs src/changelog.zig "$TAG" release-notes.json
      - name: Reserve release tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
          SHA: ${{ steps.version.outputs.sha }}
        run: |
          if remote=$(git ls-remote --exit-code origin "refs/tags/$TAG" "refs/tags/$TAG^{}"); then
            resolved=$(printf '%s\n' "$remote" | awk 'NR == 1 { sha = $1 } /\^\{\}$/ { sha = $1 } END { print sha }')
            [ "$resolved" = "$SHA" ] || { echo 'Release tag points to a different commit' >&2; exit 1; }
          else
            status=$?
            [ "$status" -eq 2 ] || exit "$status"
            git push origin "$SHA:refs/tags/$TAG"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-notes-source
          path: |
            src/changelog.zig
            release-notes.json
          if-no-files-found: error

  build:
    needs: prepare
    timeout-minutes: 15
    name: build-${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: x64
            target: x86_64-windows-gnu
          - arch: arm64
            target: aarch64-windows-gnu
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - name: Install Zig 0.16.0
        run: |
          curl -sSfL https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz -o zig.tar.xz
          echo "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  zig.tar.xz" | sha256sum -c -
          tar -xJf zig.tar.xz
          echo "$PWD/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-notes-source
      - name: Check Zig syntax
        run: node tools/check-zig-syntax.mjs
      - name: Build
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          zig build -Dtarget=${{ matrix.target }} -Drelease=${{ github.event_name != 'pull_request' }} -Dversion="${TAG#v}"
          node --input-type=module - "$TAG" <<'NODE'
          import fs from 'node:fs';
          const expected = process.argv[2].slice(1);
          const versions = [...fs.readFileSync('zig-out/bin/multibot.exe').toString('latin1').matchAll(/MPVERSION=(\d+\.\d+\.\d+);/g)].map(match => match[1]);
          if (versions.length === 0 || versions.some(version => version !== expected)) throw new Error('Executable embedded version does not match release tag');
          NODE
      - name: Package
        run: |
          mkdir dist
          cp zig-out/bin/multibot.exe dist/multiprompt-${{ matrix.arch }}.exe
          cp zig-out/bin/zigshell-bridge.exe dist/zigshell-bridge-${{ matrix.arch }}.exe
          cp zig-out/bin/multiprompt-dev.exe dist/multiprompt-dev-${{ matrix.arch }}.exe
      - name: Build the symbolized twin
        continue-on-error: true
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          zig build -Dtarget=${{ matrix.target }} -Drelease=${{ needs.prepare.outputs.tag != '' }} -Dsymbols -Dversion="${TAG#v}" --prefix zig-out-debug
          mkdir -p dist-symbols
          cp zig-out-debug/bin/multibot.exe dist-symbols/multiprompt-${{ matrix.arch }}-symbols.exe
          shopt -s nullglob
          for pdb in zig-out-debug/bin/*.pdb; do
            cp "$pdb" "dist-symbols/multiprompt-${{ matrix.arch }}-symbols.pdb"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: multiprompt-${{ matrix.arch }}
          path: dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: multiprompt-${{ matrix.arch }}-symbols
          path: dist-symbols/*
          if-no-files-found: warn

  launch:
    needs: [prepare, build]
    permissions:
      contents: read
      actions: read
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: multiprompt-x64
          path: release-bin
      - name: Restore installed bridge filename
        shell: powershell
        run: Copy-Item release-bin/zigshell-bridge-x64.exe release-bin/zigshell-bridge.exe
      - name: Open the built app and prove its main window
        shell: powershell
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
        run: ./tools/release-launch.ps1 -Exe release-bin/multiprompt-x64.exe -Evidence release-proof
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: release-launch-proof
          path: release-proof/
          if-no-files-found: error

  resource-observation:
    needs: [prepare, build]
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Test guard
        run: node --test tools/resource-guard/snapshot.test.mjs tools/resource-guard/evaluate.test.mjs tools/resource-guard/verify-baseline.test.mjs tools/resource-warning-ticket.test.mjs
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: multiprompt-x64
          path: release-bin
      - name: Prepare synthetic SSH and pinned baseline
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./tools/resource-guard/setup.ps1
          Copy-Item release-bin/zigshell-bridge-x64.exe release-bin/zigshell-bridge.exe
      - name: Test Windows resource staging and sessions
        shell: pwsh
        run: |
          ./tools/resource-guard/stage.test.ps1
          ./tools/resource-guard/session.test.ps1
      - name: Test owned TCP connections
        shell: pwsh
        run: ./tools/resource-guard/tcp.test.ps1
      - name: Test fixture process lifetime
        shell: pwsh
        run: ./tools/resource-guard/launcher-lifetime.test.ps1
      - name: Measure baseline
        shell: pwsh
        run: ./tools/resource-guard/measure.ps1 -Exe baseline-bin/multiprompt-x64.exe -Evidence resource-evidence/baseline -FixtureBin fixture-bin
      - name: Measure candidate
        shell: pwsh
        run: ./tools/resource-guard/measure.ps1 -Exe release-bin/multiprompt-x64.exe -Evidence resource-evidence/candidate -FixtureBin fixture-bin
      - name: Evaluate resource gate
        if: always()
        run: node tools/resource-guard/evaluate.mjs
      - name: File measured latency warnings
        if: always()
        continue-on-error: true
        env:
          HYPERTASK_AGENT_TOKEN: ${{ secrets.HYPERTASK_AGENT_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
        run: node tools/resource-warning-ticket.mjs resource-evidence/verdict.json "$env:RUN_URL" "$env:SOURCE_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: release-resource-observation
          path: resource-evidence/
          if-no-files-found: warn

  release:
    needs: [prepare, build, launch, gitleaks, resource-observation]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: multiprompt-x64
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: multiprompt-arm64
          path: dist
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-notes-source
      - name: Include versioned update notes
        run: cp release-notes.json dist/release-notes.json
      - name: Package extension and checksums
        run: |
          (cd extension && zip -r ../dist/multiprompt-extension.zip . -x 'themes/current/*')
          (cd dist && sha256sum *.exe *.zip release-notes.json > SHA256SUMS.txt)
      - name: Sign checksum manifest
        env:
          MULTIPROMPT_RELEASE_SIGNING_KEY: ${{ secrets.MULTIPROMPT_RELEASE_SIGNING_KEY }}
        run: node tools/sign-release.mjs
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        continue-on-error: true
        with:
          name: multiprompt-x64-symbols
          path: symbols
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        continue-on-error: true
        with:
          name: multiprompt-arm64-symbols
          path: symbols
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          BUILT_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing publication" >&2
            exit 1
          fi
          published_tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')
          latest=$(node --input-type=module - "$TAG" "$published_tag" <<'NODE'
          const versions = process.argv.slice(2).map(tag => {
            const match = /^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.exec(tag);
            if (!match) throw new Error(`Invalid release tag: ${tag}`);
            return match.slice(1).map(BigInt);
          });
          const index = versions[0].findIndex((part, index) => part !== versions[1][index]);
          console.log(index !== -1 && versions[0][index] > versions[1][index]);
          NODE
          )
          node --input-type=module <<'NODE' > release-body.txt
          import fs from 'node:fs';
          const document = JSON.parse(fs.readFileSync('dist/release-notes.json', 'utf8'));
          const release = document.releases[0];
          if (document.version !== process.env.TAG.slice(1) || !release?.changes?.length || release.changes.length !== release.tickets?.length) throw new Error('Invalid release notes');
          for (const [index, line] of release.changes.entries()) {
            const space = line.indexOf(' ');
            const title = line.slice(space + 1).replaceAll('&', '&amp;').replace(/[\\`*_{}\[\]()<>#+.!|~-]/g, '\\$&');
            console.log(`- [${line.slice(0, space)}](${release.tickets[index]}) ${title}`);
          }
          NODE
          remote=$(git ls-remote --exit-code origin "refs/tags/$TAG" "refs/tags/$TAG^{}")
          resolved=$(printf '%s\n' "$remote" | awk 'NR == 1 { sha = $1 } /\^\{\}$/ { sha = $1 } END { print sha }')
          [ "$resolved" = "$BUILT_SHA" ] || { echo 'Release tag does not point to the built commit' >&2; exit 1; }
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --latest="$latest" --title "multiprompt $TAG" --notes-file release-body.txt
      - name: Attach the symbolized twins for freeze reports
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          shopt -s nullglob
          files=(symbols/*symbols.exe)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No symbolized twin was built; freeze reports stay unnamed"
            exit 0
          fi
          gh release upload "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
