name: Retention compiler diagnostics
on:
  push:
    branches: [ceo/IGSH-934-diagnose]
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read signed release journey evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 40322784787 --repo valentinyeo/multiprompt -n verify-chat-full-history --dir proof
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          root=Path('proof')
          files=['retention.json','result.json','build.json','full-history/observation.json']
          for file in files:
              path=root/file
              if path.exists():
                  value=json.loads(path.read_text(encoding='utf-8-sig'))
                  if file.endswith('observation.json'): value={k:value[k] for k in ['error','steps'] if k in value}
                  print('::notice::'+file+' '+json.dumps(value).replace('%','%25'))
          path=root/'full-history/debug.log'
          if path.exists():
              log=path.read_text(encoding='utf-8-sig')
              arrivals=re.findall(r'PERF\[chat\]: receive to paint ms=(\d+) size=(\d+)',log)
              switches=re.findall(r'\[switch\] chat painted in (\d+) ms',log)
              print('::notice::TIMINGS '+json.dumps(dict(arrivals=arrivals,switches=switches)))
          PY
