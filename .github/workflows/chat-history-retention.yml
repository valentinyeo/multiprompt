name: Retained chat history
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - src/chat_history.zig
      - src/chat_session.zig
      - src/app_state.zig
      - tools/verify-chat-delivery/**
      - tools/chat-history-retention-proof.mjs
      - .github/workflows/verify.yml
      - .github/workflows/chat-history-retention.yml
  pull_request_review:
    types: [submitted]
  merge_group:
    paths:
      - src/chat_history.zig
      - src/chat_session.zig
      - src/app_state.zig
      - tools/verify-chat-delivery/**
      - tools/chat-history-retention-proof.mjs
      - .github/workflows/verify.yml
      - .github/workflows/chat-history-retention.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Decide whether this head runs Windows
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
          REVIEW: ${{ github.event.review.state }}
          DRAFT: ${{ github.event.pull_request.draft }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PATTERNS: |
            src/chat_history.zig
            src/chat_session.zig
            src/app_state.zig
            tools/verify-chat-delivery/**
            tools/chat-history-retention-proof.mjs
            .github/workflows/verify.yml
            .github/workflows/chat-history-retention.yml
        run: node tools/pr-windows-gate.mjs
  retention:
    needs: scope
    if: needs.scope.outputs.run == 'true'
    uses: ./.github/workflows/verify.yml
    with:
      feature: chat-full-history
      chat_retention_proof: true
