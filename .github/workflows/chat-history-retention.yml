name: Retained chat history
on:
  workflow_dispatch:
  schedule:
    - cron: '20 2 * * *'

permissions:
  contents: read
concurrency:
  group: chat-history-retention-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  retention:
    uses: ./.github/workflows/verify.yml
    with:
      feature: chat-full-history
      chat_retention_proof: true
