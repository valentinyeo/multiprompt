name: Bug report
description: Something in multiprompt does not work as expected
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: The version shown in the multiprompt title bar
      placeholder: v0.28.712
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version and machine
      placeholder: Windows 11 24H2, x64
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a new tab with Ctrl+T
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
      description: Screenshots help a lot
    validations:
      required: true
