name: Install FFmpeg
description: Install the pinned FFmpeg build from its pinned release archive, verify its checksum, reuse a cached install, and retry a failed download with backoff.

inputs:
  version:
    description: FFmpeg version the runner must provide
    required: false
    default: '7.1.1'
  sha256:
    description: SHA-256 of the pinned release archive for this version
    required: false
    default: '04861d3339c5ebe38b56c19a15cf2c0cc97f5de4fa8910e4d47e5e6404e4a2d4'

runs:
  using: composite
  steps:
    - name: Restore cached FFmpeg
      id: cache
      if: runner.os == 'Windows'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ${{ runner.temp }}/ffmpeg-${{ inputs.version }}
        key: ${{ runner.os }}-ffmpeg-${{ inputs.version }}-3
    - name: Install FFmpeg
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        FFMPEG_VERSION: ${{ inputs.version }}
        FFMPEG_SHA256: ${{ inputs.sha256 }}
        FFMPEG_TARGET: ${{ runner.temp }}/ffmpeg-${{ inputs.version }}
        FFMPEG_CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
      run: |
        $ErrorActionPreference = 'Stop'
        $ProgressPreference = 'SilentlyContinue'
        $pinned = $env:FFMPEG_VERSION
        $sourceSha = "$($env:FFMPEG_SHA256)".ToLowerInvariant()
        $limit = 5
        $target = $env:FFMPEG_TARGET
        $archive = "https://github.com/GyanD/codexffmpeg/releases/download/$pinned/ffmpeg-$pinned-essentials_build.zip"
        $reports = "version n?$([regex]::Escape($pinned))\b"
        function Use-Ffmpeg([string]$directory) {
          $exe = Join-Path $directory 'ffmpeg.exe'
          if (-not (Test-Path $exe)) { throw "FFmpeg $pinned is missing from $directory" }
          $first = (& $exe -version 2>$null | Select-Object -First 1)
          if ($LASTEXITCODE -ne 0 -or -not $first) { throw "FFmpeg $pinned does not run from $directory" }
          if ($first -notmatch $reports) { throw "FFmpeg from $directory reports '$first' instead of $pinned" }
          Add-Content -Path $env:GITHUB_PATH -Value $directory
          Write-Host "FFmpeg ready: $first"
        }
        if ($env:FFMPEG_CACHE_HIT -eq 'true' -and (Test-Path (Join-Path $target 'ffmpeg.exe'))) {
          $cached = (& (Join-Path $target 'ffmpeg.exe') -version 2>$null | Select-Object -First 1)
          if ($LASTEXITCODE -eq 0 -and $cached -match $reports) {
            Write-Host "FFmpeg $pinned restored from cache"
            Use-Ffmpeg $target
            exit 0
          }
          Write-Host "FFmpeg $pinned restored from cache but does not run; installing a fresh copy"
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $target
        }
        $existing = Get-Command ffmpeg -ErrorAction SilentlyContinue
        if ($existing) {
          $first = (& $existing.Source -version 2>$null | Select-Object -First 1)
          if ($LASTEXITCODE -eq 0 -and $first -match $reports) {
            Write-Host "FFmpeg $pinned already available at $($existing.Source)"
            exit 0
          }
        }
        $failure = ''
        for ($attempt = 1; $attempt -le $limit; $attempt++) {
          Write-Host "FFmpeg $pinned download attempt $attempt of $limit from $archive"
          try {
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $target
            Remove-Item -Force -ErrorAction SilentlyContinue "$target.zip"
            Invoke-WebRequest -Uri $archive -OutFile "$target.zip" -UseBasicParsing
            $actual = (Get-FileHash -Path "$target.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $sourceSha) { throw "FFmpeg $pinned archive hash $actual does not match the pinned $sourceSha" }
            Expand-Archive -Path "$target.zip" -DestinationPath "$target.extract" -Force
            $bin = Get-ChildItem -Path "$target.extract" -Recurse -Filter ffmpeg.exe | Select-Object -First 1
            if (-not $bin) { throw "FFmpeg $pinned archive carries no ffmpeg.exe" }
            New-Item -ItemType Directory -Force -Path $target | Out-Null
            Copy-Item -Path (Join-Path $bin.Directory.FullName '*') -Destination $target -Recurse -Force
            Use-Ffmpeg $target
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "$target.zip", "$target.extract"
            exit 0
          } catch {
            $failure = $_.Exception.Message
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "$target.zip", "$target.extract"
            if ($attempt -lt $limit) {
              $delay = [int][Math]::Min(60, 5 * [Math]::Pow(2, $attempt - 1))
              Write-Host "FFmpeg $pinned download attempt $attempt failed: $failure; retrying in $($delay)s"
              Start-Sleep -Seconds $delay
            }
          }
        }
        Write-Host "FFmpeg $pinned download failed: $failure"
        throw "FFmpeg $pinned install failed after $limit attempts"
    - name: Install FFmpeg
      if: runner.os != 'Windows'
      shell: bash
      env:
        FFMPEG_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        pinned="$FFMPEG_VERSION"
        limit=5
        if command -v ffmpeg >/dev/null 2>&1; then
          echo "FFmpeg already available: $(ffmpeg -version 2>/dev/null | head -1)"
          exit 0
        fi
        attempt=1
        while [ "$attempt" -le "$limit" ]; do
          echo "FFmpeg $pinned install attempt $attempt of $limit"
          if sudo apt-get update -qq && sudo apt-get install -y ffmpeg; then
            echo "FFmpeg ready: $(ffmpeg -version | head -1)"
            exit 0
          fi
          if [ "$attempt" -lt "$limit" ]; then
            delay=$((5 * 2 ** (attempt - 1)))
            if [ "$delay" -gt 60 ]; then delay=60; fi
            echo "FFmpeg $pinned install attempt $attempt failed; retrying in ${delay}s"
            sleep "$delay"
          fi
          attempt=$((attempt + 1))
        done
        echo "FFmpeg $pinned install failed after $limit attempts" >&2
        exit 1
