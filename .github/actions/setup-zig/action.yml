name: Set up Zig
description: Restore the pinned Zig archive from cache, download it with a time limit and retries on a miss, check its checksum and add Zig to PATH.

inputs:
  mirror:
    description: Optional Zig community mirror; the pinned archive checksum is still required
    required: false
    default: ''
  cache:
    description: Restore the optional archive cache before downloading
    required: false
    default: 'true'
  version:
    description: Zig version the job must use
    required: false
    default: '0.16.0'

runs:
  using: composite
  steps:
    - name: Restore the Zig archive
      if: inputs.cache != 'false'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ${{ runner.temp }}/zig-archive-${{ inputs.version }}
        key: ${{ runner.os }}-zig-archive-${{ inputs.version }}
    - name: Install Zig
      if: runner.os != 'Windows'
      shell: bash
      env:
        ZIG_VERSION: ${{ inputs.version }}
        ZIG_MIRROR: ${{ inputs.mirror }}
        ZIG_ARCHIVE: ${{ runner.temp }}/zig-archive-${{ inputs.version }}/zig.tar.xz
      run: |
        set -euo pipefail
        archive="$ZIG_ARCHIVE"
        toolchain="$RUNNER_TEMP/zig-x86_64-linux-$ZIG_VERSION"
        case "$ZIG_VERSION" in
          0.16.0) expected=70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00 ;;
          *) echo "No pinned Zig checksum for $ZIG_VERSION" >&2; exit 1 ;;
        esac
        mkdir -p "$(dirname "$archive")"
        echo "$toolchain" >> "$GITHUB_PATH"
        if [ -x "$toolchain/zig" ]; then
          echo "Zig $ZIG_VERSION already installed at $toolchain"
          exit 0
        fi
        if [ -f "$archive" ] && ! echo "$expected  $archive" | sha256sum -c - >/dev/null 2>&1; then
          echo "Discarding a cached Zig archive that does not match its checksum"
          rm -f "$archive"
        fi
        if [ ! -f "$archive" ]; then
          url="https://ziglang.org/download/$ZIG_VERSION/zig-x86_64-linux-$ZIG_VERSION.tar.xz"
          if [ -n "$ZIG_MIRROR" ]; then url="${ZIG_MIRROR%/}/zig-x86_64-linux-$ZIG_VERSION.tar.xz"; fi
          curl -fsSL --connect-timeout 20 --max-time 240 --speed-limit 2048 --speed-time 45 --retry 3 --retry-max-time 300 "$url" -o "$archive"
        fi
        echo "$expected  $archive" | sha256sum -c -
        tar -xf "$archive" -C "$RUNNER_TEMP"
        "$toolchain/zig" version
    - name: Install Zig
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        ZIG_VERSION: ${{ inputs.version }}
        ZIG_MIRROR: ${{ inputs.mirror }}
        ZIG_ARCHIVE: ${{ runner.temp }}/zig-archive-${{ inputs.version }}/zig.zip
      run: |
        $ErrorActionPreference = 'Stop'
        $pinned = $env:ZIG_VERSION
        $archive = $env:ZIG_ARCHIVE
        $toolchain = Join-Path $env:RUNNER_TEMP "zig-x86_64-windows-$pinned"
        switch ($pinned) {
          '0.16.0' { $expected = '68659eb5f1e4eb1437a722f1dd889c5a322c9954607f5edcf337bc3684a75a7e' }
          default { throw "No pinned Zig checksum for $pinned" }
        }
        New-Item -ItemType Directory -Force -Path (Split-Path $archive) | Out-Null
        $toolchain | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
        $zig = Join-Path $toolchain 'zig.exe'
        if (Test-Path $zig) {
          Write-Host "Zig $pinned already installed at $toolchain"
          exit 0
        }
        $limit = 4
        $deadline = (Get-Date).AddMinutes(5)
        for ($attempt = 1; $attempt -le $limit; $attempt++) {
          if (Test-Path $archive) {
            if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -eq $expected) { break }
            Write-Host 'Discarding a Zig archive that does not match its checksum'
            Remove-Item -Force $archive
          }
          if ((Get-Date) -gt $deadline) { break }
          Write-Host "Zig $pinned download attempt $attempt of $limit"
          try {
            $url = "https://ziglang.org/download/$pinned/zig-x86_64-windows-$pinned.zip"
            if ($env:ZIG_MIRROR) { $url = "$($env:ZIG_MIRROR.TrimEnd('/'))/zig-x86_64-windows-$pinned.zip" }
            Invoke-WebRequest $url -OutFile $archive -TimeoutSec 180
          } catch {
            Write-Host "Zig $pinned download attempt $attempt failed: $_"
            Remove-Item -Force -ErrorAction SilentlyContinue $archive
          }
        }
        if (-not (Test-Path $archive)) { throw "Zig $pinned download failed after $limit attempts" }
        $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
        if ($hash -ne $expected) { throw "Zig checksum mismatch: $hash" }
        Expand-Archive -Path $archive -DestinationPath $env:RUNNER_TEMP -Force
        if (-not (Test-Path $zig)) { throw "Zig $pinned did not extract to $toolchain" }
        & $zig version
        if ($LASTEXITCODE -ne 0) { throw "Zig $pinned does not run from $toolchain" }
