name: Set up Zig
description: Restore the pinned Zig toolchain from the shared cache, otherwise download it from the official source or a community mirror inside a time budget, check its checksum and add Zig to PATH.

inputs:
  version:
    description: Zig version the job must use
    required: false
    default: '0.16.0'

runs:
  using: composite
  steps:
    - name: Restore the Zig toolchain
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ${{ runner.temp }}/zig-x86_64-${{ runner.os == 'Windows' && 'windows' || 'linux' }}-${{ inputs.version }}
        key: ${{ runner.os }}-zig-toolchain-${{ inputs.version }}
    - name: Install Zig
      if: runner.os != 'Windows'
      shell: bash
      env:
        ZIG_VERSION: ${{ inputs.version }}
        ZIG_DOWNLOAD: ${{ runner.temp }}/zig-download-${{ inputs.version }}/zig.tar.xz
      run: |
        set -euo pipefail
        archive="$ZIG_DOWNLOAD"
        toolchain="$RUNNER_TEMP/zig-x86_64-linux-$ZIG_VERSION"
        case "$ZIG_VERSION" in
          0.16.0) expected=70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00 ;;
          *) echo "No pinned Zig checksum for $ZIG_VERSION" >&2; exit 1 ;;
        esac
        echo "$toolchain" >> "$GITHUB_PATH"
        if [ -x "$toolchain/zig" ] && "$toolchain/zig" version | grep -qx "$ZIG_VERSION"; then
          echo "Restored Zig $ZIG_VERSION from the shared cache at $toolchain"
          exit 0
        fi
        rm -rf "$toolchain"
        mkdir -p "$(dirname "$archive")"
        node tools/zig-download.mjs --version "$ZIG_VERSION" --target x86_64-linux --sha256 "$expected" --dest "$archive" --budget-seconds 240 --per-source-seconds 75
        tar -xf "$archive" -C "$RUNNER_TEMP"
        "$toolchain/zig" version
    - name: Install Zig
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        ZIG_VERSION: ${{ inputs.version }}
        ZIG_DOWNLOAD: ${{ runner.temp }}/zig-download-${{ inputs.version }}/zig.zip
      run: |
        $ErrorActionPreference = 'Stop'
        $pinned = $env:ZIG_VERSION
        $archive = $env:ZIG_DOWNLOAD
        $toolchain = Join-Path $env:RUNNER_TEMP "zig-x86_64-windows-$pinned"
        switch ($pinned) {
          '0.16.0' { $expected = '68659eb5f1e4eb1437a722f1dd889c5a322c9954607f5edcf337bc3684a75a7e' }
          default { throw "No pinned Zig checksum for $pinned" }
        }
        $toolchain | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
        $zig = Join-Path $toolchain 'zig.exe'
        if (Test-Path $zig) {
          $restored = & $zig version 2>$null
          if ($LASTEXITCODE -eq 0 -and "$restored".Trim() -eq $pinned) {
            Write-Host "Restored Zig $pinned from the shared cache at $toolchain"
            exit 0
          }
        }
        Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $toolchain
        New-Item -ItemType Directory -Force -Path (Split-Path $archive) | Out-Null
        node tools/zig-download.mjs --version $pinned --target x86_64-windows --sha256 $expected --dest $archive --budget-seconds 240 --per-source-seconds 75
        if ($LASTEXITCODE -ne 0) { throw "Zig $pinned download failed" }
        Expand-Archive -Path $archive -DestinationPath $env:RUNNER_TEMP -Force
        if (-not (Test-Path $zig)) { throw "Zig $pinned did not extract to $toolchain" }
        & $zig version
        if ($LASTEXITCODE -ne 0) { throw "Zig $pinned does not run from $toolchain" }
