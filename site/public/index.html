<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Multibot</title>
<meta name="description" content="Sign in to Multibot or deploy your own hub to Cloudflare.">
<meta name="theme-color" content="#101010">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/site.css">
</head>
<body>
<main>
  <h1>Multibot</h1>
  <p class="lede">Your AI agents, on your computers, from anywhere.</p>
  <section class="card" aria-labelledby="own">
    <h2 id="own">Run your own hub</h2>
    <a class="button primary" href="https://deploy.workers.cloudflare.com/?url=https://github.com/valentinyeo/multiprompt/tree/master/service">Deploy to Cloudflare</a>
    <p class="hint">Your chats and keys stay in your own accounts. SSH keys never leave your computer.</p>
  </section>
  <div class="or"><span>or use ours</span></div>
  <div class="pair">
    <a class="button secondary" href="https://account.multiprompt.dev/signin">Sign in with passkey</a>
    <a class="button secondary" href="https://account.multiprompt.dev/signin">Create account</a>
  </div>
  <a class="link" href="https://multiprompt.dev/docs/install/">Download for Windows</a>
</main>
</body>
</html>
