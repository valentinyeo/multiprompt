  '''^DCA1BJZdQXTT7L1cXnd6Gd13WirAMa0OIOPjFsE1jDM=$''',
  # vaultKey: published test input, exercised by src/sync_protocol.zig.
  '''^1M0RyVORDep4eafLm8oBTtbAct2564ukkgcdPkZPU3k=$''',
  # kek: published test input, exercised by src/sync_protocol.zig.
  '''^1VkDPkH9ITbidlRIxQ1Y93TbwlbmCKhT\+GyKVe\+2NnY=$''',
  # vaultKey: published test input, exercised by src/sync_protocol.zig.
  '''^z9Mctj/Vy\+KC/T7Vvqfvq8Gku52QVmDI3Zzpk2fvUsE=$''',
  # kek: published test input, exercised by src/sync_protocol.zig.
  '''^2AvqpEHvlVoaxqrJXCdf9o\+wpBT99VeLST2CgM7dTJI=$''',
  # vaultKey: published test input, exercised by src/sync_protocol.zig.
  '''^AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=$''',
  # vaultKey: published test input, exercised by src/sync_protocol.zig.
  '''^KoBEqtQcor8xHDyYJSi3vzzOzPHEC\+VSjpGmyaCJJOg=$''',
