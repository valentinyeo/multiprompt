[[allowlists]]
description = "Unsigned example JWT for payload parsing; fake signature is literally sig"
regexTarget = "secret"
regexes = [
  '''^eyJhbGciOiJSUzI1NiJ9\.eyJlbWFpbCI6InVzZXJAZXhhbXBsZS5jb20iLCJzdWIiOiJ1MSJ9\.sig$''',
  '''^eyJhbGciOiJSUzI1NiJ9\.eyJlbWFpbCI6InZhbGVudGluQGV4YW1wbGUuY29tIiwic3ViIjoidTEifQ\.sig$''',
]

[[allowlists]]
description = "Git blob ids that pin each stored public file to the private version it was cleaned from"
regexTarget = "line"
regexes = ['''(?m)^    "[A-Za-z0-9_./-]+": "[0-9a-f]{40}",?$''']

