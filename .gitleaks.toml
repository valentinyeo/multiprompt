[[allowlists]]
description = "Unsigned example JWT for payload parsing; fake signature is literally sig"
condition = "AND"
paths = ['src/sync_auth\.zig$']
regexTarget = "secret"
regexes = [
  '''^eyJhbGciOiJSUzI1NiJ9\.eyJlbWFpbCI6InVzZXJAZXhhbXBsZS5jb20iLCJzdWIiOiJ1MSJ9\.sig$''',
]
